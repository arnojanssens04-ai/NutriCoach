<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnésium et stress (montage test)</title>
<link rel="stylesheet" href="../effets/fx.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#111}
body{display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif}
html.alpha,body.alpha,body.alpha #stage{background:transparent!important}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;flex:none;background:linear-gradient(160deg,#6d7f78,#2a3430)}
.emo{font-family:'Noto Color Emoji','Apple Color Emoji',sans-serif;font-style:normal}
/* sous-titres éditoriaux : italique à empattements, groupes de 2 à 5 mots, changement sec */
#subs{position:absolute;left:90px;width:900px;height:150px}
.sb{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;opacity:0;text-align:center}
.sb > div{font-family:'Jost',sans-serif;font-style:normal;font-weight:600;font-size:58px;line-height:1.08;letter-spacing:.015em;color:#fff;text-wrap:balance;
  -webkit-text-stroke:8px rgba(12,22,17,.92);paint-order:stroke fill;text-shadow:0 4px 14px rgba(0,0,0,.45)}
.sb b{font-weight:700;color:#F6DDA6}
/* animations : petits dessins sur la chemise, sous le menton */
#anim{position:absolute;left:100px;width:860px;height:210px}
.cs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden}
.cs svg{overflow:visible;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
svg .tx{font-family:'Inter',sans-serif;font-weight:900;fill:#fff;paint-order:stroke;stroke:#14201A;stroke-width:7px;stroke-linejoin:round}
svg .ar{font-family:'Archivo',sans-serif;fill:#B8923A;letter-spacing:.14em}
/* gros titres en haut (inspirés de la vidéo virale) : serif capitales, derrière rien, jamais pendant un zoom */
#titles{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
.tt{position:absolute;left:40px;width:1000px;top:218px;text-align:center;opacity:0;font-family:'Jost',sans-serif;font-weight:600;text-transform:uppercase;font-size:92px;font-weight:700;line-height:1;letter-spacing:.18em;padding-left:.18em}
.tt span{display:inline-block;background:linear-gradient(105deg,#17372A 0%,#2D5A43 30%,#F8F1D6 46%,#2D5A43 58%,#17372A 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(255,255,255,.55)) drop-shadow(0 6px 14px rgba(0,0,0,.28))}
.tt i{display:block;height:3px;margin:14px auto 0;width:0;background:linear-gradient(90deg,transparent,#C9A25A,transparent)}
@font-face{font-family:'Jost';src:url(../effets/fonts/jost-latin-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:'Jost';src:url(../effets/fonts/jost-latin-600-normal.woff2) format('woff2');font-weight:600}
@font-face{font-family:'Jost';src:url(../effets/fonts/jost-latin-700-normal.woff2) format('woff2');font-weight:700}
.cs svg{box-sizing:content-box;padding:14px 20px;border-radius:30px;background:rgba(18,32,25,.62);border:1.5px solid rgba(255,255,255,.4);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="stage">
 <div id="anim">
  <!-- A : batterie faible (« si tu en manques ») -->
  <div class="cs" id="cA"><svg id="vA" width="300" height="120" viewBox="0 0 300 120"><g id="vA-g">
    <rect x="14" y="20" width="240" height="80" rx="20" fill="none" stroke="#fff" stroke-width="5"/><rect x="258" y="42" width="16" height="36" rx="6" fill="#fff"/>
    <rect id="vA-bar" x="26" y="32" width="0" height="56" rx="12" fill="#E8957A"/></g></svg></div>
  <!-- B : jauge -->
  <div class="cs" id="cB"><svg id="vB" width="330" height="150" viewBox="0 0 330 150">
    <path d="M30 132 A135 135 0 0 1 300 132" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".35"/>
    <path id="vB-arc" d="M30 132 A135 135 0 0 1 300 132" fill="none" stroke="#E8957A" stroke-width="11" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100"/>
    <g id="vB-n" transform="translate(165 132) rotate(60)"><path d="M-5 0 L0 -112 L5 0Z" fill="#fff"/><circle r="10" fill="#fff"/></g></svg></div>
  <!-- C : stress et fatigue qui baissent -->
  <div class="cs" id="cC"><svg id="vC" width="360" height="120" viewBox="0 0 360 120">
    <rect x="10" y="22" width="300" height="24" rx="12" fill="#fff" opacity=".18"/><rect id="vC-b1" x="10" y="22" width="300" height="24" rx="12" fill="#E8957A"/>
    <rect x="10" y="74" width="300" height="24" rx="12" fill="#fff" opacity=".18"/><rect id="vC-b2" x="10" y="74" width="300" height="24" rx="12" fill="#F3D9A0"/>
    <path id="vC-ar" d="M338 40 v36 m-12 -12 l12 13 l12 -13" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0"/></svg></div>
  <!-- D : gélule -->
  <div class="cs" id="cD"><svg id="vD" width="360" height="130" viewBox="0 0 360 130">
    <g id="vD-p" transform="translate(130 70) rotate(-28)"><rect x="-82" y="-30" width="164" height="60" rx="30" fill="none" stroke="#fff" stroke-width="5"/><path d="M0 -30 H52 A30 30 0 0 1 52 30 H0Z" fill="#F3D9A0"/></g>
    <path id="vD-sp" d="M12 34 l16 -22 l12 28 l18 -34 l14 32" fill="none" stroke="#F3D9A0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="0 100"/>
    <g id="vD-x" opacity="0"><circle cx="292" cy="65" r="40" fill="none" stroke="#E8957A" stroke-width="6"/><path d="M274 47 L310 83 M310 47 L274 83" stroke="#E8957A" stroke-width="8" stroke-linecap="round"/></g></svg></div>
  <!-- E : assiette -->
  <div class="cs" id="cE"><svg id="vE" width="460" height="130" viewBox="0 0 460 130">
    <g id="vE-pl"><ellipse cx="230" cy="70" rx="222" ry="52" fill="#fff" opacity=".12" stroke="#fff" stroke-width="4"/><ellipse cx="230" cy="70" rx="176" ry="36" fill="none" stroke="#fff" stroke-width="2.5" opacity=".6"/></g>
    <text id="vE-1" class="emo" x="105" y="92" font-size="70" text-anchor="middle" opacity="0">🥜</text>
    <text id="vE-2" class="emo" x="230" y="92" font-size="70" text-anchor="middle" opacity="0">🫘</text>
    <text id="vE-3" class="emo" x="355" y="92" font-size="70" text-anchor="middle" opacity="0">🌾</text></svg></div>
  <!-- F : calendrier (4 à 8 semaines) -->
  <div class="cs" id="cF"><svg id="vF" width="330" height="130" viewBox="0 0 330 130"><g id="vF-g">
    <rect x="10" y="12" width="310" height="108" rx="18" fill="none" stroke="#fff" stroke-width="5"/><path d="M10 30 a18 18 0 0 1 18 -18 H302 a18 18 0 0 1 18 18 V46 H10Z" fill="#F3D9A0"/>
    <g id="vF-n" opacity="0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M44 84 l9 9 l17 -19"/><path d="M104 84 l9 9 l17 -19"/><path d="M164 84 l9 9 l17 -19"/><path d="M224 84 l9 9 l17 -19"/></g></g></svg></div>
 </div>
 <div id="titles"></div>
 <div id="subs"></div>
</div>
<script>
/* ---------- texte : groupes d'indices de mots (words.json de Whisper) ---------- */
const P=new URLSearchParams(location.search); const ALPHA=P.get('alpha')==='1';
if(ALPHA){document.documentElement.classList.add('alpha');document.body.classList.add('alpha');}
const W=window.WORDS.words, TOTAL=window.WORDS.total||42.4;
/* [premier mot, dernier mot, texte affiché (*mot clé*)] */
const CHUNKS=[[0,1,'Le *magnésium*'],[2,6,'n’est pas un *antistress*,'],[7,11,'mais il peut t’aider'],[12,14,'à une *condition*.'],[15,16,'La condition'],[17,20,'que tu en *manques*.'],
[21,23,'Dans les études'],[24,28,'qui ont donc été effectuées'],[29,31,'sur le sujet,'],[32,36,'ce sont surtout les personnes'],[37,41,'avec un taux *très faible*'],[42,46,'qui profitent de l’effet'],[47,50,'du *magnésium* pour réduire'],[51,52,'leur *stress*'],[53,55,'et leur *fatigue*.'],
[56,58,'Donc une *gélule*'],[59,61,'prise au hasard'],[62,66,'pendant un pic de stress,'],[67,71,'ce n’est pas forcément'],[72,74,'la bonne idée.'],
[75,79,'Mais ça ne veut pas'],[80,83,'dire non plus que'],[84,86,'c’est *inutile*.'],[87,90,'Alors voici ce que'],[91,93,'tu peux faire'],[94,96,'*dès ce soir*.'],
[97,100,'Vérifie que ton assiette'],[101,103,'apporte du *magnésium*,'],[104,107,'que ce soit avec'],[108,109,'des *noix*,'],[110,111,'des *légumineuses*'],[112,115,'et des *céréales complètes*.'],
[116,119,'Et si tu prends'],[120,123,'quand même des gélules'],[124,125,'de magnésium,'],[126,130,'fais-le sur une durée'],[131,135,'de *4 à 8 semaines*.'],
[136,138,'Alors maintenant que'],[139,142,'tu sais tout ça,'],[143,145,'n’oublie pas,'],[146,149,'mange l’esprit *tranquille*.']];
const CH=CHUNKS.map(([a,b,tx],i)=>({t0:W[a].t0-.1,tw:W[b].t1,text:tx,i}));
CH.forEach((c,i)=>{ const nx=CH[i+1]; c.t1=nx?Math.min(nx.t0,c.tw+.9):TOTAL; if(nx&&nx.t0-c.tw>.9) c.t1=c.tw+.5; });
const word=i=>W[i].t0;
/* ---------- maths ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),p=(t,a,b)=>clamp((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),eb=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);},sm=x=>x*x*(3-2*x);
const $=s=>document.querySelector(s);
/* ---------- coupes-zoom sèches (zoom_render.py les applique à la vidéo seule) ---------- */
const ZC={x:540,y:600};
const ZOOMS=[{t0:3.55,d:1.8},{t0:21.75,d:2.3},{t0:34.25,d:2.0}].map(z=>({t0:z.t0,in:.06,hold:z.d-.12,out:.06,amp:.45}));
function zoomAt(t){let s=1;ZOOMS.forEach(z=>{const u=clamp((t-z.t0)/z.in),v=clamp((t-z.t0-z.in-z.hold)/z.out);s+=z.amp*sm(u)*(1-sm(v));});return s;}
/* ---------- où est le visage (mesuré) ---------- */
const ZN=Object.assign({closeups:[],faces:[],nodet:[]},window.ZONES||{});
function fbAt(t){let v;
  if(ZN.nodet.some(([a,b])=>t>=a&&t<=b))v=1630;
  else{let m=0,f=false;ZN.faces.forEach(([ft,x,y,w,h])=>{if(Math.abs(ft-t)<=.3){m=Math.max(m,y+h+60);f=true;}});
    if(f)v=m;else{let best=1630,bd=9;ZN.faces.forEach(([ft,x,y,w,h])=>{const d=Math.abs(ft-t);if(d<bd){bd=d;best=y+h+60;}});v=bd<=1?best:1630;}}
  return ZC.y+(v-ZC.y)*zoomAt(t);}
function topAt(t){let s=0,n=0;for(let d=-.2;d<=.2001;d+=.05){s+=fbAt(t+d);n++;}return Math.max(1075,s/n+12);}
/* ---------- événements visuels : carte, début, fin ---------- */
const CARDS=[
 {id:'cA',a:word(17)-.1,b:word(21)+.1},
 {id:'cB',a:word(40)-.55,b:word(42)+.5},
 {id:'cC',a:word(50)-.1,b:word(56)-.05},
 {id:'cD',a:word(58)-.1,b:word(75)-.5},
 {id:'cE',a:word(100)-.2,b:word(116)-.25},
 {id:'cF',a:word(131)-.2,b:word(136)-.1}];
const TITLES=[{a:.15,b:2.5,l:'Magnésium'},{a:word(94)-.2,b:word(97)+.35,l:'Dès ce soir'}];
TITLES.forEach((t,i)=>{const d=document.createElement('div');d.className='tt';d.innerHTML='<span>'+t.l+'</span><i></i>';$('#titles').appendChild(d);t.el=d;});
/* bruitages : chaque événement vise le MOMENT exact de l'image (sfx_mix.py retire le point de synchro du son) */
window.FX_SFX=[
 {t:TITLES[0].a+.08,role:'stamp',gain_db:-10},{t:TITLES[1].a+.05,role:'sticker_in',gain_db:-1},
 ...ZOOMS.map(z=>({t:z.t0,role:'zoom_cut',gain_db:-8})),
 {t:word(17)-.1+.1,role:'sticker_in',gain_db:-1},
 {t:word(40)-.55+.1,role:'progress',dur:1.0,gain_db:-4},
 {t:word(50)-.1+.25,role:'progress',dur:1.2,gain_db:-5},
 {t:word(58)-.1,role:'pop_in',gain_db:2},{t:word(73),role:'stamp',gain_db:-9},
 {t:word(108)-.05,role:'pop_in',gain_db:2},{t:word(110)-.05,role:'pop_in',gain_db:2},{t:word(113)-.05,role:'pop_in',gain_db:2},
 {t:word(131)-.2,role:'sticker_in',gain_db:-1},{t:word(132)+.3,role:'pop_in',gain_db:2},{t:word(133)+.3,role:'pop_in',gain_db:2},
];
const FADE=.28;
function cardP(c,t){return p(t,c.a,c.a+FADE)*(1-p(t,c.b-FADE,c.b));}
/* ---------- rendu ---------- */
const subs=$('#subs'); CH.forEach(c=>{const d=document.createElement('div');d.className='sb';d.id='sb'+c.i;d.innerHTML='<div>'+c.text.replace(/\*([^*]+)\*/g,'<b>$1</b>')+'</div>';subs.appendChild(d);c.el=d;});
const anim=$('#anim'); const hide=el=>{el.style.opacity=0;el.style.visibility='hidden';};
function cardAnim(id,t){
  const set=(s,a)=>{const e=$(s);if(e)e.setAttribute('transform',a);}, op=(s,v)=>{const e=$(s);if(e)e.setAttribute('opacity',v);};
  if(id==='cA'){const c=CARDS[0];const u=eb(p(t,c.a,c.a+.4));$('#vA-g').setAttribute('transform','translate(150 60) scale('+(.7+.3*u)+') translate(-150 -60)');$('#vA-bar').setAttribute('width',60*eo(p(t,c.a+.15,c.a+.8)));}
  if(id==='cB'){const c=CARDS[1];const k=eo(p(t,c.a+.1,c.a+1.1));$('#vB-n').setAttribute('transform','translate(165 132) rotate('+(70-k*142)+')');
    $('#vB-arc').setAttribute('stroke-dasharray',(k*28)+' 100');}
  if(id==='cC'){const c=CARDS[2];const k=eo(p(t,c.a+.25,c.a+1.5));const w=300-k*200;$('#vC-b1').setAttribute('width',w);$('#vC-b2').setAttribute('width',300-k*170);$('#vC-ar').setAttribute('opacity',p(t,c.a+.6,c.a+1)*(1));}
  if(id==='cD'){const c=CARDS[3];const u=eb(p(t,c.a,c.a+.45));$('#vD-p').setAttribute('transform','translate(130 70) rotate(-28) scale('+u+')');
    $('#vD-sp').setAttribute('stroke-dasharray',(100*p(t,word(63),word(66)))+' 100'); const x=eb(p(t,word(73)-.05,word(73)+.3)); $('#vD-x').setAttribute('opacity',p(t,word(73)-.05,word(73)+.1)); $('#vD-x').setAttribute('transform','translate(292 65) scale('+(.4+.6*x)+') translate(-292 -65)');}
  if(id==='cE'){const o=(s,w)=>{const e=$(s);const u=eb(p(t,w,w+.35));e.setAttribute('opacity',p(t,w,w+.12));e.setAttribute('transform','translate(0 '+(1-u)*-30+')');};o('#vE-1',word(108)-.05);o('#vE-2',word(110)-.05);o('#vE-3',word(113)-.05);}
  if(id==='cF'){const c=CARDS[5];const u=eb(p(t,c.a,c.a+.4));$('#vF-g').setAttribute('transform','translate(165 66) scale('+(.7+.3*u)+') translate(-165 -66)');$('#vF-n').setAttribute('opacity',1);
    [...$('#vF-n').children].forEach((e,i)=>{const k=p(t,word(132)+.3+.28*i,word(132)+.3+.28*i+.25);e.setAttribute('opacity',k);e.setAttribute('pathLength',100);e.setAttribute('stroke-dasharray',(100*k)+' 100');});}
}
window.render=function(t){
  const T=topAt(t); const present=Math.max(...CARDS.map(c=>cardP(c,t))); const zoomed=zoomAt(t)>1.02;
  let tmax=0;
  CARDS.forEach(c=>{const pp=zoomed||T>1260?0:cardP(c,t);const el=$('#'+c.id);tmax=Math.max(tmax,pp);
    if(pp<=0.001){hide(el);return;}
    el.style.visibility='visible';el.style.opacity=pp;el.style.transform='translateY('+((1-pp)*24)+'px) scale('+(.96+.04*pp)+')';cardAnim(c.id,t);});
  let titleOn=false;
  TITLES.forEach(tt=>{const u=zoomed?0:p(t,tt.a,tt.a+.14)*(1-p(t,tt.b-.14,tt.b));if(u>.02)titleOn=true;tt.el.style.opacity=u;tt.el.style.transform='scale('+(.94+.06*eb(p(t,tt.a,tt.a+.35)))+')';
    tt.el.firstChild.style.backgroundPosition=(110-110*p(t,tt.a,tt.b))+'% 0';tt.el.lastChild.style.width=(520*eo(p(t,tt.a+.1,tt.a+.7)))+'px';});
  anim.style.top=T+'px';
  const pres=zoomed||T>1260?0:present;
  const top=Math.min(T+14+pres*246,1480-140+0); subs.style.top=top+'px';
  CH.forEach(c=>{const on=t>=c.t0&&t<c.t1;const o=on?Math.min(1,(t-c.t0)/.07)*(1-clamp((t-(c.t1-.12))/.12)*(c.t1<TOTAL-.01?1:0)):0;c.el.style.opacity=(titleOn&&(c.i===0||c.i===25))?0:o;});
};
window.LAYOUT={total:TOTAL,zooms:ZOOMS,zoomCenter:ZC,chunks:CH.map(c=>({t0:c.t0,t1:c.t1,text:c.text.replace(/\*/g,'')})),cards:CARDS.map(c=>({id:c.id,a:c.a,b:c.b}))};
render(0);
</script>
</body>
</html>
