<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Titre Ashwagandha</title>
<style>
@font-face{font-family:'Inter';src:url(../fonts/inter.woff2) format('woff2');font-weight:100 900;}
@font-face{font-family:'Lora';src:url(../fonts/lora.woff2) format('woff2');font-weight:400 700;}
@font-face{font-family:'Lora';src:url(../fonts/lora-italic.woff2) format('woff2');font-weight:400 700;font-style:italic;}
:root{--green:#2D5A43;--terra:#E07A5F;--ink:#1A201C;--amber:#F2B544}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#2b3a55}
body{display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif}
html.alpha,body.alpha,body.alpha #stage{background:transparent!important}
html.green,body.green,body.green #stage{background:#00FF00!important}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;flex:none;transform-origin:center;background:linear-gradient(160deg,#6d7f78,#2a3430)}
body.land #stage{width:1920px;height:1080px}
.emo{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;font-style:normal;font-weight:400}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;opacity:0}
.w{display:inline-block}
.box{display:inline-block;font-family:'Lora',serif;font-weight:700;font-size:100px;letter-spacing:-3px;line-height:1.06;text-align:center;padding:14px 44px 26px;border-radius:34px;box-shadow:0 22px 60px rgba(0,0,0,.3);max-width:980px}
body.land .box{font-size:92px;max-width:1500px}
.box.c{background:#fff;color:var(--ink)}
.box.g{background:var(--green);color:#fff}
.box.t{background:var(--terra);color:#fff}
.box.it{font-style:italic;font-weight:600}
.box.big{font-size:124px;padding:16px 56px 32px}
body.land .box.big{font-size:112px}
.box.xl{font-size:128px;padding:16px 46px 30px;letter-spacing:-4px}
body.land .box.xl{font-size:150px}
.row{position:relative;display:flex;justify-content:center}
.stk{position:absolute;font-size:120px!important;line-height:1}
body.land .stk{font-size:104px!important}
.row{position:relative;display:flex;justify-content:center}

.big-emo{font-size:150px;line-height:1;filter:drop-shadow(0 12px 22px rgba(0,0,0,.3))}
body.land .big-emo{font-size:120px}
#btn{position:relative;display:inline-flex;align-items:center;gap:26px;background:var(--terra);color:#fff;font-weight:900;font-size:78px;letter-spacing:-1px;padding:26px 56px 30px;border-radius:999px;box-shadow:0 24px 60px rgba(224,122,95,.5)}
#btn .emo{font-size:84px;display:inline-block;transform-origin:50% 10%}
#ripple{position:absolute;left:50%;top:50%;width:180px;height:180px;margin:-90px 0 0 -90px;border-radius:50%;border:12px solid #fff;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <section class="scene" id="A">
    <div class="row"><div class="box g xl" id="a1">Ashwagandha</div><div class="stk emo" id="leaf" style="left:-30px;top:-90px">🌿</div></div>
    <div class="row"><div class="box t big it" id="a2">si bon pour la santé&nbsp;?</div><div class="stk emo" id="think" style="right:-26px;bottom:-96px">🤔</div></div>
  </section>
</div>
<script>
const DUR=4.5;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
function split(el){const out=[];[...el.childNodes].forEach(n=>{if(n.nodeType===3){n.textContent.split(/(\s+)/).forEach(part=>{if(!part)return;if(/^\s+$/.test(part))out.push(document.createTextNode(' '));else{const s=document.createElement('span');s.className='w';s.textContent=part;out.push(s);}});}else out.push(n);});el.textContent='';out.forEach(n=>el.appendChild(n));return [...el.querySelectorAll(':scope > .w')];}
const W={a1:split($('#a1')),a2:split($('#a2'))};
function pop(el,t,st){const k=p(t,st,st+.45);const f=t>st+.5?Math.sin((t-st)*3)*8:0;el.style.opacity=clamp(k*3);el.style.transform=`translateY(${(1-eo(k))*40+f}px) scale(${.5+.5*eb(k)}) rotate(${t>st+.5?Math.sin((t-st)*2.4)*5:(1-eo(k))*-14}deg)`;}
function render(t){
  const ex=eio(p(t,4.05,4.5));
  $('#A').style.opacity=Math.min(p(t,0,.05),1-ex);$('#A').style.transform=`translateY(${-60*ex}px) scale(${1-.05*ex})`;
  { const k=p(t,.2,.55),el=$('#a1');el.style.opacity=clamp(k*4);el.style.transform=`scale(${1.7-.7*eo(k)}) rotate(${-6+6*eo(k)}deg)`;
    W.a1.forEach(w=>{w.style.opacity=1;w.style.transform='none';}); }
  pop($('#leaf'),t,.65);
  { const el=$('#a2'),k=p(t,.95,1.3);el.style.opacity=clamp(k*4);el.style.transform=`scale(${.85+.15*eb(k)}) translateY(${(1-eo(k))*50}px) rotate(${-2*eo(k)}deg)`;
    W.a2.forEach((w,i)=>{const q=p(t,1.0+i*.1,1.0+i*.1+.35);w.style.opacity=clamp(q*2.2);w.style.transform=`translateY(${(1-eo(q))*30}px) scale(${.9+.1*eb(q)})`;}); }
  pop($('#think'),t,2.0);
}
window.render=render;
const q=new URLSearchParams(location.search);
['land','alpha','green'].forEach(c=>{if(q.has(c)){document.body.classList.add(c);document.documentElement.classList.add(c);}});
const stage=$('#stage');
function fit(){const s=Math.min(innerWidth/stage.offsetWidth,innerHeight/stage.offsetHeight);stage.style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();
document.fonts.ready.then(()=>render(+(q.get('t')||0)));render(+(q.get('t')||0));
if(!q.has('render')){let t0=performance.now();(function loop(n){render(((n-t0)/1000)%DUR);requestAnimationFrame(loop);})(t0);}
</script>
</body>
</html>
