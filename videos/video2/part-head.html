<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fatigue et nutriments (compact)</title>
<style>
@font-face{font-family:'Inter';src:url(../ashwagandha/fonts/inter.woff2) format('woff2');font-weight:100 900;}
@font-face{font-family:'Lora';src:url(../ashwagandha/fonts/lora.woff2) format('woff2');font-weight:400 700;}
@font-face{font-family:'Lora';src:url(../ashwagandha/fonts/lora-italic.woff2) format('woff2');font-weight:400 700;font-style:italic;}
:root{--green:#2D5A43;--sage:#4A7A3A;--soft:#EAF2ED;--terra:#E07A5F;--terra-soft:#FBE7E0;--ink:#1A201C;--muted:#65726A;--line:#E6E1D8;--red:#C0392B;--amber:#F2B544}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#111}
body{display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;color:var(--ink)}
html.alpha,body.alpha,body.alpha #stage{background:transparent!important}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;flex:none;transform-origin:center;background:linear-gradient(160deg,#6d7f78,#2a3430)}
body.l-subs #anim{display:none} body.l-vis #subs{display:none}
.emo{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;font-style:normal;font-weight:400}

/* ===== animations : zone compacte sur la chemise, juste sous le menton (placée d'après la position du visage) ===== */
#anim{position:absolute;left:100px;top:0;width:860px;height:210px}
.cs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:16px;opacity:0;visibility:hidden}
.cd{position:relative;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:26px;border:2px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.3)}
.pl{display:inline-block;font-weight:900;font-size:30px;letter-spacing:3px;text-transform:uppercase;padding:9px 24px 11px;border-radius:999px;color:#fff;background:var(--terra);box-shadow:0 10px 24px rgba(224,122,95,.45)}
.stk{position:absolute;font-size:56px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.tt{font-family:'Lora',serif;font-weight:700;letter-spacing:-1px;line-height:1}
.sm{font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--terra)}
/* 3 résidus */
#r-card{width:520px;height:150px;gap:20px;padding:0 26px;justify-content:flex-start} #r-card .emo{font-size:92px}
#r-card .tt{font-size:54px} #r-card .sm{font-size:22px;margin-top:8px}
/* 4 limites */
#l-card{width:600px;height:150px;gap:20px;padding:0 26px;justify-content:flex-start} #l-card .emo{font-size:76px}
#l-col{display:flex;flex-direction:column;gap:8px;width:420px}
#l-col .sm{font-size:20px;display:flex;justify-content:space-between}
#l-bar{position:relative;height:30px;border-radius:15px;background:#EFEBE4;overflow:visible}
#l-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:15px;background:linear-gradient(90deg,var(--sage),#7FA86C)}
#l-mark{position:absolute;right:0;top:-10px;bottom:-10px;width:6px;border-radius:3px;background:var(--red);opacity:0}
/* 5 EFSA */
#f-card{width:700px;height:180px;gap:20px;padding:0 24px;justify-content:flex-start} #f-card .emo{font-size:84px}
#f-card .tt{font-size:58px} #f-card .cap{font-weight:700;font-size:20px;color:var(--muted);margin-top:4px;white-space:nowrap}
#f-gauge{display:flex;align-items:center;gap:12px;margin-top:10px} #f-bar{position:relative;width:200px;height:16px;border-radius:8px;background:#EFEBE4}
#f-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;background:var(--sage)} #f-gauge b{font-weight:900;font-size:26px;color:var(--green);letter-spacing:-.5px}
/* 6 arrêter ? */
#a-card{width:430px;height:130px;gap:18px;padding:0 24px;white-space:nowrap} #a-card .emo{font-size:76px} #a-card .tt{font-size:58px}
/* 7 pas du tout + balance */
#y-card{width:340px;height:110px;background:var(--green);border-color:var(--green);color:#fff;gap:12px;white-space:nowrap} #y-card .emo{font-size:52px} #y-card .tt{font-size:42px}
#b-card{width:420px;height:184px}
/* 9 rinçage */
#w-card{width:520px;height:140px;gap:18px;padding:0 24px;justify-content:flex-start} #w-card .emo{font-size:84px} #w-card .tt{font-size:46px;line-height:1.05}
#w-drops{position:absolute;left:56px;top:96px;font-size:30px;white-space:nowrap}
/* 10 un tiers */
#t-card{width:720px;height:170px;gap:22px;padding:0 26px;justify-content:flex-start} #t-card .emo{font-size:78px}
#t-frac{display:flex;align-items:center;gap:10px;color:var(--green)} #t-frac .tt{font-size:92px;line-height:.9}
.fr{display:flex;flex-direction:column;align-items:center;font-family:'Lora',serif;font-weight:700;font-size:62px;line-height:1}
.fr i{font-style:normal;display:block;padding:0 12px}.fr i:first-child{border-bottom:6px solid var(--green);padding-bottom:4px}.fr i:last-child{padding-top:2px}
#t-txt .tt{font-size:36px;line-height:1.08} #t-txt .sm{font-size:19px;margin-top:10px;color:var(--muted)}
/* 11 fin */
#s-pill{font-size:28px;padding:14px 26px 16px;display:flex;gap:10px;align-items:center} #s-pill .emo{font-size:36px}
#e-card{width:470px;height:130px;background:var(--green);border-color:var(--green);color:#fff;text-align:center} #e-card .tt{font-family:'Lora',serif;font-style:italic;font-weight:600;font-size:46px;line-height:1.02;letter-spacing:-1.5px}
#e-leaf{position:absolute;right:-8px;top:-42px;font-size:62px}

/* ===== sous-titres : sans bandeau (lettres cerclées), sous les animations ; ils remontent quand il n'y en a pas ===== */
#subs{position:absolute;left:100px;width:860px;top:0;height:140px}
.sb{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;opacity:0}
.sb > div{max-width:860px;text-align:center;font-weight:900;font-size:56px;line-height:1.1;letter-spacing:-1px;word-spacing:.12em;color:#fff;text-wrap:balance;
  -webkit-text-stroke:11px #14201A;paint-order:stroke fill;text-shadow:0 5px 18px rgba(0,0,0,.55)}
.sb .w{display:inline-block;color:rgba(255,255,255,.72)}
.sb .w.k{text-transform:uppercase;color:rgba(255,176,152,.85)}
.sb .w.done{color:#fff}
.sb .w.k.done{color:#FF9E85}
.sb .w.cur,.sb .w.k.cur{color:var(--amber)}
.sb .em{display:inline-block;opacity:0;-webkit-text-stroke:0;paint-order:normal;font-family:'Noto Color Emoji','Apple Color Emoji',sans-serif;font-weight:400;font-size:.92em;margin-left:.1em;vertical-align:-.04em}
</style>
</head>
<body>
<div id="stage">
  <div id="anim">
    <div class="cs" id="c3"><div class="cd" id="r-card"><span class="emo">🍎</span><div><div class="tt">Résidus</div><div class="sm">de pesticides</div></div><span class="stk emo" id="r-stk" style="right:-14px;top:-30px">🧪</span></div></div>
    <div class="cs" id="c4"><div class="cd" id="l-card"><span class="emo">📏</span><div id="l-col"><div class="sm"><span>résidus</span><span id="l-lab" style="opacity:0">limite</span></div><div id="l-bar"><div id="l-fill"></div><div id="l-mark"></div></div></div></div></div>
    <div class="cs" id="c5"><div class="cd" id="f-card"><span class="emo">🛡️</span><div><div class="tt">EFSA</div><div class="cap">Autorité européenne de sécurité des aliments</div><div id="f-gauge"><div id="f-bar"><div id="f-fill"></div></div><b id="f-lab" style="opacity:0">risque très faible</b></div></div></div></div>
    <div class="cs" id="c6"><div class="cd" id="a-card"><span class="emo">🍎</span><div class="tt">Arrêter ?</div><span class="stk emo" id="a-stk" style="right:-14px;top:-30px">🤔</span></div></div>
    <div class="cs" id="c7"><div class="cd" id="y-card"><span class="emo">✅</span><div class="tt">Pas du tout</div></div>
      <div class="cd" id="b-card"><svg width="400" height="176" viewBox="0 0 400 176"><polygon points="200,60 176,150 224,150" fill="#CFC7B8"/><rect x="150" y="150" width="100" height="10" rx="5" fill="#B9B2A3"/>
        <g id="b-beam"><rect x="40" y="54" width="320" height="10" rx="5" fill="#1A201C"/><circle cx="200" cy="59" r="9" fill="#E07A5F"/>
          <g id="b-l"><line x1="60" y1="64" x2="30" y2="104" stroke="#1A201C" stroke-width="3"/><line x1="60" y1="64" x2="90" y2="104" stroke="#1A201C" stroke-width="3"/><path d="M20 104 H100 Q95 128 60 130 Q25 128 20 104Z" fill="#4A7A3A"/><text x="60" y="122" text-anchor="middle" font-family="Inter" font-weight="900" font-size="22" fill="#fff">+</text></g>
          <g id="b-r"><line x1="340" y1="64" x2="310" y2="104" stroke="#1A201C" stroke-width="3"/><line x1="340" y1="64" x2="370" y2="104" stroke="#1A201C" stroke-width="3"/><path d="M300 104 H380 Q375 128 340 130 Q305 128 300 104Z" fill="#C0392B"/><text x="340" y="122" text-anchor="middle" font-family="Inter" font-weight="900" font-size="22" fill="#fff">−</text></g></g>
        <text x="60" y="170" text-anchor="middle" font-family="Inter" font-weight="800" font-size="20" fill="#4A7A3A" id="b-lt">POSITIFS</text><text x="340" y="170" text-anchor="middle" font-family="Inter" font-weight="800" font-size="20" fill="#C0392B" id="b-rt">NÉGATIFS</text></svg></div></div>
    <div class="cs" id="c9"><div class="cd" id="w-card"><span class="emo">🚿</span><div class="tt">Rincer<br>sous l’eau</div><span id="w-drops" class="emo">💧 💧 💧</span></div></div>
    <div class="cs" id="c10"><div class="cd" id="t-card"><span class="emo">💧</span><div id="t-frac"><span class="tt">−</span><span class="fr"><i>1</i><i>3</i></span></div><div id="t-txt"><div class="tt">de résidus<br>supplémentaires</div><div class="sm" id="t-rev">selon une revue</div></div></div></div>
    <div class="cs" id="c11"><div class="pl" id="s-pill"><span class="emo">🔔</span>S’abonner</div><div class="cd" id="e-card"><div class="tt">Mange l’esprit<br>tranquille</div><span class="emo" id="e-leaf">🌿</span></div></div>
  </div>
  <div id="subs"></div>
</div>

<script>
