<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fatigue et nutriments (compact)</title>
<style>
@font-face{font-family:'Inter';src:url(../ashwagandha/fonts/inter.woff2) format('woff2');font-weight:100 900;}
@font-face{font-family:'Lora';src:url(../ashwagandha/fonts/lora.woff2) format('woff2');font-weight:400 700;}
@font-face{font-family:'Lora';src:url(../ashwagandha/fonts/lora-italic.woff2) format('woff2');font-weight:400 700;font-style:italic;}
:root{--green:#2D5A43;--sage:#4A7A3A;--soft:#EAF2ED;--terra:#E07A5F;--terra-soft:#FBE7E0;--ink:#1A201C;--muted:#65726A;--line:#E6E1D8;--red:#C0392B;--amber:#F2B544}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#111}
body{display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;color:var(--ink)}
html.alpha,body.alpha,body.alpha #stage{background:transparent!important}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;flex:none;transform-origin:center;background:linear-gradient(160deg,#6d7f78,#2a3430)}
body.l-subs #anim{display:none} body.l-vis #subs{display:none}
.emo{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;font-style:normal;font-weight:400}

/* ===== animations : petits dessins animés (sans cartes), sur la chemise sous le menton ===== */
#anim{position:absolute;left:100px;top:0;width:860px;height:210px}
.cs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden}
.cs svg{overflow:visible;filter:drop-shadow(0 8px 14px rgba(0,0,0,.38))}
#v10,#v11{transform:scale(1.12)} #v3,#v8{transform:scale(1.05)}
.emo{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;font-style:normal;font-weight:400}
svg .tx{font-family:'Inter',sans-serif;font-weight:900;fill:#fff;paint-order:stroke;stroke:#14201A;stroke-width:7px;stroke-linejoin:round;letter-spacing:-.5px}
svg .lo{font-family:'Lora',serif;font-weight:700;fill:#fff;paint-order:stroke;stroke:#14201A;stroke-width:8px;stroke-linejoin:round}

/* ===== sous-titres : sans bandeau, un seul accent de couleur, sous les animations (ils remontent sans animation) ===== */
#subs{position:absolute;left:100px;width:860px;top:0;height:140px}
.sb{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;opacity:0}
.sb > div{max-width:860px;text-align:center;font-weight:900;font-size:56px;line-height:1.1;letter-spacing:-1px;word-spacing:.12em;color:#fff;text-wrap:balance;
  -webkit-text-stroke:7px rgba(10,20,16,.92);paint-order:stroke fill;text-shadow:0 4px 14px rgba(0,0,0,.4)}
.sb .w{display:inline-block;color:rgba(255,255,255,.74)}
.sb .w.done{color:#fff}
.sb .w.k{text-transform:uppercase}
body.ss3 .sb .w.cur{color:#7DF2B8}                                   /* style 3 (par défaut) : accent menthe */
body.ss2 .sb .w.cur{color:#FFE14D}                                   /* style 2 : accent jaune doux */
body.ss1 .sb .w.cur{color:#14201A;background:#FFE14D;border-radius:14px;padding:0 .14em;margin:0 -.06em;-webkit-text-stroke:0;text-shadow:none}  /* style 1 : karaoké, mot sur fond jaune */
.sb .em{display:inline-block;opacity:0;-webkit-text-stroke:0;paint-order:normal;font-family:'Noto Color Emoji','Apple Color Emoji',sans-serif;font-weight:400;font-size:.92em;margin-left:.1em;vertical-align:-.04em}
</style>
</head>
<body>
<div id="stage">
  <div id="anim">
    <!-- 3 : résidus de pesticides -->
    <div class="cs" id="c3"><svg id="v3" width="380" height="190" viewBox="0 0 380 190"><g id="v3-dots"></g><text id="v3-apple" class="emo" x="190" y="142" text-anchor="middle" font-size="124">🍎</text></svg></div>
    <!-- 4 : limites (jauge) -->
    <div class="cs" id="c4"><svg id="v4" width="380" height="200" viewBox="0 0 380 200">
      <path d="M50 165 A140 140 0 0 1 330 165" pathLength="100" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="28" stroke-linecap="round"/>
      <path id="g-ok" d="M50 165 A140 140 0 0 1 330 165" pathLength="100" fill="none" stroke="#6FCF7A" stroke-width="28" stroke-linecap="round" stroke-dasharray="70 100"/>
      <path id="g-lim" d="M50 165 A140 140 0 0 1 330 165" pathLength="100" fill="none" stroke="#E8544A" stroke-width="28" stroke-dasharray="0 100" stroke-dashoffset="-86"/>
      <g id="g-needle"><line x1="190" y1="165" x2="190" y2="66" stroke="#fff" stroke-width="11" stroke-linecap="round"/><circle cx="190" cy="165" r="15" fill="#fff" stroke="#14201A" stroke-width="4"/></g>
      <text id="g-lab" class="tx" x="316" y="70" text-anchor="middle" font-size="30" opacity="0">limite</text></svg></div>
    <!-- 5 : EFSA, risque très faible -->
    <div class="cs" id="c5"><svg id="v5" width="470" height="190" viewBox="0 0 470 190">
      <g id="e-shield"><path d="M100 12 L172 40 V94 C172 138 134 166 100 178 C66 166 28 138 28 94 V40 Z" fill="#2D5A43" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>
        <text class="tx" x="100" y="86" text-anchor="middle" font-size="38">EFSA</text>
        <path id="e-check" d="M70 120 L92 142 L134 100" pathLength="100" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100"/></g>
      <g id="e-risk"><text class="tx" x="330" y="62" text-anchor="middle" font-size="26">RISQUE</text>
        <g id="e-seg"></g><text id="e-lab" class="tx" x="330" y="150" text-anchor="middle" font-size="32" opacity="0">très faible</text></g></svg></div>
    <!-- 6 : arrêter ? -->
    <div class="cs" id="c6"><svg id="v6" width="320" height="190" viewBox="0 0 320 190"><text id="v6-apple" class="emo" x="110" y="146" text-anchor="middle" font-size="120">🍎</text>
      <g id="v6-q"><circle cx="236" cy="70" r="48" fill="#fff" stroke="#14201A" stroke-width="5"/><text class="lo" x="236" y="96" text-anchor="middle" font-size="76" style="fill:#14201A;stroke:none">?</text></g></svg></div>
    <!-- 7 : pas du tout (✓) -->
    <div class="cs" id="c7"><svg id="v7" width="200" height="190" viewBox="0 0 200 190">
      <circle id="y-ring" cx="100" cy="95" r="72" pathLength="100" fill="rgba(20,32,26,.35)" stroke="#4FD27A" stroke-width="14" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 100 95)"/>
      <path id="y-chk" d="M60 98 L90 128 L142 68" pathLength="100" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100"/></svg></div>
    <!-- 7b : balance positifs / négatifs -->
    <div class="cs" id="c7b"><svg id="v7b" width="400" height="180" viewBox="0 0 400 180"><polygon points="200,62 176,152 224,152" fill="#E6E1D8" stroke="#14201A" stroke-width="3"/><rect x="146" y="152" width="108" height="12" rx="6" fill="#E6E1D8" stroke="#14201A" stroke-width="3"/>
      <g id="b-beam"><rect x="40" y="56" width="320" height="12" rx="6" fill="#fff" stroke="#14201A" stroke-width="3"/><circle cx="200" cy="62" r="10" fill="#E07A5F" stroke="#14201A" stroke-width="3"/>
        <g id="b-l"><line x1="60" y1="68" x2="30" y2="108" stroke="#fff" stroke-width="4"/><line x1="60" y1="68" x2="90" y2="108" stroke="#fff" stroke-width="4"/><path d="M18 108 H102 Q97 134 60 136 Q23 134 18 108Z" fill="#4A7A3A" stroke="#fff" stroke-width="4"/><text class="tx" x="60" y="128" text-anchor="middle" font-size="26" style="stroke-width:0">+</text></g>
        <g id="b-r"><line x1="340" y1="68" x2="310" y2="108" stroke="#fff" stroke-width="4"/><line x1="340" y1="68" x2="370" y2="108" stroke="#fff" stroke-width="4"/><path d="M298 108 H382 Q377 134 340 136 Q303 134 298 108Z" fill="#C0392B" stroke="#fff" stroke-width="4"/><text class="tx" x="340" y="128" text-anchor="middle" font-size="26" style="stroke-width:0">−</text></g></g></svg></div>
    <!-- 8 : réduire les résidus -->
    <div class="cs" id="c8"><svg id="v8" width="380" height="190" viewBox="0 0 380 190"><g id="v8-dots"></g><text id="v8-apple" class="emo" x="190" y="142" text-anchor="middle" font-size="124">🍎</text><text id="v8-spark" class="emo" x="282" y="58" text-anchor="middle" font-size="64" opacity="0">✨</text></svg></div>
    <!-- 9 : rinçage -->
    <div class="cs" id="c9"><svg id="v9" width="300" height="200" viewBox="0 0 300 200">
      <rect x="40" y="8" width="150" height="24" rx="12" fill="#C9D1D6" stroke="#fff" stroke-width="4"/><rect x="164" y="8" width="26" height="50" rx="8" fill="#C9D1D6" stroke="#fff" stroke-width="4"/>
      <line id="w-stream" x1="177" y1="62" x2="177" y2="118" stroke="#5CC8FF" stroke-width="14" stroke-linecap="round" stroke-dasharray="14 12"/>
      <text id="w-apple" class="emo" x="177" y="180" text-anchor="middle" font-size="92">🍎</text><g id="w-drops"></g></svg></div>
    <!-- 10 : un tiers (camembert) -->
    <div class="cs" id="c10"><svg id="v10" width="440" height="190" viewBox="0 0 440 190">
      <circle cx="105" cy="95" r="64" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="30"/>
      <circle id="t-arc" cx="105" cy="95" r="64" pathLength="100" fill="none" stroke="#6FCF7A" stroke-width="30" stroke-dasharray="0 100" transform="rotate(-90 105 95)"/>
      <text id="t-frac" class="lo" x="105" y="112" text-anchor="middle" font-size="48" opacity="0">1/3</text>
      <text class="tx" x="290" y="84" text-anchor="middle" font-size="31">résidus</text><text class="tx" x="290" y="122" text-anchor="middle" font-size="31">en moins</text>
      <g id="t-rev" opacity="0"><rect x="212" y="138" width="156" height="34" rx="17" fill="rgba(20,32,26,.78)"/><text x="290" y="162" text-anchor="middle" font-family="Inter" font-weight="800" font-size="20" fill="#fff">selon une revue</text></g></svg></div>
    <!-- 11 : s'abonner -->
    <div class="cs" id="c11"><svg id="v11" width="440" height="190" viewBox="0 0 440 190">
      <circle id="n-r1" cx="110" cy="100" r="40" fill="none" stroke="#fff" stroke-width="6" opacity="0"/><circle id="n-r2" cx="110" cy="100" r="40" fill="none" stroke="#fff" stroke-width="6" opacity="0"/>
      <g id="n-bell"><text class="emo" x="110" y="136" text-anchor="middle" font-size="112">🔔</text></g>
      <g id="n-pill"><rect x="190" y="68" width="230" height="64" rx="32" fill="#E07A5F" stroke="#fff" stroke-width="5"/><text x="305" y="110" text-anchor="middle" font-family="Inter" font-weight="900" font-size="30" fill="#fff" letter-spacing="1">S’ABONNER</text></g></svg></div>
    <!-- 12 : fin -->
    <div class="cs" id="c12"><svg id="v12" width="240" height="190" viewBox="0 0 240 190"><text id="l-leaf" class="emo" x="120" y="144" text-anchor="middle" font-size="130">🌿</text><text id="l-sp1" class="emo" x="36" y="60" text-anchor="middle" font-size="40" opacity="0">✨</text><text id="l-sp2" class="emo" x="206" y="92" text-anchor="middle" font-size="34" opacity="0">✨</text></svg></div>
  </div>
  <div id="subs"></div>
</div>

<script>
