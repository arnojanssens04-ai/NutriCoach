<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fatigue et nutriments (compact)</title>
<style>
@font-face{font-family:'Inter';src:url(../ashwagandha/fonts/inter.woff2) format('woff2');font-weight:100 900;}
@font-face{font-family:'Lora';src:url(../ashwagandha/fonts/lora.woff2) format('woff2');font-weight:400 700;}
@font-face{font-family:'Lora';src:url(../ashwagandha/fonts/lora-italic.woff2) format('woff2');font-weight:400 700;font-style:italic;}
:root{--green:#2D5A43;--sage:#4A7A3A;--soft:#EAF2ED;--terra:#E07A5F;--terra-soft:#FBE7E0;--ink:#1A201C;--muted:#65726A;--line:#E6E1D8;--red:#C0392B;--amber:#F2B544}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#111}
body{display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;color:var(--ink)}
html.alpha,body.alpha,body.alpha #stage{background:transparent!important}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;flex:none;transform-origin:center;background:linear-gradient(160deg,#6d7f78,#2a3430)}
body.l-subs #anim{display:none} body.l-vis #subs{display:none}
.emo{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;font-style:normal;font-weight:400}

/* ===== animations : zone compacte sur la chemise, juste sous le menton (placée d'après la position du visage) ===== */
#anim{position:absolute;left:100px;top:0;width:860px;height:210px}
.cs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:16px;opacity:0;visibility:hidden}
.cd{position:relative;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:26px;border:2px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.3)}
.pl{display:inline-block;font-weight:900;font-size:30px;letter-spacing:3px;text-transform:uppercase;padding:9px 24px 11px;border-radius:999px;color:#fff;background:var(--terra);box-shadow:0 10px 24px rgba(224,122,95,.45)}
.stk{position:absolute;font-size:56px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.tt{font-family:'Lora',serif;font-weight:700;letter-spacing:-1px;line-height:1}
.sm{font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--terra)}
/* 3 résidus */
#r-card{width:520px;height:150px;gap:20px;padding:0 26px;justify-content:flex-start} #r-card .emo{font-size:92px}
#r-card .tt{font-size:54px} #r-card .sm{font-size:22px;margin-top:8px}
/* 4 limites */
#l-card{width:600px;height:150px;gap:20px;padding:0 26px;justify-content:flex-start} #l-card .emo{font-size:76px}
#l-col{display:flex;flex-direction:column;gap:8px;width:420px}
#l-col .sm{font-size:20px;display:flex;justify-content:space-between}
#l-bar{position:relative;height:30px;border-radius:15px;background:#EFEBE4;overflow:visible}
#l-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:15px;background:linear-gradient(90deg,var(--sage),#7FA86C)}
#l-mark{position:absolute;right:0;top:-10px;bottom:-10px;width:6px;border-radius:3px;background:var(--red);opacity:0}
/* 5 EFSA */
#f-card{width:700px;height:180px;gap:20px;padding:0 24px;justify-content:flex-start} #f-card .emo{font-size:84px}
#f-card .tt{font-size:58px} #f-card .cap{font-weight:700;font-size:20px;color:var(--muted);margin-top:4px;white-space:nowrap}
#f-gauge{display:flex;align-items:center;gap:12px;margin-top:10px} #f-bar{position:relative;width:200px;height:16px;border-radius:8px;background:#EFEBE4}
#f-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;background:var(--sage)} #f-gauge b{font-weight:900;font-size:26px;color:var(--green);letter-spacing:-.5px}
/* 6 arrêter ? */
#a-card{width:430px;height:130px;gap:18px;padding:0 24px;white-space:nowrap} #a-card .emo{font-size:76px} #a-card .tt{font-size:58px}
/* 7 pas du tout + balance */
#y-card{width:340px;height:110px;background:var(--green);border-color:var(--green);color:#fff;gap:12px;white-space:nowrap} #y-card .emo{font-size:52px} #y-card .tt{font-size:42px}
#b-card{width:420px;height:184px}
/* 9 rinçage */
#w-card{width:520px;height:140px;gap:18px;padding:0 24px;justify-content:flex-start} #w-card .emo{font-size:84px} #w-card .tt{font-size:46px;line-height:1.05}
#w-drops{position:absolute;left:56px;top:96px;font-size:30px;white-space:nowrap}
/* 10 un tiers */
#t-card{width:720px;height:170px;gap:22px;padding:0 26px;justify-content:flex-start} #t-card .emo{font-size:78px}
#t-frac{display:flex;align-items:center;gap:10px;color:var(--green)} #t-frac .tt{font-size:92px;line-height:.9}
.fr{display:flex;flex-direction:column;align-items:center;font-family:'Lora',serif;font-weight:700;font-size:62px;line-height:1}
.fr i{font-style:normal;display:block;padding:0 12px}.fr i:first-child{border-bottom:6px solid var(--green);padding-bottom:4px}.fr i:last-child{padding-top:2px}
#t-txt .tt{font-size:36px;line-height:1.08} #t-txt .sm{font-size:19px;margin-top:10px;color:var(--muted)}
/* 11 fin */
#s-pill{font-size:28px;padding:14px 26px 16px;display:flex;gap:10px;align-items:center} #s-pill .emo{font-size:36px}
#e-card{width:470px;height:130px;background:var(--green);border-color:var(--green);color:#fff;text-align:center} #e-card .tt{font-family:'Lora',serif;font-style:italic;font-weight:600;font-size:46px;line-height:1.02;letter-spacing:-1.5px}
#e-leaf{position:absolute;right:-8px;top:-42px;font-size:62px}

/* ===== sous-titres : sans bandeau (lettres cerclées), sous les animations ; ils remontent quand il n'y en a pas ===== */
#subs{position:absolute;left:100px;width:860px;top:0;height:140px}
.sb{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;opacity:0}
.sb > div{max-width:860px;text-align:center;font-weight:900;font-size:56px;line-height:1.1;letter-spacing:-1px;word-spacing:.12em;color:#fff;text-wrap:balance;
  -webkit-text-stroke:11px #14201A;paint-order:stroke fill;text-shadow:0 5px 18px rgba(0,0,0,.55)}
.sb .w{display:inline-block;color:rgba(255,255,255,.72)}
.sb .w.k{text-transform:uppercase;color:rgba(255,176,152,.85)}
.sb .w.done{color:#fff}
.sb .w.k.done{color:#FF9E85}
.sb .w.cur,.sb .w.k.cur{color:var(--amber)}
.sb .em{display:inline-block;opacity:0;-webkit-text-stroke:0;paint-order:normal;font-family:'Noto Color Emoji','Apple Color Emoji',sans-serif;font-weight:400;font-size:.92em;margin-left:.1em;vertical-align:-.04em}
</style>
</head>
<body>
<div id="stage">
  <div id="anim">
    <div class="cs" id="c3"><div class="cd" id="r-card"><span class="emo">🍎</span><div><div class="tt">Résidus</div><div class="sm">de pesticides</div></div><span class="stk emo" id="r-stk" style="right:-14px;top:-30px">🧪</span></div></div>
    <div class="cs" id="c4"><div class="cd" id="l-card"><span class="emo">📏</span><div id="l-col"><div class="sm"><span>résidus</span><span id="l-lab" style="opacity:0">limite</span></div><div id="l-bar"><div id="l-fill"></div><div id="l-mark"></div></div></div></div></div>
    <div class="cs" id="c5"><div class="cd" id="f-card"><span class="emo">🛡️</span><div><div class="tt">EFSA</div><div class="cap">Autorité européenne de sécurité des aliments</div><div id="f-gauge"><div id="f-bar"><div id="f-fill"></div></div><b id="f-lab" style="opacity:0">risque très faible</b></div></div></div></div>
    <div class="cs" id="c6"><div class="cd" id="a-card"><span class="emo">🍎</span><div class="tt">Arrêter ?</div><span class="stk emo" id="a-stk" style="right:-14px;top:-30px">🤔</span></div></div>
    <div class="cs" id="c7"><div class="cd" id="y-card"><span class="emo">✅</span><div class="tt">Pas du tout</div></div>
      <div class="cd" id="b-card"><svg width="400" height="176" viewBox="0 0 400 176"><polygon points="200,60 176,150 224,150" fill="#CFC7B8"/><rect x="150" y="150" width="100" height="10" rx="5" fill="#B9B2A3"/>
        <g id="b-beam"><rect x="40" y="54" width="320" height="10" rx="5" fill="#1A201C"/><circle cx="200" cy="59" r="9" fill="#E07A5F"/>
          <g id="b-l"><line x1="60" y1="64" x2="30" y2="104" stroke="#1A201C" stroke-width="3"/><line x1="60" y1="64" x2="90" y2="104" stroke="#1A201C" stroke-width="3"/><path d="M20 104 H100 Q95 128 60 130 Q25 128 20 104Z" fill="#4A7A3A"/><text x="60" y="122" text-anchor="middle" font-family="Inter" font-weight="900" font-size="22" fill="#fff">+</text></g>
          <g id="b-r"><line x1="340" y1="64" x2="310" y2="104" stroke="#1A201C" stroke-width="3"/><line x1="340" y1="64" x2="370" y2="104" stroke="#1A201C" stroke-width="3"/><path d="M300 104 H380 Q375 128 340 130 Q305 128 300 104Z" fill="#C0392B"/><text x="340" y="122" text-anchor="middle" font-family="Inter" font-weight="900" font-size="22" fill="#fff">−</text></g></g>
        <text x="60" y="170" text-anchor="middle" font-family="Inter" font-weight="800" font-size="20" fill="#4A7A3A" id="b-lt">POSITIFS</text><text x="340" y="170" text-anchor="middle" font-family="Inter" font-weight="800" font-size="20" fill="#C0392B" id="b-rt">NÉGATIFS</text></svg></div></div>
    <div class="cs" id="c9"><div class="cd" id="w-card"><span class="emo">🚿</span><div class="tt">Rincer<br>sous l’eau</div><span id="w-drops" class="emo">💧 💧 💧</span></div></div>
    <div class="cs" id="c10"><div class="cd" id="t-card"><span class="emo">💧</span><div id="t-frac"><span class="tt">−</span><span class="fr"><i>1</i><i>3</i></span></div><div id="t-txt"><div class="tt">de résidus<br>supplémentaires</div><div class="sm" id="t-rev">selon une revue</div></div></div></div>
    <div class="cs" id="c11"><div class="pl" id="s-pill"><span class="emo">🔔</span>S’abonner</div><div class="cd" id="e-card"><div class="tt">Mange l’esprit<br>tranquille</div><span class="emo" id="e-leaf">🌿</span></div></div>
  </div>
  <div id="subs"></div>
</div>

<script>
const WPS = 2.7, START = 0.45;
const SEGS = [
  {id:'s1',  text:'Stop !|Mange pas cette *pomme*,|elle est *cancérogène* !'},
  {id:'s2',  text:'Pas exactement,|voilà ce qui est|plutôt *vrai* sur ceci.'},
  {id:'s3',  text:'Alors oui effectivement,|sur cette pomme,|il y a des *résidus*|de *pesticides*.'},
  {id:'s4',  text:'Mais ce qu’il faut bien comprendre,|c’est que ces *résidus*|sont encadrés par des *limites*.'},
  {id:'s5',  text:'Et évidemment, l’*EFSA*|juge le risque pour le consommateur|*très* *faible* pour sa santé.'},
  {id:'s6',  text:'Alors, est-ce que tu devrais|arrêter de consommer cette pomme|parce qu’elle contient des *pesticides* ?'},
  {id:'s7',  text:'Eh bien *pas* *du* *tout*,|parce qu’elle contient beaucoup plus|d’aspects *positifs* pour ta santé|que d’aspects *négatifs*.'},
  {id:'s8',  text:'Évidemment, il y a différentes *techniques*{🧼}|pour quand même *réduire* ces résidus|qu’on retrouve sur nos fruits.'},
  {id:'s9',  text:'Tout simplement|en *rinçant* le fruit|sous l’*eau*.'},
  {id:'s10', text:'Ce qui permet donc de *réduire*|déjà *d’un* *tiers*|les résidus supplémentaires|selon une *revue*.'},
  {id:'s11', text:'Alors si ce contenu te plaît,|n’hésite pas à *t’abonner*|et mange l’esprit *tranquille*.'},
];
/* scènes : quels segments, quand la scène commence = 1er mot - 0,1 s */
const SCENES = [];

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const norm=s=>s.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');

/* ---------- layout des mots ---------- */
const CH=[]; let TOTAL=0; const SEG={};
(function layout(){
  const fix=s=>s.replace(/ ([?:!])/g,' $1');
  const all=[]; SEGS.forEach(s=>fix(s.text).split('|').forEach(c=>c.trim().split(/[ \t\n]+/).forEach(w=>all.push(w.replace(/\{[^}]*\}/g,'').replace(/\*/g,'')))));
  const avg=all.reduce((a,w)=>a+w.length,0)/all.length;
  let t=START; let wi=0; const REAL=(window.WORDS&&window.WORDS.words&&window.WORDS.words.length===all.length)?window.WORDS:null;
  if(window.WORDS&&!REAL) console.warn('WORDS ignoré : '+(window.WORDS.words||[]).length+' mots fournis, '+all.length+' attendus');
  SEGS.forEach(s=>{ s.words=[]; s.chunks=[];
    fix(s.text).split('|').forEach(ct=>{ const ch={seg:s.id,words:[]};
      ct.trim().split(/[ \t\n]+/).forEach(raw=>{ const emo=(raw.match(/\{([^}]+)\}/)||[])[1]; const c=raw.replace(/\{[^}]*\}/g,'').replace(/\*/g,''); const d=(c.length+2)/(avg+2)/WPS;
        const w={raw:c,norm:norm(c),key:raw.includes('*'),emo,t0:t,t1:t+d}; t+=d; const l=c.slice(-1);
        t+= c.endsWith('…')?.3 : l===','?.15 : l===':'?.2 : (l==='.'||l==='?')?.3 : 0;
        if(REAL){ w.t0=REAL.words[wi].t0; w.t1=REAL.words[wi].t1; } wi++;
        ch.words.push(w); s.words.push(w); });
      ch.t0=ch.words[0].t0; ch.t1=ch.words[ch.words.length-1].t1; s.chunks.push(ch); CH.push(ch); });
    s.t0=s.words[0].t0; s.t1=s.words[s.words.length-1].t1; t+=(s.after||0); SEG[s.id]=s; });
  TOTAL=REAL?REAL.total:Math.ceil((t+.2)*10)/10;
  window.LAYOUT_REAL=!!REAL;
})();
const wt=(id,key,n=0)=>{ const k=norm(key); const m=SEG[id].words.filter(w=>w.norm===k); if(!m[n]) throw new Error('mot introuvable '+id+' '+key); return m[n].t0; };
const wt1=(id,key,n=0)=>{ const k=norm(key); const m=SEG[id].words.filter(w=>w.norm===k); return m[n].t1; };


/* ---------- où est ton visage ? (mesuré dans ta vidéo) : rien ne doit passer dessus ---------- */
const ZN=Object.assign({closeups:[],faces:[],nodet:[]},window.ZONES||{});
const ZC={x:540,y:700}, INTRO_END=9.0;               /* zoom centré sur le visage ; début de vidéo = sous-titres seuls */
const ZP=[]; const smooth=x=>x*x*(3-2*x);
function zoomAt(t){ let s=1; ZP.forEach(z=>{ const u=clamp((t-z.t0)/z.in), v=clamp((t-z.t0-z.in-z.hold)/z.out); s+=z.amp*smooth(u)*(1-smooth(v)); }); return s; }
function fbAt(t){ /* bas du visage (menton + cou) à l'instant t, en px dans l'image finale (zoom compris) */
  let v;
  if(ZN.nodet.some(([a,b])=>t>=a&&t<=b)) v=1630;
  else{ let m=0,found=false; ZN.faces.forEach(([ft,x,y,w,h])=>{ if(Math.abs(ft-t)<=.3){ m=Math.max(m,y+h+60); found=true; } });
    if(found) v=m; else{ let best=1630,bd=9; ZN.faces.forEach(([ft,x,y,w,h])=>{ const d=Math.abs(ft-t); if(d<bd){ bd=d; best=y+h+60; } }); v=bd<=1.0?best:1630; } }
  v=ZC.y+(v-ZC.y)*zoomAt(t);                          /* le zoom fait descendre un peu le menton */
  if(t<INTRO_END+.3) v=Math.max(v,1260);              /* début : tu tournes la tête, pomme près du visage -> prudence, texte seul */
  return v; }
function topLimitAt(t){ let s=0,n=0; for(let d=-.2;d<=.2001;d+=.05){ s+=fbAt(t+d); n++; } return Math.max(1075,s/n+12); }

/* ---------- cues ---------- */
const EV={subs:[],vis:[]}; const Q={};
Q.res3=wt('s3','résidus'); Q.pest3=wt('s3','pesticides');
Q.res4=wt('s4','résidus'); Q.enc=wt('s4','encadrés'); Q.lim=wt('s4','limites');
Q.efsa=wt('s5','lefsa'); Q.tres=wt('s5','très'); Q.faible=wt('s5','faible');
Q.arret=wt('s6','arrêter'); Q.pest6=wt('s6','pesticides');
Q.pas=wt('s7','pas'); Q.beau=wt('s7','beaucoup'); Q.posi=wt('s7','positifs'); Q.nega=wt('s7','négatifs');
Q.rinc=wt('s9','rinçant'); Q.tiers=wt('s10','tiers'); Q.revue=wt('s10','revue');
Q.abo=wt('s11','tabonner'); Q.mange=wt('s11','mange');

/* ---------- zooms rapides sur la vidéo : un petit coup de zoom au début de chaque idée, jamais pendant l'intro ---------- */
{ const AMP=[.07,.06,.08,.07]; const Zt=[];
  SEGS.forEach(s=>{ if(s.t0>=INTRO_END+.1) Zt.push({id:s.id,t:s.t0-.05,amp:AMP[Zt.length%4]}); });
  const anchor=(id,key,amp)=>{ const z=Zt.find(z=>z.id===id); if(z){ z.t=wt(id,key)-.05; z.amp=amp; } };
  anchor('s5','lefsa',.09); anchor('s7','pas',.10);
  Zt.sort((a,b)=>a.t-b.t);
  Zt.forEach(z=>ZP.push({t0:z.t,in:.15,hold:.9,out:.4,amp:z.amp})); }

/* ---------- fenêtres d'affichage des cartes ---------- */
const SC=[
 {id:'c3', a:Q.res3-.3, b:SEG.s3.t1+.5, desc:'🍎 « Résidus de pesticides »', say:'…il y a des résidus de pesticides.'},
 {id:'c4', a:Q.res4-.3, b:SEG.s4.t1+.5, desc:'📏 jauge : résidus sous la « limite »', say:'…ces résidus sont encadrés par des limites.'},
 {id:'c5', a:Q.efsa-.3, b:SEG.s5.t1+.5, desc:'🛡️ « EFSA » + « risque très faible »', say:'…l’EFSA juge le risque très faible pour sa santé.'},
 {id:'c6', a:Q.arret-.3, b:SEG.s6.t1+.5, desc:'🍎 « Arrêter ? » + 🤔', say:'…est-ce que tu devrais arrêter de consommer cette pomme ?'},
 {id:'c7', a:Q.pas-.3,   b:SEG.s7.t1+.6, desc:'✅ « Pas du tout » + balance penchée côté positifs', say:'Eh bien pas du tout… beaucoup plus d’aspects positifs que négatifs.'},
 {id:'c9', a:SEG.s9.t0-.1, b:SEG.s9.t1+.6, desc:'🚿 « Rincer sous l’eau »', say:'Tout simplement en rinçant le fruit sous l’eau.'},
 {id:'c10',a:Q.tiers-.4, b:SEG.s10.t1+.6, desc:'💧 « −1/3 de résidus supplémentaires · selon une revue »', say:'…réduire déjà d’un tiers les résidus supplémentaires selon une revue.'},
 {id:'c11',a:Q.abo-.4,   b:TOTAL,        desc:'🔔 S’abonner + « Mange l’esprit tranquille » 🌿', say:'…n’hésite pas à t’abonner et mange l’esprit tranquille.'},
];
for(let i=0;i<SC.length-1;i++){ if(SC[i].b>SC[i+1].a) SC[i].b=Math.max(SC[i].a+.7,SC[i+1].a); }
const PRES=[]; SC.forEach(s=>{ const l=PRES[PRES.length-1]; if(l&&s.a-l[1]<.5) l[1]=s.b; else PRES.push([s.a,s.b]); });
const NOTES=[];

/* ---------- rythme : quelque chose (carte, zoom, emoji) toutes les 3-4 s ---------- */
const EMOT=[]; SEGS.forEach(s=>s.words.forEach(w=>{ if(w.emo) EMOT.push(w.t0); }));
/* compléter le rythme : si deux événements (zoom, carte, emoji) sont séparés de plus de 3,8 s, on ajoute un petit zoom au milieu */
for(let k=0;k<12;k++){
  const ev=[...ZP.map(z=>z.t0),...SC.map(s=>s.a),...EMOT].filter(t=>t>=INTRO_END).sort((a,b)=>a-b);
  let gi=-1,mg=0; for(let i=1;i<ev.length;i++){ if(ev[i]-ev[i-1]>mg){ mg=ev[i]-ev[i-1]; gi=i; } }
  if(mg<=3.8) break;
  const mid=(ev[gi]+ev[gi-1])/2; if(ZP.some(z=>Math.abs(z.t0-mid)<1.8)) break;
  ZP.push({t0:mid,in:.15,hold:.9,out:.4,amp:.06}); }
ZP.sort((a,b)=>a.t0-b.t0);
const RYTHME=(()=>{ const ev=[...ZP.map(z=>z.t0),...SC.map(s=>s.a),...EMOT].filter(t=>t>=INTRO_END).sort((a,b)=>a-b); let mg=0,at=0; for(let i=1;i<ev.length;i++){ if(ev[i]-ev[i-1]>mg){ mg=ev[i]-ev[i-1]; at=ev[i-1]; } }
  return {events:ev.map(x=>+x.toFixed(2)),maxGap:+mg.toFixed(2),maxGapAt:+at.toFixed(2),count:ev.length}; })();

/* ---------- DOM ---------- */
const SB=$('#subs');
CH.forEach(c=>{ const d=document.createElement('div'); d.className='sb';
  d.innerHTML='<div>'+c.words.map(w=>`<span class="w${w.key?' k':''}">${w.raw}${w.emo?`<span class="em">${w.emo}</span>`:''}</span>`).join(' ')+'</div>';
  SB.appendChild(d); c.el=d; c.ws=[...d.querySelectorAll('.w')]; c.ems=c.ws.map(s=>s.querySelector('.em')); });
CH.forEach((c,i)=>{ const nx=CH[i+1]; c.show0=c.t0-.05; c.show1=Math.min(c.t1+.3, nx?nx.t0-.05:1e9); });

/* ---------- helpers d'animation ---------- */
function tf(el,{o=1,x=0,y=0,s=1,r=0}={}){ el.style.opacity=o; el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`; }
const K={
  pop:(t,st)=>{const k=p(t,st,st+.4);return{o:clamp(k*3),s:.55+.45*eb(k),y:(1-eo(k))*20};},
  stamp:(t,st)=>{const k=p(t,st,st+.3);return{o:clamp(k*4),s:1.9-.9*eo(k),r:(1-eo(k))*-10};},
};
function put(el,t,kind,st,o={}){ const a=K[kind](t,st); a.r=(a.r||0)+(o.r||0);
  if(o.float&&t>st+.5){ a.y=(a.y||0)+Math.sin((t-st)*3)*4; a.r+=Math.sin((t-st)*2.4)*3; }
  tf(el,a); }

/* ---------- rendu ---------- */
let LASTPOS={};
function render(t){
  const top=topLimitAt(t);
  const allowed=clamp((1180-top)/30,0,1);
  let pres=0; PRES.forEach(([A,B])=>{ pres=Math.max(pres,Math.min(p(t,A,A+.3),1-p(t,B-.3,B))); });
  const a=clamp(pres)*allowed;
  const noAnimBottom=Math.min(top+165,1850), withAnimBottom=Math.max(1450,top+362);
  const textBottom=noAnimBottom+(withAnimBottom-noAnimBottom)*a;
  $('#anim').style.transform=`translateY(${top}px)`;
  SB.style.transform=`translateY(${textBottom-140}px)`;
  LASTPOS={t,top,textBottom,a,zoom:zoomAt(t)};
  SC.forEach(s=>{ const el=$('#'+s.id); const v=Math.min(p(t,s.a,s.a+.25),1-p(t,s.b-.25,s.b))*allowed; el.style.opacity=clamp(v); el.style.visibility=v<=.001?'hidden':'visible'; });

  put($('#r-card'),t,'pop',Q.res3-.1); put($('#r-stk'),t,'pop',Q.pest3,{float:1});
  { put($('#l-card'),t,'pop',Q.res4-.1); $('#l-fill').style.width=(eo(p(t,Q.res4,Q.res4+.6))*32)+'%';
    $('#l-mark').style.opacity=clamp(p(t,Q.enc,Q.enc+.3)); $('#l-lab').style.opacity=clamp(p(t,Q.lim,Q.lim+.25)); }
  { put($('#f-card'),t,'pop',Q.efsa-.1); $('#f-fill').style.width=(eo(p(t,Q.tres,Q.tres+.5))*14)+'%'; $('#f-lab').style.opacity=clamp(p(t,Q.faible,Q.faible+.25)); }
  put($('#a-card'),t,'stamp',Q.arret-.1); put($('#a-stk'),t,'pop',Q.pest6,{float:1});
  { put($('#y-card'),t,'stamp',Q.pas-.1); put($('#b-card'),t,'pop',Q.beau-.1);
    const ang=-15*eo(p(t,Q.posi-.1,Q.posi+.55))+(t<Q.posi?Math.sin((t-Q.beau)*5)*4*p(t,Q.beau,Q.beau+.3):0);
    $('#b-beam').setAttribute('transform',`rotate(${ang} 200 59)`); $('#b-l').setAttribute('transform',`rotate(${-ang} 60 64)`); $('#b-r').setAttribute('transform',`rotate(${-ang} 340 64)`); }
  { put($('#w-card'),t,'pop',SEG.s9.t0-.05); const dr=$('#w-drops'); dr.style.opacity=.55+.4*Math.sin(t*7); dr.style.transform=`translateY(${(t*34)%14}px)`; }
  { put($('#t-card'),t,'pop',Q.tiers-.15); $('#t-rev').style.opacity=clamp(p(t,Q.revue-.1,Q.revue+.25)); }
  { put($('#s-pill'),t,'stamp',Q.abo-.1); put($('#e-card'),t,'stamp',Q.mange-.1); put($('#e-leaf'),t,'pop',Q.mange+.3,{float:1}); }

  CH.forEach(c=>{ const on=t>=c.show0&&t<c.show1; const k=p(t,c.show0,c.show0+.14); c.el.style.opacity=on?clamp(k*1.5):0; c.el.style.transform=`translateY(${(1-eo(k))*10}px)`;
    if(on) c.ws.forEach((s,i)=>{ const w=c.words[i]; const cur=t>=w.t0&&t<w.t1+.08, done=t>=w.t1+.08; s.className='w'+(w.key?' k':'')+(done?' done':'')+(cur?' cur':'');
      const em=c.ems[i]; if(em){ const q=p(t,w.t0,w.t0+.3); em.style.opacity=clamp(q*3); em.style.transform=`scale(${.4+.6*eb(q)})`; } }); });
}
window.render=render; window.positionsAt=t=>{ render(t); return LASTPOS; };
window.LAYOUT={notes:NOTES,real:window.LAYOUT_REAL,words:SEGS.flatMap(g=>g.words.map(w=>({seg:g.id,raw:w.raw.replace(/ /g,' ')}))),total:TOTAL,
  segs:SEGS.map(s=>({id:s.id,text:s.text.replace(/[|*]/g,m=>m==='|'?' / ':'').replace(/\{[^}]*\}/g,''),t0:s.t0,t1:s.t1})),
  chunks:CH.map(c=>({seg:c.seg,t0:c.show0,t1:c.show1,text:c.words.map(w=>w.raw).join(' ').replace(/ /g,' ')})),
  badges:SC.map(s=>({id:s.id,a:s.a,b:s.b,desc:s.desc,say:s.say})),pres:PRES,zooms:ZP,zoomCenter:ZC,introEnd:INTRO_END,rythme:RYTHME,scenes:[],events:EV};

/* lecteur */
const q=new URLSearchParams(location.search);
if(q.has('alpha')){document.body.classList.add('alpha');document.documentElement.classList.add('alpha');}
if(q.get('layer')==='subs')document.body.classList.add('l-subs'); if(q.get('layer')==='vis')document.body.classList.add('l-vis');
const stage=$('#stage');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();
const t0q=+(q.get('t')||0);
document.fonts.ready.then(()=>render(t0q));render(t0q);
if(!q.has('render')){let t0=performance.now();(function loop(n){render(((n-t0)/1000)%TOTAL);requestAnimationFrame(loop);})(t0);}
</script>
</body>
</html>
