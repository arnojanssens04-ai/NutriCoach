<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fatigue et nutriments (léger)</title>
<style>
@font-face{font-family:'Inter';src:url(../ashwagandha/fonts/inter.woff2) format('woff2');font-weight:100 900;}
@font-face{font-family:'Lora';src:url(../ashwagandha/fonts/lora.woff2) format('woff2');font-weight:400 700;}
:root{--green:#2D5A43;--sage:#4A7A3A;--soft:#EAF2ED;--terra:#E07A5F;--terra-soft:#FBE7E0;--ink:#1A201C;--line:#E6E1D8;--red:#C0392B;--amber:#F2B544}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#111}
body{display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;color:var(--ink)}
html.alpha,body.alpha,body.alpha #stage{background:transparent!important}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;flex:none;transform-origin:center;background:linear-gradient(160deg,#6d7f78,#2a3430)}
body.l-subs #vis{display:none} body.l-vis #subs{display:none}
.emo{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;font-style:normal;font-weight:400}

/* ===== petits visuels : une seule bande basse, juste au-dessus du texte (y 1275-1375) ===== */
.bd{position:absolute;left:50%;top:1275px;height:96px;opacity:0;background:#fff;border-radius:48px;border:2px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;gap:14px;padding:0 30px;white-space:nowrap;font-weight:800;font-size:40px;letter-spacing:-.5px;margin-left:var(--mx,-150px)}
.bd .emo{font-size:56px}
#b-eu{--mx:-250px}
#b-nrj{--mx:-70px;padding:0 24px}
#b-nrj .x{position:absolute;right:-12px;top:-14px;width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center}
#b-doc{--mx:-185px;border:3px solid var(--green);color:var(--green);text-transform:uppercase;letter-spacing:1px;font-weight:900}
#tiles{position:absolute;left:121px;top:1279px;width:838px;height:88px}
.tl{position:absolute;top:0;width:96px;height:88px;opacity:0;border-radius:22px;border:3px solid;box-shadow:0 8px 22px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-family:'Lora',serif;font-weight:700;font-size:40px;letter-spacing:-1px}
.tl.g{background:var(--soft);border-color:var(--green);color:var(--green)}
.tl.a{background:#FFF3D6;border-color:var(--amber);color:#8A5A00}
.tl.t{background:var(--terra-soft);border-color:var(--terra);color:#8A3B26}

/* ===== sous-titres : en bas, SANS bandeau (lettres cerclées) pour laisser voir les mains ===== */
#subs{position:absolute;left:100px;width:860px;bottom:400px;height:140px}
.sb{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;opacity:0}
.sb > div{max-width:860px;text-align:center;font-weight:900;font-size:56px;line-height:1.1;letter-spacing:-1px;word-spacing:.12em;color:#fff;text-wrap:balance;
  -webkit-text-stroke:11px #14201A;paint-order:stroke fill;text-shadow:0 5px 18px rgba(0,0,0,.55)}
.sb .w{display:inline-block;color:rgba(255,255,255,.72)}
.sb .w.k{text-transform:uppercase;color:rgba(255,176,152,.85)}
.sb .w.done{color:#fff}
.sb .w.k.done{color:#FF9E85}
.sb .w.cur,.sb .w.k.cur{color:var(--amber)}
</style>
</head>
<body>
<div id="stage">
  <div id="vis">
    <div class="bd" id="b-eu"><span class="emo">🇪🇺</span>Allégation européenne</div>
    <div class="bd" id="b-nrj"><span class="emo">⚡</span><i class="x">✕</i></div>
    <div class="bd" id="b-doc"><span class="emo">👩‍⚕️</span>Médecin</div>
    <div id="tiles"></div>
  </div>
  <div id="subs"></div>
</div>

<script>
const WPS = 2.7, START = 0.45;
const SEGS = [
  {id:'s1',  text:'Tu dors à peu près correctement,|mais tu es quand même *fatigué*.'},
  {id:'s2a', text:'Alors, tu le sais déjà,|le *sommeil* compte.'},
  {id:'s2b', text:'Mais ce n’est pas|la seule *piste*.'},
  {id:'s3a', text:'Il existe différents *nutriments*|*ayant* une allégation européenne|ciblée sur la *fatigue*.'},
  {id:'s3b', text:'Tu veux savoir *lesquels* ?'},
  {id:'s4a', text:'Ces différents nutriments|vont contribuer à *réduire*|la fatigue quand il t’en manque.'},
  {id:'s4b', text:'Mais évidemment, c’est pas eux|qui vont te donner de l’*énergie*.'},
  {id:'s5',  text:'Alors, il s’agit de|la vitamine *B2*, la *B3*,|la *B5*, la *B6*,|la *B9*, la vitamine *B12*,|et enfin, la vitamine *C*,|et le *magnésium*.'},
  {id:'s6',  text:'Alors si tu sens|qu’une *fatigue* persiste,|eh bien n’hésite pas|à en parler à ton *médecin*|et à te complémenter|dans ce cas-là.', after:1.0},
  {id:'s7',  text:'Et n’oublie pas,|mange l’esprit *tranquille*.', after:1.0},
];
/* scènes : quels segments, quand la scène commence = 1er mot - 0,1 s */
const SCENES = [['sc1',['s1']],['sc2',['s2a','s2b']],['sc3',['s3a','s3b']],['sc4',['s4a','s4b']],['sc5',['s5']],['sc6',['s6']],['sc7',['s7']]];

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const norm=s=>s.toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');

/* ---------- layout des mots ---------- */
const CH=[]; let TOTAL=0; const SEG={};
(function layout(){
  const fix=s=>s.replace(/ ([?:!])/g,' $1');
  const all=[]; SEGS.forEach(s=>fix(s.text).split('|').forEach(c=>c.trim().split(/[ \t\n]+/).forEach(w=>all.push(w.replace(/\*/g,'')))));
  const avg=all.reduce((a,w)=>a+w.length,0)/all.length;
  let t=START; let wi=0; const REAL=(window.WORDS&&window.WORDS.words&&window.WORDS.words.length===all.length)?window.WORDS:null;
  if(window.WORDS&&!REAL) console.warn('WORDS ignoré : '+(window.WORDS.words||[]).length+' mots fournis, '+all.length+' attendus');
  SEGS.forEach(s=>{ s.words=[]; s.chunks=[];
    fix(s.text).split('|').forEach(ct=>{ const ch={seg:s.id,words:[]};
      ct.trim().split(/[ \t\n]+/).forEach(raw=>{ const c=raw.replace(/\*/g,''); const d=(c.length+2)/(avg+2)/WPS;
        const w={raw:c,norm:norm(c),key:raw.includes('*'),t0:t,t1:t+d}; t+=d; const l=c.slice(-1);
        t+= c.endsWith('…')?.3 : l===','?.15 : l===':'?.2 : (l==='.'||l==='?')?.3 : 0;
        if(REAL){ w.t0=REAL.words[wi].t0; w.t1=REAL.words[wi].t1; } wi++;
        ch.words.push(w); s.words.push(w); });
      ch.t0=ch.words[0].t0; ch.t1=ch.words[ch.words.length-1].t1; s.chunks.push(ch); CH.push(ch); });
    s.t0=s.words[0].t0; s.t1=s.words[s.words.length-1].t1; t+=(s.after||0); SEG[s.id]=s; });
  TOTAL=REAL?REAL.total:Math.ceil((t+.2)*10)/10;
  window.LAYOUT_REAL=!!REAL;
})();
const wt=(id,key,n=0)=>{ const k=norm(key); const m=SEG[id].words.filter(w=>w.norm===k); if(!m[n]) throw new Error('mot introuvable '+id+' '+key); return m[n].t0; };
const wt1=(id,key,n=0)=>{ const k=norm(key); const m=SEG[id].words.filter(w=>w.norm===k); return m[n].t1; };


/* ---------- zones libres (position de ton visage, mesurée dans ta vidéo) ---------- */
const ZN=window.ZONES||{closeups:[],faces:[]};
/* boîte de la tête à l'instant t (visage + cheveux + cou, marge de sécurité), union sur ±0,3 s */
function headBoxes(t){ const out=[]; ZN.faces.forEach(([ft,x,y,w,h])=>{ if(Math.abs(ft-t)<=.3) out.push([x-45,y-.5*h-30,x+w+45,y+h+70]); });
  if(ZN.closeups.some(([a,b])=>t>=a&&t<=b)) out.push([0,0,1080,1400]); return out; }
const hit=(r,b)=>!(r[2]<b[0]||r[0]>b[2]||r[3]<b[1]||r[1]>b[3]);
function free(rect,t){ let blocked=0; [-.2,-.1,0,.1,.2].forEach(d=>{ if(headBoxes(t+d).some(b=>hit(rect,b))) blocked++; }); return 1-blocked/5; }

/* ---------- cues ---------- */
const EV={subs:[],vis:[]}; const Q={};
Q.eu=wt('s3a','européenne'); Q.lesEnd=wt1('s3b','lesquels');
Q.ener=wt('s4b','lénergie'); Q.enerEnd=wt1('s4b','lénergie');
const TILES=[['B2','g','b2'],['B3','g','b3'],['B5','g','b5'],['B6','g','b6'],['B9','g','b9'],['B12','g','b12'],['C','a','c'],['Mg','t','magnésium']];
Q.tile=TILES.map(x=>wt('s5',x[2])); Q.listEnd=SEG.s5.t1;
Q.parler=wt('s6','parler');
/* fenêtres d'affichage des petits visuels (a = début, b = fin) */
const BADGES={
  eu:{a:Q.eu-.15,b:Q.lesEnd+.5,desc:'Pastille « 🇪🇺 Allégation européenne »',say:'…allégation européenne ciblée sur la fatigue. Tu veux savoir lesquels ?'},
  nrj:{a:Q.ener-.15,b:Q.enerEnd+1.6,desc:'⚡ barré d’un ✕',say:'…c’est pas eux qui vont te donner de l’énergie.'},
  tiles:{a:Q.tile[0]-.1,b:Q.listEnd+1.2,desc:'Rangée de 8 petites tuiles B2, B3, B5, B6, B9, B12, C, Mg',say:'…la vitamine B2, la B3 … et le magnésium.'},
  doc:{a:Q.parler-.1,b:Math.max(Q.parler-.1+3.4,SEG.s6.t1+.6),desc:'👩‍⚕️ Médecin (au moins 3 s)',say:'…n’hésite pas à en parler à ton médecin…'},
};
const NOTES=[];
/* rectangles (pour ne jamais recouvrir ta tête en gros plan) */
const PLACE={eu:{rect:[110,1275,830,1371]},nrj:{rect:[470,1275,610,1371]},doc:{rect:[355,1275,725,1371]}};

/* ---------- DOM ---------- */
const TL=[]; TILES.forEach((c,i)=>{ const d=document.createElement('div'); d.className='tl '+c[1]; d.textContent=c[0]; d.style.left=(i*(96+10))+'px'; $('#tiles').appendChild(d); TL.push(d); });
const SB=$('#subs');
CH.forEach(c=>{ const d=document.createElement('div'); d.className='sb';
  d.innerHTML='<div>'+c.words.map(w=>`<span class="w${w.key?' k':''}">${w.raw}</span>`).join(' ')+'</div>';
  SB.appendChild(d); c.el=d; c.ws=[...d.querySelectorAll('.w')]; });
CH.forEach((c,i)=>{ const nx=CH[i+1]; c.show0=c.t0-.05; c.show1=Math.min(c.t1+.3, nx?nx.t0-.05:1e9); });

/* ---------- rendu : animations réduites (fondu + léger glissement) ---------- */
function vis(el,t,a,b,rect,fin=.25){ const k=Math.min(p(t,a,a+fin),1-p(t,b-.3,b)); const f=free(rect,t); const v=clamp(k)*f;
  el.style.opacity=v; el.style.transform=`translateY(${(1-eo(clamp(k)))*14}px)`; return v; }
function render(t){
  vis($('#b-eu'),t,BADGES.eu.a,BADGES.eu.b,PLACE.eu.rect);
  vis($('#b-nrj'),t,BADGES.nrj.a,BADGES.nrj.b,PLACE.nrj.rect);
  vis($('#b-doc'),t,BADGES.doc.a,BADGES.doc.b,PLACE.doc.rect);
  TL.forEach((d,i)=>{ const x=121+i*106;
    const k=Math.min(p(t,Q.tile[i]-.05,Q.tile[i]+.25),1-p(t,BADGES.tiles.b-.3,BADGES.tiles.b)); const f=free([x,1275,x+96,1371],t);
    d.style.opacity=clamp(k)*f; d.style.transform=`translateY(${(1-eo(clamp(k)))*14}px)`; });
  CH.forEach(c=>{ const on=t>=c.show0&&t<c.show1; c.el.style.opacity=on?Math.min(1,p(t,c.show0,c.show0+.1)):0;
    if(on) c.ws.forEach((s,i)=>{ const w=c.words[i]; const cur=t>=w.t0&&t<w.t1+.08, done=t>=w.t1+.08; s.className='w'+(w.key?' k':'')+(done?' done':'')+(cur?' cur':''); }); });
}
window.render=render;
window.LAYOUT={notes:NOTES,real:window.LAYOUT_REAL,words:SEGS.flatMap(g=>g.words.map(w=>({seg:g.id,raw:w.raw.replace(/\u00A0/g,' ')}))),total:TOTAL,
  segs:SEGS.map(s=>({id:s.id,text:s.text.replace(/[|*]/g,m=>m==='|'?' / ':''),t0:s.t0,t1:s.t1})),
  chunks:CH.map(c=>({seg:c.seg,t0:c.show0,t1:c.show1,text:c.words.map(w=>w.raw).join(' ').replace(/\u00A0/g,' ')})),
  badges:Object.entries(BADGES).map(([id,b])=>({id,a:b.a,b:b.b,desc:b.desc,say:b.say})),scenes:[],events:EV,place:PLACE};

/* lecteur */
const q=new URLSearchParams(location.search);
if(q.has('alpha')){document.body.classList.add('alpha');document.documentElement.classList.add('alpha');}
if(q.get('layer')==='subs')document.body.classList.add('l-subs'); if(q.get('layer')==='vis')document.body.classList.add('l-vis');
const stage=$('#stage');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();
const t0q=+(q.get('t')||0);
document.fonts.ready.then(()=>render(t0q));render(t0q);
if(!q.has('render')){let t0=performance.now();(function loop(n){render(((n-t0)/1000)%TOTAL);requestAnimationFrame(loop);})(t0);}
</script>
</body>
</html>
