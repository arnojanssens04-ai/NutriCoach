<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cap Santé — Recette</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f3ee; --bg2:#f0ede6; --card:#ffffff; --card2:#f8f6f1;
  --border:rgba(26,25,22,0.1); --border2:rgba(26,25,22,0.18);
  --gold:#2d4f1c; --gold-l:rgba(45,79,28,0.08);
  --sage:#4a7a3a; --sage-l:rgba(74,122,58,0.1);
  --text:#1a1916; --text2:#5c5852; --text3:#a09c94;
  --r:16px; --sh:0 4px 20px rgba(26,25,22,0.08);
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }

.topbar { position:sticky; top:0; z-index:100; background:rgba(245,243,238,0.92); border-bottom:1px solid var(--border); backdrop-filter:blur(16px); padding:0 20px; height:58px; display:flex; align-items:center; justify-content:space-between; }
.t-logo { font-family:'Lora',serif; font-size:1.5rem; font-weight:700; }
.t-logo span { color:var(--gold); }
.t-back { font-size:.8rem; color:var(--text2); text-decoration:none; }

.wrap { max-width:560px; margin:0 auto; padding:20px 18px 60px; }

.rp-hero { margin-bottom:16px; }
.rp-title { font-family:'Lora',serif; font-size:1.55rem; font-weight:700; line-height:1.25; margin-bottom:10px; }
.rp-badges { display:flex; gap:8px; flex-wrap:wrap; }
.adjust-badge { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; background:var(--sage-l); border:1px solid rgba(74,122,58,0.25); border-radius:11px; padding:10px 13px; margin-top:14px; font-size:.8rem; color:var(--sage); font-weight:600; }
.adjust-toggle-btn { font-size:.72rem; font-weight:700; color:var(--gold); background:#fff; border:1px solid var(--border2); border-radius:999px; padding:5px 11px; cursor:pointer; white-space:nowrap; }
.rp-badge { font-size:.72rem; font-weight:600; padding:4px 11px; border-radius:999px; background:var(--card2); color:var(--text2); display:flex; align-items:center; gap:4px; }
.rp-badge.gold { background:var(--gold-l); color:var(--gold); }

.rp-servings { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 14px; margin:16px 0; box-shadow:var(--sh); }
.rp-servings-lbl { font-size:.8rem; color:var(--text2); flex:1; }
.rp-serv-btn { width:30px; height:30px; border-radius:50%; border:1px solid var(--border2); background:var(--card2); color:var(--text); font-size:1rem; cursor:pointer; }
.rp-serv-val { font-weight:700; min-width:60px; text-align:center; font-family:'Lora',serif; }

.rp-section { background:var(--card); border:1px solid var(--border); border-radius:var(--r); padding:16px 18px; margin-bottom:14px; box-shadow:var(--sh); }
.rp-section h2 { font-family:'Lora',serif; font-size:1.02rem; margin-bottom:12px; }

.rp-ing-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:.86rem; }
.rp-ing-row:last-child { border-bottom:none; }
.rp-ing-check { width:20px; height:20px; border-radius:6px; border:1.5px solid var(--border2); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:.7rem; color:var(--sage); transition:all .15s; }
.rp-ing-check.on { background:var(--sage-l); border-color:var(--sage); }
.rp-ing-row.done .rp-ing-name { text-decoration:line-through; color:var(--text3); }
.rp-ing-qty { color:var(--gold); font-weight:600; white-space:nowrap; margin-left:auto; }

.rp-step { display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
.rp-step:last-child { border-bottom:none; }
.rp-step-num { width:28px; height:28px; border-radius:50%; background:var(--gold); color:#fff; font-family:'Lora',serif; font-weight:700; font-size:.85rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.rp-step-body { flex:1; }
.rp-step-title { font-size:.78rem; font-weight:700; color:var(--gold); margin-bottom:4px; }
.rp-step-content { font-size:.88rem; line-height:1.55; }
.rp-timer-btn { margin-top:8px; font-size:.75rem; font-weight:600; color:var(--gold); background:var(--gold-l); border:1px solid var(--border2); border-radius:999px; padding:5px 12px; cursor:pointer; }

.btn-cookmode { width:100%; padding:14px; background:var(--gold); color:#fff; border:none; border-radius:12px; font-size:.92rem; font-weight:700; cursor:pointer; margin-bottom:14px; box-shadow:var(--sh); }

/* ── Mode cuisine plein écran ── */
#cookmode { display:none; position:fixed; inset:0; background:var(--bg); z-index:500; flex-direction:column; }
#cookmode.on { display:flex; }
.cm-top { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); gap:10px; }
.cm-progress-txt { font-size:.78rem; color:var(--text2); font-weight:600; }
.cm-wake-toggle { display:flex; align-items:center; gap:6px; font-size:.72rem; color:var(--text2); background:var(--card2); border:1px solid var(--border2); border-radius:999px; padding:5px 11px; cursor:pointer; }
.cm-wake-toggle.on { background:var(--gold-l); color:var(--gold); border-color:var(--gold); }
.cm-close { font-size:1.3rem; background:none; border:none; color:var(--text2); cursor:pointer; padding:4px 8px; }
.cm-body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 26px; text-align:center; overflow-y:auto; }
.cm-step-title { font-size:.85rem; font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:.5px; margin-bottom:14px; }
.cm-step-content { font-family:'Lora',serif; font-size:1.75rem; font-weight:700; line-height:1.35; margin-bottom:18px; }
.cm-step-ingredients { display:none; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 16px; margin-bottom:20px; width:100%; max-width:340px; text-align:left; }
.cm-step-ingredients.on { display:block; }
.cm-step-ing-lbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.5px; color:var(--text3); margin-bottom:7px; }
.cm-step-ing-row { display:flex; justify-content:space-between; font-size:.88rem; padding:3px 0; }
.cm-step-ing-row b { color:var(--gold); font-weight:700; }
.cm-timer { font-family:'Lora',serif; font-size:2.6rem; font-weight:700; color:var(--gold); margin-bottom:14px; display:none; }
.cm-timer.on { display:block; }
.cm-timer-btn { padding:12px 26px; border-radius:999px; border:2px solid var(--gold); background:var(--gold-l); color:var(--gold); font-weight:700; font-size:.9rem; cursor:pointer; margin-bottom:10px; }
.cm-nav { display:flex; gap:12px; padding:20px; }
.cm-nav-btn { flex:1; padding:16px; border-radius:12px; border:none; font-size:1rem; font-weight:700; cursor:pointer; }
.cm-prev { background:var(--card2); color:var(--text2); }
.cm-next { background:var(--gold); color:#fff; }
.cm-next:disabled, .cm-prev:disabled { opacity:.35; cursor:default; }

/* ── Anneau de progression — remplace la barre du haut, sert à la fois de
   repère "étape X/Y" et de minuteur de cuisson quand une étape en a un. ── */
.ring-wrap { position:relative; width:176px; height:176px; margin:0 auto 22px; animation:ringBreathe 5.5s ease-in-out infinite; }
.ring-wrap.timer-active { animation:ringBreathe 2.4s ease-in-out infinite; }
@keyframes ringBreathe { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.022); } }
.ring-svg { width:100%; height:100%; transform:rotate(-90deg); filter:drop-shadow(0 6px 18px rgba(45,79,28,0.16)); }
.ring-track { fill:none; stroke:var(--bg2); stroke-width:7; }
.ring-progress { fill:none; stroke:url(#ringGrad); stroke-width:7; stroke-linecap:round; transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1); }
.ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring-main { font-family:'Lora',serif; font-size:1.85rem; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; letter-spacing:.3px; }
.ring-sub { font-size:.68rem; color:var(--text2); text-transform:uppercase; letter-spacing:1.2px; margin-top:3px; }

.empty { text-align:center; padding:60px 20px; color:var(--text2); }
.toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--text); color:#fff; padding:11px 20px; border-radius:10px; font-size:.82rem; opacity:0; pointer-events:none; transition:all .25s; z-index:999; }
.toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="topbar">
  <div class="t-logo">Cap<span>Santé</span></div>
  <a href="dashboard.html" class="t-back">← Tableau de bord</a>
</header>

<div class="wrap" id="wrap-content">
  <div class="empty">Chargement de la recette…</div>
</div>

<!-- MODE CUISINE PLEIN ÉCRAN -->
<div id="cookmode">
  <div class="cm-top">
    <span class="cm-progress-txt" id="cm-progress-txt">Étape 1/1</span>
    <button class="cm-wake-toggle" id="cm-wake-toggle" onclick="toggleWakeLock()">💡 Écran maintenu allumé</button>
    <button class="cm-close" onclick="closeCookMode()">✕</button>
  </div>
  <div class="cm-body">
    <div class="ring-wrap" id="compass-companion">
      <svg class="ring-svg" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4a7a3a"/>
            <stop offset="100%" stop-color="#2d4f1c"/>
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="100" cy="100" r="86"/>
        <circle class="ring-progress" id="ring-progress" cx="100" cy="100" r="86"/>
      </svg>
      <div class="ring-center">
        <div class="ring-main" id="ring-main">1/5</div>
        <div class="ring-sub" id="ring-sub">Étape</div>
      </div>
    </div>
    <div class="cm-step-title" id="cm-step-title"></div>
    <div class="cm-step-content" id="cm-step-content"></div>
    <div class="cm-step-ingredients" id="cm-step-ingredients"></div>
    <button class="cm-timer-btn" id="cm-timer-btn" style="display:none" onclick="toggleTimer()">▶ Démarrer le minuteur</button>
  </div>
  <div class="cm-nav">
    <button class="cm-nav-btn cm-prev" id="cm-prev" onclick="cmNav(-1)">← Précédent</button>
    <button class="cm-nav-btn cm-next" id="cm-next" onclick="cmNavOrFinish()">Suivant →</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="regles-pathologies.js?v=3"></script>
<script>
var SURL = 'https://ojzjihzsycsfkcsjptrm.supabase.co';
var SKEY = 'sb_publishable_OKU12WCtb6kR3PVJL9Sw0A_s1_ocdhl';
var sb = supabase.createClient(SURL, SKEY);
var USER=null, PROF=null, RECIPE=null, GEN_STEPS=null, MULT=1;
var TICKING=null, TIMER_SECS_LEFT=0, TIMER_RUNNING=false;
var CM_INDEX=0;
var ADJUST_MODE='today', TODAY_REMAINING=null;

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2600);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pN(v){ if(v===null||v===undefined||v==='-'||v==='')return 0; return parseFloat(String(v).replace(',','.'))||0; }

// ── LANGAGE CULINAIRE (identique à recette.html, pour rester cohérent) ──
function cleanIngredientName(nom, override){
  if(override) return override;
  if(!nom) return '';
  return nom.split(',')[0].split(' (')[0].trim();
}
var UNIT_WEIGHTS = [
  {k:'pomme', w:150, label:'Pomme'}, {k:'banane', w:120, label:'Banane'},
  {k:'oeuf', w:55, label:'Œuf'}, {k:'œuf', w:55, label:'Œuf'},
  {k:'orange', w:180, label:'Orange'}, {k:'tomate', w:120, label:'Tomate'},
  {k:'yaourt', w:125, label:'Yaourt'}, {k:'citron', w:100, label:'Citron'},
  {k:'gousse d\'ail', w:5, label:'Gousse d\'ail'}, {k:'tranche de pain', w:25, label:'Tranche de pain'},
  {k:'kiwi', w:75, label:'Kiwi'}, {k:'avocat', w:170, label:'Avocat'}
];
function formatQty(nomClean, qty){
  var nLower = (nomClean||'').toLowerCase();
  var unit = UNIT_WEIGHTS.find(function(u){ return nLower.indexOf(u.k)>=0; });
  if(unit){
    var count = qty/unit.w;
    if(count >= 0.4){
      var rounded = Math.round(count*2)/2;
      return rounded+(rounded===1?' '+unit.label:' '+unit.label+'s')+' ('+Math.round(qty)+'g)';
    }
  }
  return (Math.round(qty*10)/10)+'g';
}
function detectTimerMin(text){
  var m = text.match(/(\d+)(?:\s*-\s*\d+)?\s*min/i);
  return m ? parseInt(m[1],10) : null;
}
function parseInstructionSteps(text){
  return (text||'').split('\n').map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){
    var clean = l.replace(/^(étape\s*\d+\s*[:.-]?|^\d+[.)]\s*)/i,'').trim();
    clean = clean.replace(/^(au préalable|préalablement|tout d'abord|pour commencer)\s*[:.-]?\s*/i,'');
    clean = clean.charAt(0).toUpperCase()+clean.slice(1);
    return { content: clean, timerMin: detectTimerMin(l) };
  });
}
// Wrapper local conservé pour ne pas modifier les points d'appel existants
// (calcTargets() est utilisé tel quel plus bas dans ce fichier). Le calcul
// réel vit désormais dans regles-pathologies.js (calculateTargetsShared),
// partagé avec recette.html — voir ce fichier pour les commentaires
// détaillés sur la formule et son périmètre volontairement limité.
function calcTargets(){
  return calculateTargetsShared(PROF);
}
async function getTodayRemaining(){
  var tgt = calcTargets();
  var today = new Date();
  var dateStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  var r = await sb.from('journal').select('quantite,food_kcal_100,food_prot_100,food_gluc_100,food_lip_100').eq('user_id',USER.id).eq('date',dateStr);
  var eaten = {kcal:0, prot:0, gluc:0, lip:0};
  (r.data||[]).forEach(function(e){
    var ratio = (e.quantite||0)/100;
    eaten.kcal += (e.food_kcal_100||0)*ratio;
    eaten.prot += (e.food_prot_100||0)*ratio;
    eaten.gluc += (e.food_gluc_100||0)*ratio;
    eaten.lip  += (e.food_lip_100||0)*ratio;
  });
  return {
    kcal: Math.max(0, tgt.kcal-eaten.kcal),
    prot: Math.max(0, tgt.prot-eaten.prot),
    gluc: Math.max(0, tgt.gluc-eaten.gluc),
    lip:  Math.max(0, tgt.lip-eaten.lip)
  };
}

sb.auth.getSession().then(function(r){
  if(!r.data||!r.data.session){ window.location.href='index.html'; return; }
  USER = r.data.session.user;
  init();
});

async function init(){
  var pr = await sb.from('profiles').select('*').eq('id',USER.id).single();
  PROF = pr.data || {};

  // Les recettes viennent de la vraie table Supabase (créées via
  // recette.html) — la précédente version cherchait dans un tableau
  // statique (recettes-data.js) dont les identifiants ("b1", "l1"...) ne
  // correspondent jamais aux vrais UUID transmis depuis le tableau de
  // bord : le lien "Recette" depuis un repas ne fonctionnait donc jamais
  // pour une recette réelle.
  var id = new URLSearchParams(window.location.search).get('id');
  var res = await sb.from('recettes').select('*').eq('id', id).single();
  RECIPE = res.data || null;
  if(!RECIPE){
    document.getElementById('wrap-content').innerHTML = '<div class="empty">Cette recette est introuvable — elle a peut-être été supprimée.<br><br><a href="dashboard.html" style="color:var(--gold);font-weight:600">← Retour au tableau de bord</a></div>';
    return;
  }
  GEN_STEPS = (RECIPE.steps_data && RECIPE.steps_data.length)
    ? RECIPE.steps_data.map(function(s){ return {content:s.content, timerMin:s.timerMin||null}; })
    : parseInstructionSteps(RECIPE.instructions);

  render();
  TODAY_REMAINING = await getTodayRemaining();
  applyAutoAdjust();
}

function totalKcal(){ return (RECIPE.ingredients||[]).reduce(function(s,i){ return s+pN(i.kcal)*pN(i.qty)/100; },0); }
function applyAutoAdjust(){
  if(ADJUST_MODE!=='today' || !TODAY_REMAINING){ render(); return; }
  var baseKcal = totalKcal();
  if(baseKcal<=0 || TODAY_REMAINING.kcal<=0){ MULT=1; render(); return; }
  var raw = TODAY_REMAINING.kcal/baseKcal;
  MULT = Math.round(Math.max(0.5, Math.min(4, raw))*2)/2;
  render();
}
function toggleAdjustMode(){
  ADJUST_MODE = ADJUST_MODE==='today' ? 'base' : 'today';
  if(ADJUST_MODE==='base'){ MULT=1; render(); }
  else applyAutoAdjust();
}

function render(){
  var kcalBase = Math.round(totalKcal()*MULT);
  var prot = (RECIPE.ingredients||[]).reduce(function(s,i){ return s+pN(i.prot)*pN(i.qty)/100; },0)*MULT;
  var gluc = (RECIPE.ingredients||[]).reduce(function(s,i){ return s+pN(i.gluc)*pN(i.qty)/100; },0)*MULT;
  var lip  = (RECIPE.ingredients||[]).reduce(function(s,i){ return s+pN(i.lip)*pN(i.qty)/100; },0)*MULT;
  var n = GEN_STEPS.length;
  var difficulty = n<=3 ? 'Facile' : (n<=5 ? 'Moyen' : 'Un peu plus élaboré');
  var timeSum = GEN_STEPS.reduce(function(s,st){ return s+(st.timerMin||2); },0);

  var el = document.getElementById('wrap-content');
  el.innerHTML =
    '<div class="rp-hero">'
      +'<div class="rp-title">'+esc(RECIPE.nom)+'</div>'
      +'<div class="rp-badges">'
        +'<span class="rp-badge gold">⏱ ~'+Math.max(5,timeSum)+' min</span>'
        +'<span class="rp-badge">🎚 '+difficulty+'</span>'
        +'<span class="rp-badge">🔥 '+kcalBase+' kcal</span>'
        +'<span class="rp-badge">P '+Math.round(prot)+'g</span>'
        +'<span class="rp-badge">G '+Math.round(gluc)+'g</span>'
        +'<span class="rp-badge">L '+Math.round(lip)+'g</span>'
      +'</div>'
    +'</div>'
    +'<div class="adjust-badge" id="adjust-badge"></div>'
    +'<div class="rp-servings">'
      +'<div class="rp-servings-lbl">Portion</div>'
      +'<button class="rp-serv-btn" onclick="changeMult(-0.5)">−</button>'
      +'<div class="rp-serv-val" id="mult-val">'+fmtMult()+'</div>'
      +'<button class="rp-serv-btn" onclick="changeMult(0.5)">+</button>'
    +'</div>'
    +'<button class="btn-cookmode" onclick="openCookMode()">👨‍🍳 Lancer le mode cuisine</button>'
    +'<div class="rp-section"><h2>🛒 Ingrédients</h2><div id="ing-list"></div></div>'
    +'<div class="rp-section"><h2>📋 Préparation</h2><div id="steps-list"></div></div>';

  renderIngredients();
  renderStepsList();
  renderAdjustBadge();
}

function renderAdjustBadge(){
  var el = document.getElementById('adjust-badge');
  if(!el) return;
  if(ADJUST_MODE==='today' && TODAY_REMAINING){
    el.innerHTML = '✨ Quantités ajustées à vos besoins restants (env. '+Math.round(TODAY_REMAINING.kcal)+' kcal aujourd\'hui)'
      +'<button class="adjust-toggle-btn" onclick="toggleAdjustMode()">Voir la recette de base</button>';
  } else {
    el.innerHTML = (MULT===1 ? '📖 Recette de base (1 portion)' : '✋ Réglage manuel ('+MULT+'×)')
      +'<button class="adjust-toggle-btn" onclick="toggleAdjustMode()">Ajuster à mon profil du jour</button>';
  }
}

function fmtMult(){
  return MULT===1 ? 'Base' : (MULT+'×');
}
function changeMult(d){
  ADJUST_MODE = 'base';
  MULT = Math.max(0.5, Math.min(4, MULT+d));
  render();
}

function renderIngredients(){
  var el = document.getElementById('ing-list');
  el.innerHTML = (RECIPE.ingredients||[]).map(function(ing,idx){
    var qty = Math.round(pN(ing.qty)*MULT*10)/10;
    var cleanName = cleanIngredientName(ing.nom, ing.nom_affiche);
    return '<div class="rp-ing-row" id="ing-row-'+idx+'">'
      +'<div class="rp-ing-check" onclick="toggleIng('+idx+')" id="ing-check-'+idx+'"></div>'
      +'<div class="rp-ing-name">'+esc(cleanName)+'</div>'
      +'<div class="rp-ing-qty">'+formatQty(cleanName, qty)+'</div>'
      +'</div>';
  }).join('');
}
function toggleIng(idx){
  var row = document.getElementById('ing-row-'+idx);
  var chk = document.getElementById('ing-check-'+idx);
  var on = row.classList.toggle('done');
  chk.classList.toggle('on', on);
  chk.textContent = on ? '✓' : '';
}

function renderStepsList(){
  var el = document.getElementById('steps-list');
  el.innerHTML = GEN_STEPS.map(function(s,idx){
    return '<div class="rp-step">'
      +'<div class="rp-step-num">'+(idx+1)+'</div>'
      +'<div class="rp-step-body">'
        +'<div class="rp-step-content">'+esc(s.content)+'</div>'
        +(s.timerMin ? '<button class="rp-timer-btn" onclick="quickTimer('+s.timerMin+')">⏱ Minuteur '+s.timerMin+' min</button>' : '')
      +'</div></div>';
  }).join('');
}

// ── Minuteur rapide (hors mode cuisine) ──
function quickTimer(min){
  toast('⏱ Minuteur de '+min+' min lancé — l\'onglet vous alertera à la fin.');
  setTimeout(function(){
    toast('⏰ Minuteur terminé !');
    beep();
  }, min*60*1000);
}

function beep(){
  try{
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    var o = ctx.createOscillator(); var g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); setTimeout(function(){ o.stop(); }, 350);
  }catch(e){}
}

// ── MODE CUISINE PLEIN ÉCRAN ──
var RING_CIRC = 2*Math.PI*86; // ≈ 540.35, doit correspondre à r="86" du SVG

function openCookMode(){
  if(!GEN_STEPS.length){ toast('Aucune étape à suivre pour cette recette.'); return; }
  CM_INDEX = 0;
  document.getElementById('cookmode').classList.add('on');
  document.getElementById('ring-progress').style.strokeDasharray = RING_CIRC;
  renderCookStep();
}
function closeCookMode(){
  document.getElementById('cookmode').classList.remove('on');
  stopTimer();
  if(wakeLockRef){ wakeLockRef.release(); wakeLockRef=null; }
}
function cmNav(d){
  stopTimer();
  CM_INDEX = Math.max(0, Math.min(GEN_STEPS.length-1, CM_INDEX+d));
  renderCookStep();
}
// À la dernière étape, "Suivant" devient "Terminer & valider le repas" —
// ramène simplement à la fiche recette (pas d'ajout automatique au journal
// depuis cette page, contrairement à recette.html qui a son propre choix
// de repas) avec un message de confirmation.
function cmNavOrFinish(){
  if(CM_INDEX===GEN_STEPS.length-1){
    closeCookMode();
    toast('👏 Recette terminée — bon appétit !');
    return;
  }
  cmNav(1);
}
function renderCookStep(){
  var s = GEN_STEPS[CM_INDEX];
  var total = GEN_STEPS.length;
  var isLast = CM_INDEX===total-1;
  document.getElementById('cm-progress-txt').textContent = 'Étape '+(CM_INDEX+1)+'/'+total;
  document.getElementById('cm-step-title').textContent = RECIPE.nom;
  document.getElementById('cm-step-content').textContent = s.content;
  document.getElementById('cm-prev').disabled = CM_INDEX===0;
  document.getElementById('cm-next').textContent = isLast ? 'Terminer & valider le repas' : 'Suivant →';

  var stepLower = s.content.toLowerCase();
  var matched = (RECIPE.ingredients||[]).map(function(i){
    var clean = cleanIngredientName(i.nom, i.nom_affiche);
    var found = stepLower.indexOf(clean.toLowerCase()) >= 0;
    return found ? {name:clean, qty:Math.round(pN(i.qty)*MULT*10)/10} : null;
  }).filter(Boolean);
  var ingEl = document.getElementById('cm-step-ingredients');
  if(matched.length){
    ingEl.classList.add('on');
    ingEl.innerHTML = '<div class="cm-step-ing-lbl">Pour cette étape <span style="opacity:.6">(ajusté à vos besoins)</span></div>'
      + matched.map(function(m){ return '<div class="cm-step-ing-row"><span>'+esc(m.name)+'</span><b>'+formatQty(m.name, m.qty)+'</b></div>'; }).join('');
  } else {
    ingEl.classList.remove('on');
    ingEl.innerHTML = '';
  }

  setRingProgress((CM_INDEX+1)/total);
  document.getElementById('ring-main').textContent = (CM_INDEX+1)+'/'+total;
  document.getElementById('ring-sub').textContent = 'Étape';
  setCompassTimerActive(false);

  var timerBtn = document.getElementById('cm-timer-btn');
  if(s.timerMin){
    timerBtn.style.display='inline-block';
    timerBtn.textContent = '▶ Démarrer le minuteur ('+s.timerMin+' min)';
    TIMER_SECS_LEFT = s.timerMin*60;
    TIMER_TOTAL_SECS = s.timerMin*60;
    TIMER_RUNNING = false;
  } else {
    timerBtn.style.display='none';
  }
}

// Remplit l'anneau selon une fraction 0→1 (0 = vide, 1 = plein).
function setRingProgress(frac){
  frac = Math.max(0, Math.min(1, frac));
  document.getElementById('ring-progress').style.strokeDashoffset = RING_CIRC*(1-frac);
}
function setCompassTimerActive(on){
  var el = document.getElementById('compass-companion');
  if(el) el.classList.toggle('timer-active', on);
}

// ── Écran maintenu allumé pendant la cuisine (Wake Lock API) ──
var wakeLockRef = null;
async function toggleWakeLock(){
  var btn = document.getElementById('cm-wake-toggle');
  if(!('wakeLock' in navigator)){
    toast('Fonction non disponible sur ce navigateur.');
    return;
  }
  if(wakeLockRef){
    await wakeLockRef.release();
    wakeLockRef = null;
    btn.classList.remove('on');
    return;
  }
  try{
    wakeLockRef = await navigator.wakeLock.request('screen');
    btn.classList.add('on');
    wakeLockRef.addEventListener('release', function(){ btn.classList.remove('on'); wakeLockRef=null; });
  }catch(e){
    toast('Impossible de garder l\'écran allumé sur cet appareil.');
  }
}

var TIMER_TOTAL_SECS = 0;
function toggleTimer(){
  if(TIMER_RUNNING){ stopTimer(); return; }
  TIMER_RUNNING = true;
  document.getElementById('cm-timer-btn').textContent = '⏸ En cours…';
  document.getElementById('ring-sub').textContent = 'Cuisson';
  setCompassTimerActive(true);
  updateTimerDisplay();
  TICKING = setInterval(function(){
    TIMER_SECS_LEFT--;
    updateTimerDisplay();
    if(TIMER_SECS_LEFT<=0){ stopTimer(); beep(); toast('⏰ Minuteur terminé !'); }
  }, 1000);
}
function stopTimer(){
  if(TICKING){ clearInterval(TICKING); TICKING=null; }
  TIMER_RUNNING = false;
  setCompassTimerActive(false);
  var btn = document.getElementById('cm-timer-btn');
  if(btn) btn.textContent = '▶ Démarrer le minuteur';
  var total = GEN_STEPS.length;
  document.getElementById('ring-main').textContent = (CM_INDEX+1)+'/'+total;
  document.getElementById('ring-sub').textContent = 'Étape';
  setRingProgress((CM_INDEX+1)/total);
}
function updateTimerDisplay(){
  var m = Math.floor(TIMER_SECS_LEFT/60), s = TIMER_SECS_LEFT%60;
  document.getElementById('ring-main').textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  // L'anneau se vide au fil du minuteur (image du sablier), puis revient à
  // l'état "étape" une fois le minuteur arrêté (voir renderCookStep/stopTimer).
  setRingProgress(TIMER_TOTAL_SECS ? TIMER_SECS_LEFT/TIMER_TOTAL_SECS : 0);
}
</script>
