<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cap Sant&#233; &#8212; Messages (Admin)</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f3ee; --bg2:#f0ede6; --card:#ffffff; --card2:#f8f6f1;
  --border:rgba(26,25,22,0.1); --border2:rgba(26,25,22,0.18);
  --gold:#2d4f1c; --gold-l:rgba(45,79,28,0.08);
  --sage:#4a7a3a; --rose:#8b2a2a; --rose-l:rgba(201,122,110,0.12);
  --text:#1a1916; --text2:#5c5852; --text3:#a09c94;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { background:var(--bg); height:100%; }
body { font-family:'Inter',sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; height:100vh; overflow:hidden; }

.topbar { flex-shrink:0; background:rgba(245,243,238,0.92); border-bottom:1px solid var(--border); backdrop-filter:blur(16px); padding:0 18px; height:58px; display:flex; align-items:center; justify-content:space-between; }
.t-logo { font-family:'Lora',serif; font-size:1.4rem; font-weight:700; }
.t-logo span { color:var(--gold); }
.t-back { font-size:.8rem; color:var(--text2); text-decoration:none; padding:7px 14px; border:1px solid var(--border); border-radius:8px; }
.t-back:hover { border-color:var(--gold); color:var(--gold); }

.main { flex:1; display:flex; overflow:hidden; }
.conv-list { width:280px; flex-shrink:0; border-right:1px solid var(--border); overflow-y:auto; background:var(--bg2); }
.conv-item { padding:13px 16px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .15s; }
.conv-item:hover, .conv-item.active { background:var(--card); }
.conv-name { font-size:.88rem; font-weight:600; }
.conv-preview { font-size:.76rem; color:var(--text2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.conv-badge { display:inline-block; background:var(--rose); color:#fff; font-size:.65rem; font-weight:700; padding:1px 7px; border-radius:999px; margin-left:6px; }
.empty-list { padding:30px 16px; color:var(--text2); font-size:.82rem; text-align:center; }

.thread-panel { flex:1; display:flex; flex-direction:column; }
.thread-hdr { padding:14px 18px; border-bottom:1px solid var(--border); font-family:'Lora',serif; font-size:1.1rem; flex-shrink:0; }
.thread { flex:1; overflow-y:auto; padding:18px; }
.thread > div { max-width:760px; margin:0 auto; }
.no-conv { display:flex; align-items:center; justify-content:center; height:100%; color:var(--text2); font-size:.86rem; }

.bubble-row { display:flex; margin-bottom:12px; }
.bubble-row.from-admin { justify-content:flex-end; }
.bubble-row.from-user { justify-content:flex-start; }
.bubble { max-width:65%; padding:10px 14px; border-radius:16px; font-size:.88rem; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
.bubble-row.from-user .bubble { background:var(--card); border:1px solid var(--border); border-bottom-left-radius:4px; }
.bubble-row.from-admin .bubble { background:var(--gold); color:#fff; border-bottom-right-radius:4px; }
.bubble-time { font-size:.65rem; color:var(--text3); margin-top:4px; }
.msg-edited-tag { font-style:italic; opacity:.75; }
.bubble-deleted { font-style:italic; color:var(--text3); background:var(--bg2)!important; }
.msg-menu-wrap { position:relative; align-self:flex-end; }
.msg-menu-btn { background:none; border:none; color:var(--text3); font-size:1rem; cursor:pointer; padding:2px 6px; line-height:1; }
.msg-menu { display:none; position:absolute; right:0; top:100%; background:var(--card); border:1px solid var(--border2); border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.15); z-index:50; min-width:120px; overflow:hidden; }
.msg-menu.open { display:block; }
.msg-menu button { display:block; width:100%; text-align:left; padding:9px 14px; background:none; border:none; font-size:.82rem; color:var(--text); cursor:pointer; }
.msg-menu button:hover { background:var(--bg2); }
.msg-menu button.msg-menu-danger { color:var(--rose); }
.msg-edit-ta { width:100%; min-height:60px; border:1px solid var(--border2); border-radius:8px; padding:8px 10px; font-family:inherit; font-size:.88rem; resize:vertical; background:var(--bg); color:var(--text); }
.msg-edit-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
.msg-edit-actions button { padding:6px 12px; border-radius:8px; font-size:.78rem; font-weight:600; cursor:pointer; border:none; }
.msg-edit-cancel { background:var(--bg2); color:var(--text2); }
.msg-edit-save { background:var(--gold); color:#fff; }

.input-bar { flex-shrink:0; border-top:1px solid var(--border); padding:12px 16px; display:flex; gap:10px; }
.input-bar textarea { flex:1; background:var(--card2); border:1px solid var(--border); border-radius:14px; color:var(--text); padding:11px 14px; font-family:'Inter',sans-serif; font-size:.88rem; resize:none; outline:none; max-height:160px; overflow-y:auto; line-height:1.4; }
.send-btn { width:44px; height:44px; border-radius:50%; background:var(--gold); border:none; color:#fff; font-size:1.1rem; cursor:pointer; flex-shrink:0; }
.denied { display:flex; align-items:center; justify-content:center; height:100vh; color:var(--text2); }

.thread-back { display:none; background:none; border:none; font-size:1.2rem; color:var(--text2); cursor:pointer; padding:4px 10px 4px 0; }

/* &#9472;&#9472; Mobile : un seul panneau visible &#224; la fois (liste OU conversation) &#9472;&#9472; */
@media (max-width: 720px) {
  .conv-list { width:100%; }
  .thread-panel { display:none; }
  .main.show-thread .conv-list { display:none; }
  .main.show-thread .thread-panel { display:flex; }
  .thread-back { display:inline-block; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="t-logo">Cap<span>Sant&#233;</span> &#183; Messages</div>
  <a href="admin.html" class="t-back">&#8592; Admin</a>
</header>

<div class="main" id="main" style="display:none">
  <div class="conv-list-wrap" style="width:280px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border)">
    <button onclick="openNewMsgPicker()" style="margin:10px;padding:10px;background:var(--gold);color:#fff;border:none;border-radius:9px;font-weight:700;font-size:.86rem;cursor:pointer">&#9999;&#65039; Nouveau message</button>
    <div class="conv-list" id="conv-list" style="border-right:none;flex:1"></div>
  </div>
  <div class="thread-panel">
    <div class="thread-hdr" id="thread-hdr" style="display:flex;align-items:center;justify-content:space-between">
      <span style="display:flex;align-items:center"><button class="thread-back" onclick="backToList()">&#8592;</button><span id="thread-hdr-txt">S&#233;lectionnez une conversation</span></span>
      <button id="focus-mode-btn" onclick="toggleUserFocusMode()" style="display:none;font-size:.72rem;background:var(--card2);border:1px solid var(--border2);border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--text2);white-space:nowrap" title="Masquer/afficher le chiffre exact de calories pour cet utilisateur">&#127807; Mode focus</button>
    </div>
    <div class="thread" id="thread"><div class="no-conv">Choisissez une conversation &#224; gauche</div></div>
    <div class="input-bar" id="input-bar" style="display:none">
      <textarea id="msg-input" placeholder="R&#233;pondre..." rows="1" onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
      <button class="send-btn" onclick="sendReply()">&#10148;</button>
    </div>
  </div>
</div>

<!-- S&#233;lecteur "Nouveau message" &#8212; permet d'&#233;crire &#224; n'importe quel
     utilisateur, pas seulement ceux ayant d&#233;j&#224; une conversation active. -->
<div id="new-msg-ov" style="display:none;position:fixed;inset:0;background:rgba(22,36,27,0.5);z-index:300;align-items:flex-start;justify-content:center;padding-top:8vh" onclick="if(event.target===this)closeNewMsgPicker()">
  <div style="background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:70vh;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-weight:700;font-size:1rem">&#201;crire &#224; un utilisateur</div>
      <button onclick="closeNewMsgPicker()" style="background:var(--bg2);border:none;width:30px;height:30px;border-radius:50%;cursor:pointer">&#10005;</button>
    </div>
    <input type="text" id="new-msg-search" placeholder="Rechercher par nom ou email..." oninput="filterNewMsgUsers(this.value)" style="padding:10px 12px;border:1px solid var(--border);border-radius:9px;font-size:.9rem;margin-bottom:10px;outline:none">
    <div id="new-msg-user-list" style="overflow-y:auto;flex:1"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SURL = 'https://ojzjihzsycsfkcsjptrm.supabase.co';
var SKEY = 'sb_publishable_OKU12WCtb6kR3PVJL9Sw0A_s1_ocdhl';
var sb = supabase.createClient(SURL, SKEY);

var USER=null, ALL_USERS={}, CURRENT_CONV=null, ALL_MSGS=[];
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtTime(ts){ var d=new Date(ts); return d.toLocaleDateString('fr-BE',{day:'numeric',month:'short',timeZone:'Europe/Brussels'})+' \u00e0 '+d.toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Brussels'}); }

sb.auth.getSession().then(function(r){
  if(!r.data||!r.data.session){ window.location.href='index.html'; return; }
  USER = r.data.session.user;
  checkAdminAndLoad();
});

async function checkAdminAndLoad(){
  var pr = await sb.from('profiles').select('role').eq('id',USER.id).single();
  if(!pr.data || pr.data.role!=='admin'){
    document.body.innerHTML = '<div class="denied">Acc\u00e8s r\u00e9serv\u00e9 aux administrateurs.</div>';
    return;
  }
  document.getElementById('main').style.display='flex';

  var usersRes = await sb.from('profiles').select('id,prenom,nom,email,hide_exact_kcal');
  (usersRes.data||[]).forEach(function(u){ ALL_USERS[u.id] = u; });

  await loadAllMessages();
  subscribeRealtime();

  // Deep-link : chat-admin.html?u=<user_id> ouvre directement la conversation
  // (utilis\u00e9 par le bouton "Contacter" depuis bilan_recap.html)
  var uidParam = new URLSearchParams(window.location.search).get('u');
  if(uidParam) openConv(uidParam);
}

async function loadAllMessages(){
  var r = await sb.from('messages').select('*').order('created_at',{ascending:true});
  ALL_MSGS = r.data || [];
  renderConvList();
  if(CURRENT_CONV) renderThread(CURRENT_CONV);
}

function userLabel(uid){
  var u = ALL_USERS[uid];
  if(!u) return 'Utilisateur inconnu';
  return (u.prenom||'')+' '+(u.nom||'')||u.email||'\u2014';
}

function renderConvList(){
  var byUser = {};
  ALL_MSGS.forEach(function(m){
    if(!byUser[m.user_id]) byUser[m.user_id] = [];
    byUser[m.user_id].push(m);
  });
  var convs = Object.keys(byUser).map(function(uid){
    var msgs = byUser[uid];
    var last = msgs[msgs.length-1];
    var unread = msgs.filter(function(m){ return !m.is_admin_sender && !m.read_by_admin; }).length;
    return {uid:uid, last:last, unread:unread};
  }).sort(function(a,b){ return new Date(b.last.created_at) - new Date(a.last.created_at); });

  var el = document.getElementById('conv-list');
  if(!convs.length){ el.innerHTML = '<div class="empty-list">Aucun message pour le moment.</div>'; return; }
  el.innerHTML = convs.map(function(c){
    return '<div class="conv-item'+(CURRENT_CONV===c.uid?' active':'')+'" onclick="openConv(\''+c.uid+'\')">'
      +'<div class="conv-name">'+esc(userLabel(c.uid))+(c.unread?'<span class="conv-badge">'+c.unread+'</span>':'')+'</div>'
      +'<div class="conv-preview">'+(c.last.is_admin_sender?'Vous : ':'')+esc(c.last.content)+'</div>'
      +'</div>';
  }).join('');
}

async function openConv(uid){
  CURRENT_CONV = uid;
  document.getElementById('thread-hdr-txt').textContent = userLabel(uid);
  document.getElementById('input-bar').style.display = 'flex';
  document.getElementById('main').classList.add('show-thread'); // mobile : bascule en plein \u00e9cran
  renderThread(uid);
  renderConvList();
  await sb.from('messages').update({read_by_admin:true}).eq('user_id',uid).eq('is_admin_sender',false).eq('read_by_admin',false);
  loadAllMessages();

  var focusBtn = document.getElementById('focus-mode-btn');
  var u = ALL_USERS[uid];
  focusBtn.style.display = 'inline-block';
  focusBtn.classList.toggle('on', u && u.hide_exact_kcal === true);
  focusBtn.style.background = (u && u.hide_exact_kcal===true) ? 'var(--gold-l)' : 'var(--card2)';
  focusBtn.style.color = (u && u.hide_exact_kcal===true) ? 'var(--gold)' : 'var(--text2)';
  focusBtn.textContent = (u && u.hide_exact_kcal===true) ? '\ud83c\udf3f Mode focus (actif)' : '\ud83c\udf3f Mode focus';
}

// Permet au di\u00e9t\u00e9ticien d'activer le mode focus pour un utilisateur
// directement depuis sa conversation, s'il rep\u00e8re un rapport trop
// comptable aux calories dans ses messages \u2014 sans devoir attendre que la
// personne le fasse elle-m\u00eame.
async function toggleUserFocusMode(){
  if(!CURRENT_CONV) return;
  var u = ALL_USERS[CURRENT_CONV];
  var newVal = !(u && u.hide_exact_kcal === true);
  var r = await sb.from('profiles').update({hide_exact_kcal:newVal}).eq('id',CURRENT_CONV);
  if(r.error){ alert('Erreur : '+r.error.message); return; }
  ALL_USERS[CURRENT_CONV].hide_exact_kcal = newVal;
  openConv(CURRENT_CONV); // rafra\u00eechit l'apparence du bouton
}
function backToList(){
  document.getElementById('main').classList.remove('show-thread');
}

function openNewMsgPicker(){
  document.getElementById('new-msg-ov').style.display = 'flex';
  document.getElementById('new-msg-search').value = '';
  renderNewMsgUsers(Object.values(ALL_USERS));
  document.getElementById('new-msg-search').focus();
}
function closeNewMsgPicker(){
  document.getElementById('new-msg-ov').style.display = 'none';
}
function filterNewMsgUsers(q){
  q = (q||'').toLowerCase().trim();
  var filtered = Object.values(ALL_USERS).filter(function(u){
    var label = ((u.prenom||'')+' '+(u.nom||'')+' '+(u.email||'')).toLowerCase();
    return label.indexOf(q) >= 0;
  });
  renderNewMsgUsers(filtered);
}
function renderNewMsgUsers(list){
  list = list.slice().sort(function(a,b){
    return userLabel(a.id).localeCompare(userLabel(b.id));
  });
  var el = document.getElementById('new-msg-user-list');
  if(!list.length){ el.innerHTML = '<div style="padding:16px;color:var(--text3);font-size:.85rem">Aucun utilisateur trouv\u00e9.</div>'; return; }
  el.innerHTML = list.map(function(u){
    return '<div onclick="pickNewMsgUser(\''+u.id+'\')" style="padding:11px 10px;border-radius:9px;cursor:pointer" onmouseover="this.style.background=\'var(--bg2)\'" onmouseout="this.style.background=\'transparent\'">'
      +'<div style="font-weight:600;font-size:.9rem">'+esc(userLabel(u.id))+'</div>'
      +'<div style="font-size:.78rem;color:var(--text3)">'+esc(u.email||'')+'</div>'
      +'</div>';
  }).join('');
}
function pickNewMsgUser(uid){
  closeNewMsgPicker();
  openConv(uid);
}

function renderThread(uid){
  var msgs = ALL_MSGS.filter(function(m){ return m.user_id===uid; });
  var el = document.getElementById('thread');
  el.innerHTML = msgs.map(function(m){
    var side = m.is_admin_sender ? 'from-admin' : 'from-user';
    var isMine = m.sender_id===USER.id;
    var isDeleted = !!m.deleted_at;
    var withinEditWindow = isMine && !isDeleted && (Date.now()-new Date(m.created_at).getTime()) < 5*60*1000;
    if(!window._diagEditShown && isMine && !isDeleted){
      window._diagEditShown = true;
      var ageMs = Date.now()-new Date(m.created_at).getTime();
      alert('created_at="'+m.created_at+'" \u00e2ge='+Math.round(ageMs/1000)+'s withinEditWindow='+withinEditWindow);
    }
    var editedTag = m.edited_at ? '<span class="msg-edited-tag"> \u00b7 modifi\u00e9</span>' : '';

    if(isDeleted){
      return '<div class="bubble-row '+side+'"><div>'
        +'<div class="bubble bubble-deleted">Message supprim\u00e9</div>'
        +'<div class="bubble-time">'+fmtTime(m.created_at)+'</div>'
        +'</div></div>';
    }

    var attachHtml = m.attachment_url
      ? '<a href="'+esc(m.attachment_url)+'" target="_blank" rel="noopener"><img src="'+esc(m.attachment_url)+'" alt="Pi\u00e8ce jointe" style="max-width:220px;border-radius:10px;margin-top:6px;display:block;cursor:zoom-in"></a>'
      : '';
    // Le texte "\ud83d\udcf7 Photo" est le texte de secours quand une photo est
    // envoy\u00e9e sans l\u00e9gende (voir chat.html) \u2014 inutile de l'afficher en plus
    // de l'image elle-m\u00eame, sinon \u00e7a fait doublon.
    var textHtml = (m.content && m.content!=='\ud83d\udcf7 Photo') ? esc(m.content) : '';

    var menuHtml = isMine ? (
      '<div class="msg-menu-wrap">'
        +'<button class="msg-menu-btn" onclick="toggleMsgMenu(\''+m.id+'\')">\u22ef</button>'
        +'<div class="msg-menu" id="msg-menu-'+m.id+'">'
          +(withinEditWindow ? '<button onclick="startEditMessage(\''+m.id+'\')">Modifier</button>' : '')
          +'<button onclick="deleteMessage(\''+m.id+'\')" class="msg-menu-danger">Supprimer</button>'
        +'</div>'
      +'</div>'
    ) : '';

    return '<div class="bubble-row '+side+'"><div>'
      +'<div class="bubble" id="bubble-content-'+m.id+'">'+textHtml+attachHtml+'</div>'
      +'<div class="bubble-time">'+fmtTime(m.created_at)+editedTag+'</div>'
      +'</div>'+menuHtml+'</div>';
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function toggleMsgMenu(id){
  var allMenus = document.querySelectorAll('.msg-menu.open');
  allMenus.forEach(function(el){ if(el.id!=='msg-menu-'+id) el.classList.remove('open'); });
  var menu = document.getElementById('msg-menu-'+id);
  if(menu) menu.classList.toggle('open');
}
document.addEventListener('click', function(e){
  if(!e.target.closest('.msg-menu-wrap')){
    document.querySelectorAll('.msg-menu.open').forEach(function(el){ el.classList.remove('open'); });
  }
});

function startEditMessage(id){
  toggleMsgMenu(id);
  var bubbleEl = document.getElementById('bubble-content-'+id);
  var currentText = bubbleEl.textContent;
  bubbleEl.innerHTML = '<textarea id="edit-ta-'+id+'" class="msg-edit-ta">'+esc(currentText)+'</textarea>'
    +'<div class="msg-edit-actions">'
      +'<button onclick="cancelEditMessage()" class="msg-edit-cancel">Annuler</button>'
      +'<button onclick="saveEditMessage(\''+id+'\')" class="msg-edit-save">Enregistrer</button>'
    +'</div>';
  document.getElementById('edit-ta-'+id).focus();
}
function cancelEditMessage(){
  renderThread(CURRENT_CONV);
}
async function saveEditMessage(id){
  var ta = document.getElementById('edit-ta-'+id);
  var newContent = ta.value.trim();
  if(!newContent) return;
  var r = await sb.from('messages').update({content:newContent, edited_at:new Date().toISOString()}).eq('id',id);
  if(r.error){ alert('Modification impossible : '+r.error.message); return; }
  var msgInList = ALL_MSGS.find(function(m){ return m.id===id; });
  if(msgInList){ msgInList.content = newContent; msgInList.edited_at = new Date().toISOString(); }
  renderThread(CURRENT_CONV);
}
async function deleteMessage(id){
  toggleMsgMenu(id);
  if(!confirm('Supprimer ce message ?')) return;
  var r = await sb.from('messages').update({deleted_at:new Date().toISOString()}).eq('id',id);
  if(r.error){ alert('Suppression impossible : '+r.error.message); return; }
  var msgInList = ALL_MSGS.find(function(m){ return m.id===id; });
  if(msgInList){ msgInList.deleted_at = new Date().toISOString(); }
  renderThread(CURRENT_CONV);
}

function handleKey(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendReply(); }
}

// Le champ grandit avec le texte tap\u00e9 (jusqu'\u00e0 max-height d\u00e9fini en CSS,
// au-del\u00e0 \u00e7a d\u00e9file normalement) \u2014 avant, le champ restait fig\u00e9 \u00e0 1 ligne
// et le texte d\u00e9filait hors de vue pendant la frappe.
function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

async function sendReply(){
  if(!CURRENT_CONV) return;
  var input = document.getElementById('msg-input');
  var content = input.value.trim();
  if(!content) return;
  var r = await sb.from('messages').insert({user_id:CURRENT_CONV, sender_id:USER.id, is_admin_sender:true, content:content, read_by_admin:true}).select().single();
  if(r.error){ alert('Erreur : '+r.error.message); return; }
  input.value = '';
  input.style.height = 'auto';
  notifyByEmail(r.data.id);
  loadAllMessages();
}

// D\u00e9clenche l'email de notification (admin \u2194 utilisateur) sans jamais
// bloquer l'interface \u2014 un \u00e9chec d'envoi ne doit pas g\u00eaner la conversation.
async function notifyByEmail(messageId){
  try{
    var session = await sb.auth.getSession();
    var token = session.data.session.access_token;
    await fetch(SURL+'/functions/v1/notify-message', {
      method:'POST',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body: JSON.stringify({ message_id: messageId })
    });
  }catch(e){ console.warn('[Cap Sant\u00e9] notification email non envoy\u00e9e:', e); }
}

function subscribeRealtime(){
  sb.channel('chat-admin-inbox')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, function(){ loadAllMessages(); })
    .subscribe();
}
</script>
</body>
</html>
