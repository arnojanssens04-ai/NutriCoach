<script>
var SURL = 'https://ojzjihzsycsfkcsjptrm.supabase.co';
var SKEY = 'sb_publishable_OKU12WCtb6kR3PVJL9Sw0A_s1_ocdhl';
var sb = supabase.createClient(SURL, SKEY);

// ══════════════════════════════════════════════════════════════════════
// GARDE-FOU DE MODE — protection APPLICATIVE uniquement.
//
// ⚠️ Cette constante et ces fonctions ne remplacent EN AUCUN CAS les
// policies RLS Supabase. Elles ne sont qu'une seconde ligne de défense
// côté client, destinée à empêcher qu'une évolution future de ce fichier
// active accidentellement un accès aux données réelles sans décision
// explicite. La vraie frontière de sécurité reste, comme documenté plus
// bas, la RLS côté serveur — pas ce code.
//
// SOURCE UNIQUE : une seule valeur, pas plusieurs flags qui pourraient
// entrer en conflit. 'const' empêche toute réassignation en cours
// d'exécution — aucune valeur externe (URL, localStorage, sélecteur
// d'interface) n'alimente jamais cette constante nulle part dans ce
// fichier. Le mode par défaut reste 'demo' ; passer à 'real' est une
// décision humaine explicite, prise en modifiant cette seule ligne après
// validation (audit RLS + distinction de rôle + base légale RGPD).
// ══════════════════════════════════════════════════════════════════════
const DATA_SOURCE_MODE = 'demo'; // 'demo' | 'real'

// Gardes actives, appelées avant tout calcul et tout rendu de leur
// chemin respectif. Volontairement strictes : aucun mode "presque sûr".
function assertDemoMode(){
  if(DATA_SOURCE_MODE !== 'demo'){
    throw new Error('Mode démonstration désactivé.');
  }
}
function assertRealModeAllowed(){
  if(DATA_SOURCE_MODE !== 'real'){
    throw new Error('Mode réel désactivé.');
  }
}

// ══════════════════════════════════════════════════════════════════════
// CONSTANTES — seuils provisoires, centralisés et faciles à modifier.
// Non validés nutritionnellement ; à revoir avec un professionnel avant
// tout usage réel (voir docs de spécification de cette étape).
// ══════════════════════════════════════════════════════════════════════
var OBSERVATION_WINDOW_DAYS = 7;
var BASELINE_MIN_ANALYZABLE_DAYS = 4;
var MIN_INTAKE_COUNT_PER_DAY = 2;
var MAIN_MEALS = ['breakfast', 'lunch', 'dinner'];

var PATTERN_CONFIDENCE_THRESHOLDS = {
  minAnalyzableDaysForHigh: 6,
  minRateForModerate: 0.5,
  minRateForHigh: 0.8
};

// ══════════════════════════════════════════════════════════════════════
// DONNÉES SYNTHÉTIQUES — séparées de tout accès Supabase. Aucune donnée
// réelle de patient. Format aligné sur les colonnes réelles de la table
// journal (date, repas, aliment, quantite, kcal, is_ultra_processed) pour
// que la logique de calcul reste directement réutilisable plus tard sur
// de vraies données, une fois les policies RLS vérifiées.
// ══════════════════════════════════════════════════════════════════════
var DEMO_REFERENCE_DATE = '2026-08-12';

var DEMO_JOURNAL = [
  {date:'2026-08-06', repas:'breakfast', aliment:'Céréales chocolatées', quantite:40,  kcal:152, is_ultra_processed:true},
  {date:'2026-08-06', repas:'lunch',     aliment:'Poulet riz légumes',   quantite:300, kcal:420, is_ultra_processed:false},
  {date:'2026-08-06', repas:'dinner',    aliment:'Soupe et pain',        quantite:250, kcal:300, is_ultra_processed:false},

  {date:'2026-08-07', repas:'breakfast', aliment:'Barre céréale industrielle', quantite:25,  kcal:110, is_ultra_processed:true},
  {date:'2026-08-07', repas:'lunch',     aliment:'Salade composée',           quantite:180, kcal:150, is_ultra_processed:false},

  {date:'2026-08-08', repas:'snack', aliment:'Chips', quantite:30, kcal:160, is_ultra_processed:true},

  {date:'2026-08-09', repas:'breakfast', aliment:'Pain blanc beurre',      quantite:60,  kcal:180, is_ultra_processed:false},
  {date:'2026-08-09', repas:'lunch',     aliment:'Plat préparé surgelé',   quantite:280, kcal:420, is_ultra_processed:true},
  {date:'2026-08-09', repas:'dinner',    aliment:'Poisson légumes vapeur', quantite:220, kcal:250, is_ultra_processed:false},

  {date:'2026-08-10', repas:'breakfast', aliment:"Flocons d'avoine fruits", quantite:80,  kcal:300, is_ultra_processed:false},
  {date:'2026-08-10', repas:'lunch',     aliment:'Quinoa légumineuses',     quantite:250, kcal:320, is_ultra_processed:false},
  {date:'2026-08-10', repas:'snack',     aliment:'Amandes',                 quantite:null, kcal:null, is_ultra_processed:false},

  {date:'2026-08-11', repas:'breakfast', aliment:'Viennoiserie industrielle', quantite:70,  kcal:280, is_ultra_processed:true},
  {date:'2026-08-11', repas:'lunch',     aliment:'Sandwich jambon',           quantite:200, kcal:380, is_ultra_processed:false},
  {date:'2026-08-11', repas:'dinner',    aliment:'Pâtes légumes',             quantite:300, kcal:420, is_ultra_processed:false},

  {date:'2026-08-12', repas:'breakfast', aliment:'Yaourt nature', quantite:125, kcal:80, is_ultra_processed:false}
];

// ══════════════════════════════════════════════════════════════════════
// FONCTIONS DE CALCUL PURES — aucun accès DOM, aucun accès Supabase.
// Prennent des données en paramètre, retournent des structures simples.
// ══════════════════════════════════════════════════════════════════════

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Construit une chaîne 'YYYY-MM-DD' pour (referenceDate - offsetDays).
function shiftDateStr(referenceDate, offsetDays){
  var d = new Date(referenceDate + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + offsetDays);
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0') + '-' + String(d.getUTCDate()).padStart(2,'0');
}

// Évalue un seul jour à partir de ses entrées journal.
// AUCUNE règle basée sur les kcal. Une quantité absente dégrade la
// qualité ("degraded") mais ne supprime jamais la prise du décompte,
// tant que l'aliment est reconnu (champ "aliment" non vide).
function computeDayCompleteness(entriesForDay, date){
  entriesForDay = entriesForDay || [];
  var hasData = entriesForDay.length > 0;

  var recognizedIntakes = entriesForDay.filter(function(e){ return !!(e.aliment && String(e.aliment).trim()); });
  var intakeCount = recognizedIntakes.length;
  var missingQty = recognizedIntakes.filter(function(e){ return e.quantite===null || e.quantite===undefined; }).length;

  var mealsSet = {};
  entriesForDay.forEach(function(e){ if(e.repas) mealsSet[e.repas] = true; });
  var mealsLogged = Object.keys(mealsSet).length;
  var hasMainMeal = MAIN_MEALS.some(function(m){ return !!mealsSet[m]; });

  var reasons = [];
  if(!hasData) reasons.push('no_data');
  else {
    if(intakeCount < MIN_INTAKE_COUNT_PER_DAY) reasons.push('insufficient_intakes');
    if(!hasMainMeal) reasons.push('no_main_meal');
  }
  var isAnalyzable = hasData && intakeCount >= MIN_INTAKE_COUNT_PER_DAY && hasMainMeal;

  var quality;
  if(!hasData) quality = 'none';
  else if(!isAnalyzable) quality = 'insufficient';
  else if(missingQty > 0) quality = 'degraded';
  else quality = 'good';

  return {
    date: date,
    has_data: hasData,
    entries_count: entriesForDay.length,
    intake_count: intakeCount,
    intakes_missing_quantity: missingQty,
    meals_logged: mealsLogged,
    has_main_meal: hasMainMeal,
    is_analyzable: isAnalyzable,
    quality: quality,
    reasons: reasons
  };
}

// Construit la fenêtre d'observation complète : regroupe le journal par
// jour calendaire (referenceDate - (windowDays-1) .. referenceDate),
// calcule un DayCompleteness par jour, puis agrège. Aucun jour n'est
// supprimé de la sortie, même non analysable.
function computeObservationWindow(journal, windowDays, referenceDate){
  journal = journal || [];
  windowDays = windowDays || OBSERVATION_WINDOW_DAYS;

  var byDate = {};
  journal.forEach(function(e){
    if(!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e);
  });

  var days = [];
  for(var i = windowDays - 1; i >= 0; i--){
    var d = shiftDateStr(referenceDate, -i);
    days.push(computeDayCompleteness(byDate[d], d));
  }

  var daysWithData = days.filter(function(d){ return d.has_data; }).length;
  var analyzableDays = days.filter(function(d){ return d.is_analyzable; });
  var analyzableCount = analyzableDays.length;

  var avgMeals = analyzableCount > 0
    ? analyzableDays.reduce(function(s,d){ return s + d.meals_logged; }, 0) / analyzableCount
    : 0;

  return {
    window_days: windowDays,
    reference_date: referenceDate,
    calendar_days: windowDays,
    days_with_data: daysWithData,
    analyzable_days: analyzableCount,
    data_completeness: windowDays > 0 ? analyzableCount / windowDays : 0,
    average_meals_per_day: avgMeals,
    baseline_ready: analyzableCount >= BASELINE_MIN_ANALYZABLE_DAYS,
    days: days
  };
}

// Énergie enregistrée — purement descriptive. Ne détermine jamais si un
// jour est valide, ne porte aucune interprétation clinique.
function computeRecordedEnergy(entriesForDay, date){
  entriesForDay = entriesForDay || [];
  var total = entriesForDay.reduce(function(s,e){ return s + (typeof e.kcal==='number' ? e.kcal : 0); }, 0);
  return {
    date: date,
    recorded_energy_kcal: total,
    energy_interpretation: 'not_interpreted',
    safety_module: 'not_implemented'
  };
}

// ══════════════════════════════════════════════════════════════════════
// REGISTRE CENTRAL DES MOTIFS — un seul endroit pour seuils, textes et
// statut actif/inactif de chaque motif. Ne décrit et ne détecte que des
// observations descriptives — ne choisit jamais une intervention.
//
// Décisions validées humainement pour "repeated_ultra_processed_foods" :
// - minimumOccurrences=2, compté en JOURS ANALYSABLES DISTINCTS où le
//   motif est présent (jamais deux occurrences dans la même journée) ;
// - sous ce seuil : aucun message (motif silencieusement absent) ;
// - donnée insuffisante (is_ultra_processed absent/null/incohérent sur
//   au moins une prise reconnue d'un jour) : ce jour est exclu du calcul
//   (ni occurrence, ni non-occurrence) — jamais déduit du nom de
//   l'aliment, jamais basculé vers une autre source.
// ══════════════════════════════════════════════════════════════════════
const PATTERN_REGISTRY = {
  repeated_ultra_processed_foods: {
    id: 'repeated_ultra_processed_foods',
    label: 'Présence répétée d’aliments ultra-transformés',
    observationWindowDays: OBSERVATION_WINDOW_DAYS,
    minimumOccurrences: 2,
    requiredFields: ['is_ultra_processed'],
    confidenceLevels: PATTERN_CONFIDENCE_THRESHOLDS,
    allowedMessage:
      'Une présence répétée d’aliments classés comme ultra-transformés '
      + 'a été observée sur plusieurs journées de la période analysée.',
    insufficientDataMessage:
      'Les données disponibles ne permettent pas d’évaluer ce motif '
      + 'pour la période analysée, car la classification de certains '
      + 'aliments est inconnue.',
    forbiddenMessages: [
      'Vous devez arrêter ces aliments.',
      'Votre alimentation est mauvaise.',
      'Cela augmente votre risque de maladie.',
      'Remplacez immédiatement ces aliments.',
      'Vous avez une alimentation déséquilibrée.'
    ],
    enabled: true
  }
};

// Évalue UN jour à partir de ses entrées journal, pour le seul champ
// is_ultra_processed. 'insufficient' dès qu'au moins une prise reconnue
// de ce jour a une classification absente/null/incohérente (ni true, ni
// false) — jamais déduite du nom de l'aliment (requiredFields du
// registre déclare explicitement la seule donnée utilisée).
function evaluateUltraProcessedForDay(dayEntries){
  dayEntries = dayEntries || [];
  var hasUnknown = dayEntries.some(function(e){
    return e.is_ultra_processed !== true && e.is_ultra_processed !== false;
  });
  if(hasUnknown) return 'insufficient';
  var hasTrue = dayEntries.some(function(e){ return e.is_ultra_processed === true; });
  return hasTrue ? 'present' : 'absent';
}

// Moteur de détection générique piloté par le registre — ne connaît
// aucune logique nutritionnelle en dur, seulement ce que l'entrée du
// registre déclare. Ne regroupe pas deux fois : consomme
// observationWindow.days, déjà calculé par computeObservationWindow.
// Ne reçoit du journal que les entrées, jamais un profil/pathologie.
function detectPatternFromRegistry(patternId, observationWindow, journalEntries){
  var entry = PATTERN_REGISTRY[patternId];
  if(!entry){
    throw new Error('Motif inconnu : ' + patternId);
  }
  if(!entry.enabled){
    return {
      id: patternId, label: entry.label, enabled: false,
      status: 'not_evaluated',
      window_days: entry.observationWindowDays,
      evaluated_days: 0, insufficient_days: 0, occurrence_days: 0, occurrence_rate: 0,
      minimum_occurrences: entry.minimumOccurrences,
      is_confirmed: false, confidence: 'unknown', confidence_basis: null,
      message: null
    };
  }

  var byDate = {};
  (journalEntries || []).forEach(function(e){
    if(!byDate[e.date]) byDate[e.date] = [];
    byDate[e.date].push(e);
  });

  var analyzableDays = observationWindow.days.filter(function(d){ return d.is_analyzable; });
  var stateByDay = analyzableDays.map(function(d){ return evaluateUltraProcessedForDay(byDate[d.date]); });

  var insufficientDays = stateByDay.filter(function(s){ return s === 'insufficient'; }).length;
  var evaluatedDays = stateByDay.length - insufficientDays;
  var occurrenceDays = stateByDay.filter(function(s){ return s === 'present'; }).length;
  var occurrenceRate = evaluatedDays > 0 ? occurrenceDays / evaluatedDays : 0;

  var thresholds = entry.confidenceLevels;
  var confidence = 'unknown';
  if(evaluatedDays >= MIN_INTAKE_COUNT_PER_DAY){
    if(occurrenceRate >= thresholds.minRateForHigh && evaluatedDays >= thresholds.minAnalyzableDaysForHigh) confidence = 'high';
    else if(occurrenceRate >= thresholds.minRateForModerate) confidence = 'moderate';
    else confidence = 'low';
  }

  var status, message;
  if(evaluatedDays === 0){
    status = 'insufficient_data';
    message = entry.insufficientDataMessage;
    confidence = 'unknown';
  } else if(occurrenceDays < entry.minimumOccurrences){
    status = 'below_threshold';
    message = null;
  } else {
    status = 'detected';
    message = entry.allowedMessage;
  }

  return {
    id: patternId, label: entry.label, enabled: true,
    status: status,
    window_days: entry.observationWindowDays,
    evaluated_days: evaluatedDays,
    insufficient_days: insufficientDays,
    occurrence_days: occurrenceDays,
    occurrence_rate: occurrenceRate,
    minimum_occurrences: entry.minimumOccurrences,
    is_confirmed: false, // toujours false à cette étape — jamais déduit automatiquement
    confidence: confidence,
    confidence_basis: thresholds ? {
      min_analyzable_days_for_high: thresholds.minAnalyzableDaysForHigh,
      min_rate_for_moderate: thresholds.minRateForModerate,
      min_rate_for_high: thresholds.minRateForHigh
    } : null,
    message: message
  };
}

// Synthèse neutre — aucune recommandation, aucun nom d'aliment, aucune
// action proposée. Reprend les deux formulations déjà validées.
function buildNeutralSynthesis(observationWindow, pattern){
  if(!observationWindow.baseline_ready){
    return {
      title: 'Phase d’observation en cours',
      text: 'Sur les ' + observationWindow.window_days + ' derniers jours, '
        + observationWindow.analyzable_days + ' jour' + (observationWindow.analyzable_days>1?'s':'')
        + ' sont suffisamment complets pour être analysés. '
        + 'Il est encore trop tôt pour dégager une tendance fiable.'
    };
  }
  return {
    title: 'Ligne de base disponible',
    text: 'Nous avons maintenant suffisamment de données pour commencer à observer des tendances. '
      + 'Aucun conseil ou changement n’est proposé à cette étape.'
  };
}

// ══════════════════════════════════════════════════════════════════════
// RENDU DOM — seule fonction qui touche le document. Ne fait aucun calcul.
// ══════════════════════════════════════════════════════════════════════
function renderObservationPage(observationWindow, pattern, energyByDay){
  var statusEl = document.getElementById('observation-status');
  statusEl.innerHTML = '<div class="card">'
    + '<h2>Fenêtre d’observation</h2>'
    + '<div class="stats-row">'
      + '<div class="stat-card"><div class="stat-val">' + observationWindow.calendar_days + '</div><div class="stat-lbl">Jours calendaires</div></div>'
      + '<div class="stat-card"><div class="stat-val">' + observationWindow.analyzable_days + '</div><div class="stat-lbl">Jours analysables</div></div>'
      + '<div class="stat-card"><div class="stat-val">' + Math.round(observationWindow.data_completeness*100) + '%</div><div class="stat-lbl">Complétude</div></div>'
    + '</div>'
    + '<div style="font-size:.82rem;color:var(--text2);margin-top:10px">Moyenne de ' + observationWindow.average_meals_per_day.toFixed(1) + ' repas enregistrés par jour analysable.</div>'
    + '<div class="baseline-badge ' + (observationWindow.baseline_ready ? 'baseline-yes' : 'baseline-no') + '">'
      + (observationWindow.baseline_ready ? '✓ Ligne de base disponible' : '⏳ Ligne de base non atteinte')
    + '</div>'
    + '<h3>Détail par jour</h3>'
    + observationWindow.days.map(function(d){
        var energy = energyByDay[d.date];
        var detail = d.has_data
          ? (d.intake_count + ' prise' + (d.intake_count>1?'s':'') + ', ' + d.meals_logged + ' repas'
             + (d.intakes_missing_quantity>0 ? ' — ' + d.intakes_missing_quantity + ' quantité manquante' : '')
             + ' — apport enregistré ' + energy.recorded_energy_kcal + ' kcal (non interprété)')
          : 'Aucune donnée enregistrée';
        if(!d.is_analyzable && d.has_data) detail += ' — non analysable (' + d.reasons.join(', ') + ')';
        return '<div class="day-row">'
          + '<div class="day-date">' + esc(d.date) + '</div>'
          + '<div class="day-detail">' + esc(detail) + '</div>'
          + '<div class="day-quality q-' + d.quality + '">' + d.quality + '</div>'
          + '</div>';
      }).join('')
    + '</div>';

  document.getElementById('patterns-zone').innerHTML = renderPatternCard(pattern);

  var syntheseEl = document.getElementById('synthese-neutre');
  var synth = buildNeutralSynthesis(observationWindow, pattern);
  syntheseEl.innerHTML = '<div class="synthese"><strong>' + esc(synth.title) + '</strong>' + esc(synth.text) + '</div>';

  var missingEl = document.getElementById('missing-info');
  var nonAnalyzable = observationWindow.days.filter(function(d){ return !d.is_analyzable; });
  missingEl.innerHTML = nonAnalyzable.length
    ? '<div class="card"><h2>Informations manquantes</h2><div class="missing-list">'
      + nonAnalyzable.map(function(d){
          return '<div>' + esc(d.date) + ' — ' + (d.has_data ? esc(d.reasons.join(', ')) : 'aucune donnée') + '</div>';
        }).join('')
      + '</div></div>'
    : '';
}

// Construit le HTML d'un motif du registre selon son statut. Aucun cas
// n'affiche de conseil, de substitution ni de jugement — seulement les
// deux textes validés du registre (allowedMessage / insufficientDataMessage)
// ou une absence de message (below_threshold).
function renderPatternCard(pattern){
  if(!pattern.enabled){
    return '<div class="card"><h2>Motifs observés</h2><div class="loading-msg">Aucun motif actif.</div></div>';
  }
  var body;
  if(pattern.status === 'insufficient_data'){
    body = '<p style="font-size:.86rem;color:var(--text2)">' + esc(pattern.message) + '</p>';
  } else if(pattern.status === 'below_threshold'){
    body = '<p style="font-size:.86rem;color:var(--text2)">Aucun motif significatif observé sur la période analysée.</p>';
  } else {
    body = '<div class="pattern-row">'
      + '<span>' + esc(pattern.label) + '</span>'
      + '<span class="confidence-tag conf-' + pattern.confidence + '">' + pattern.confidence + '</span>'
      + '</div>'
      + '<p style="font-size:.88rem;color:var(--text);margin-top:8px">' + esc(pattern.message) + '</p>'
      + '<div style="font-size:.76rem;color:var(--text3);margin-top:8px">'
      + pattern.occurrence_days + ' / ' + pattern.evaluated_days + ' jours évalués ('
      + Math.round(pattern.occurrence_rate*100) + '%)'
      + (pattern.insufficient_days>0 ? ' — ' + pattern.insufficient_days + ' jour(s) exclu(s) pour classification inconnue' : '')
      + '</div>';
  }
  return '<div class="card"><h2>Motifs observés</h2>' + body + '</div>';
}

// ══════════════════════════════════════════════════════════════════════
// ACCÈS — contrôle client-side reproduisant le patron de admin.html.
// Voir le commentaire HTML au-dessus de ce bloc : ce n'est pas une
// sécurité serveur. Aucune donnée réelle de journal/profils/bilans n'est
// lue ici au-delà de la propre ligne "role" de la session en cours.
// ══════════════════════════════════════════════════════════════════════
var ADMIN_UID = null;

sb.auth.getSession().then(function(r){
  if(!r.data || !r.data.session){ window.location.href='index.html'; return; }
  var uid = r.data.session.user.id;
  ADMIN_UID = uid;
  // ⚠️ GARDE : cette requête doit TOUJOURS rester filtrée sur eq('id', uid)
  // (la propre ligne de l'utilisateur connecté) et ne sélectionner que la
  // colonne 'role'. Ne jamais l'élargir en select('*') ni retirer le
  // .eq('id', uid) — ce serait une lecture globale de `profiles`, interdite
  // à cette étape (voir garde-fou DATA_SOURCE_MODE en tête de fichier).
  sb.from('profiles').select('role').eq('id', uid).single().then(function(res){
    if(!res.data || res.data.role !== 'admin'){
      document.getElementById('access-check').innerHTML = '<div class="denied">Accès réservé aux administrateurs.</div>';
      return;
    }
    document.getElementById('access-check').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    if(DATA_SOURCE_MODE === 'demo'){ runDemo(); }
    if(DATA_SOURCE_MODE === 'real'){ runReal(); }
  });
});

function runDemo(){
  // Garde-fou obligatoire : appelée avant tout calcul et tout rendu.
  // Si elle échoue, on interrompt immédiatement — aucun calcul, aucun
  // accès à une donnée quelconque, aucun rendu partiel.
  try{
    assertDemoMode();
  } catch(e){
    renderSecurityBlock();
    return;
  }

  // Aucun user_id n'est jamais lu depuis l'URL ou le localStorage dans
  // cette page — contrainte volontaire, pas un oubli. Ne pas ajouter
  // `new URLSearchParams(window.location.search).get('user_id')` ou
  // équivalent ici sans revalider entièrement cette étape.
  var observationWindow = computeObservationWindow(DEMO_JOURNAL, OBSERVATION_WINDOW_DAYS, DEMO_REFERENCE_DATE);

  var energyByDay = {};
  var byDate = {};
  DEMO_JOURNAL.forEach(function(e){ if(!byDate[e.date]) byDate[e.date] = []; byDate[e.date].push(e); });
  observationWindow.days.forEach(function(d){
    energyByDay[d.date] = computeRecordedEnergy(byDate[d.date], d.date);
  });

  var pattern = detectPatternFromRegistry('repeated_ultra_processed_foods', observationWindow, DEMO_JOURNAL);

  renderObservationPage(observationWindow, pattern, energyByDay);

  var trendResult = computeTrendResult('repeated_ultra_processed_foods', DEMO_JOURNAL, DEMO_REFERENCE_DATE);
  renderTrendCardsZone([trendResult]);
}

// Affichée uniquement si assertDemoMode() échoue. Message volontairement
// sans détail technique (pas de trace d'erreur, pas de nom de variable)
// pour ne rien exposer côté interface.
function renderSecurityBlock(){
  document.getElementById('content').innerHTML =
    '<div class="demo-banner" style="background:var(--rose-l);border-color:rgba(139,42,42,0.3)">'
    + '<strong style="color:var(--rose)">Accès bloqué</strong>'
    + '<p>Cette page ne peut pas afficher de contenu tant que le mode démonstration n’est pas correctement actif. '
    + 'Aucune donnée n’a été chargée.</p>'
    + '</div>';
}

// ══════════════════════════════════════════════════════════════════════
// CHEMIN RÉEL — codé mais n'est jamais appelé tant que DATA_SOURCE_MODE
// vaut 'demo' (voir le branchement dans le bloc ACCÈS ci-dessus). Aucun
// repli automatique vers DEMO_JOURNAL en cas d'erreur : toute erreur
// arrête le pipeline et affiche un message neutre, jamais un résultat
// partiel ni des données fictives présentées comme réelles.
// ══════════════════════════════════════════════════════════════════════
var SELECTABLE_PATIENTS = [];
var SELECTED_PATIENT_ID = null;

// Date de référence unique et contrôlée — pas de new Date() dispersé.
// En production : aujourd'hui. Le calcul est isolé ici pour rester le
// seul endroit à modifier si un besoin de test avec une référence
// injectée apparaît pour ce chemin (les fonctions de calcul, elles,
// acceptent déjà une referenceDate en paramètre — voir computeObservationWindow).
function getReferenceDate(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function clearObservationZones(){
  document.getElementById('observation-status').innerHTML = '';
  document.getElementById('patterns-zone').innerHTML = '';
  document.getElementById('synthese-neutre').innerHTML = '';
  document.getElementById('missing-info').innerHTML = '';
  var cardsZone = document.getElementById('trend-cards-zone');
  if(cardsZone) cardsZone.innerHTML = '';
  var dialogsZone = document.getElementById('trend-dialogs-zone');
  if(dialogsZone) dialogsZone.innerHTML = '';
}

// Bootstrap factorisé de la zone des cartes de tendance — appelé depuis
// runDemo() et loadRealJournalAndRender(). Ne contient aucun calcul
// métier (TrendCardResult est déjà calculé par computeTrendResult avant
// l'appel) et aucune branche par état : le détail de chaque état est
// géré exclusivement par trend-card-render.js. N'insère que du HTML déjà
// échappé par renderCompactCard()/renderDialog() — aucune donnée brute de
// journal n'est concaténée ici.
function renderTrendCardsZone(results){
  var cardsZone = document.getElementById('trend-cards-zone');
  var dialogsZone = document.getElementById('trend-dialogs-zone');
  if(!cardsZone || !dialogsZone) return;
  cardsZone.innerHTML = results.map(function(r, i){
    return renderCompactCard(r, 'trend-dialog-' + i, 'trend-btn-' + i);
  }).join('');
  dialogsZone.innerHTML = results.map(function(r, i){
    return renderDialog(r, 'trend-dialog-' + i, 'trend-title-' + i);
  }).join('');
  wireTrendDialogs(results.map(function(r, i){
    return {
      buttonEl: document.getElementById('trend-btn-' + i),
      dialogEl: document.getElementById('trend-dialog-' + i)
    };
  }));
}

function renderLoadingState(){
  document.getElementById('observation-status').innerHTML = '<div class="loading-msg">Chargement…</div>';
}

// Message neutre en cas d'erreur Supabase — aucun détail technique
// (pas de message d'erreur brut, pas de code d'erreur) exposé à l'écran.
function renderRealDataError(){
  clearObservationZones();
  document.getElementById('observation-status').innerHTML =
    '<div class="demo-banner" style="background:var(--rose-l);border-color:rgba(139,42,42,0.3)">'
    + '<strong style="color:var(--rose)">Erreur</strong>'
    + '<p>Impossible de charger les données pour le moment. Réessayez plus tard.</p>'
    + '</div>';
}

function runReal(){
  try{
    assertRealModeAllowed();
  } catch(e){
    renderSecurityBlock();
    return;
  }
  clearObservationZones();
  document.getElementById('patient-selector-zone').innerHTML = '<div class="loading-msg">Chargement de la liste des patients…</div>';
  loadSelectablePatients();
}

// Liste minimale : id/prenom/nom uniquement, jamais select('*'), jamais
// de donnée de santé. Couverte par la policy admin déjà auditée sur
// `profiles` (is_admin()), pas une lecture globale non contrôlée.
function loadSelectablePatients(){
  sb.from('profiles').select('id, prenom, nom').order('prenom').then(function(res){
    if(res.error){ renderRealDataError(); return; }
    SELECTABLE_PATIENTS = res.data || [];
    renderPatientSelector(SELECTABLE_PATIENTS);
  });
}

function renderPatientSelector(list){
  var zone = document.getElementById('patient-selector-zone');
  if(!list.length){
    zone.innerHTML = '<div class="card">Aucun patient accessible.</div>';
    return;
  }
  var options = '<option value="">— Choisir un patient —</option>' + list.map(function(p){
    var label = ((p.prenom||'') + ' ' + (p.nom||'')).trim() || p.id;
    return '<option value="' + esc(p.id) + '">' + esc(label) + '</option>';
  }).join('');
  zone.innerHTML = '<div class="card"><h2>Sélection du patient</h2>'
    + '<select class="patient-select" id="patient-select" onchange="onPatientSelected(this.value)">' + options + '</select>'
    + '</div>';
}

// selectedPatientId n'est JAMAIS pris pour argent comptant : même généré
// par notre propre <select>, il reste manipulable côté client — donc
// revérifié contre SELECTABLE_PATIENTS avant tout appel journal.
function onPatientSelected(patientId){
  clearObservationZones();
  if(!patientId){ return; }
  var isAllowed = SELECTABLE_PATIENTS.some(function(p){ return p.id === patientId; });
  if(!isAllowed){
    renderRealDataError();
    return;
  }
  SELECTED_PATIENT_ID = patientId;
  renderLoadingState();
  loadRealJournalAndRender(patientId);
}

// Requête filtrée obligatoirement par user_id + bornes de dates. Colonnes
// strictement limitées à ce que les fonctions d'observation consomment —
// aucune colonne de pathologie, symptôme ou traitement (ces données ne
// sont d'ailleurs pas dans la table journal).
function loadRealJournalAndRender(patientId){
  var referenceDate = getReferenceDate();
  var windowStart = shiftDateStr(referenceDate, -(OBSERVATION_WINDOW_DAYS - 1));

  sb.from('journal')
    .select('date, repas, aliment, quantite, kcal, is_ultra_processed')
    .eq('user_id', patientId)
    .gte('date', windowStart)
    .lte('date', referenceDate)
    .then(function(res){
      if(res.error){ renderRealDataError(); return; }

      var journal = res.data || [];
      var observationWindow = computeObservationWindow(journal, OBSERVATION_WINDOW_DAYS, referenceDate);

      var energyByDay = {};
      var byDate = {};
      journal.forEach(function(e){ if(!byDate[e.date]) byDate[e.date] = []; byDate[e.date].push(e); });
      observationWindow.days.forEach(function(d){
        energyByDay[d.date] = computeRecordedEnergy(byDate[d.date], d.date);
      });

      // Même moteur, même registre que le mode démo — un seul mécanisme
      // de détection, pas de logique dupliquée entre les deux chemins.
      var pattern = detectPatternFromRegistry('repeated_ultra_processed_foods', observationWindow, journal);

      renderObservationPage(observationWindow, pattern, energyByDay);

      var trendResult = computeTrendResult('repeated_ultra_processed_foods', journal, referenceDate);
      renderTrendCardsZone([trendResult]);
    });
}
</script>
