<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cap Santé — Assistance</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f3ee; --bg2:#f0ede6; --card:#ffffff; --card2:#f8f6f1;
  --border:rgba(26,25,22,0.1); --border2:rgba(26,25,22,0.18);
  --gold:#2d4f1c; --gold-l:rgba(45,79,28,0.08);
  --sage:#4a7a3a; --sage-l:rgba(74,122,58,0.1);
  --text:#1a1916; --text2:#5c5852; --text3:#a09c94;
  --rose:#8b2a2a;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { background:var(--bg); height:100%; }
body { font-family:'Inter',sans-serif; color:var(--text); -webkit-font-smoothing:antialiased;
       display:flex; flex-direction:column; height:100vh; overflow:hidden; }

.topbar { flex-shrink:0; background:rgba(245,243,238,0.96); border-bottom:1px solid var(--border);
          backdrop-filter:blur(16px); padding:0 18px; height:56px;
          display:flex; align-items:center; justify-content:space-between; }
.t-logo { font-family:'Lora',serif; font-size:1.1rem; font-weight:700; display:flex; align-items:center; gap:7px; }
.t-logo span { color:var(--gold); }
.t-back { font-size:.78rem; color:var(--text2); text-decoration:none;
          padding:6px 13px; border:1px solid var(--border); border-radius:8px; transition:all .15s; }
.t-back:hover { border-color:var(--gold); color:var(--gold); }

.chat-outer { flex:1; overflow:hidden; padding:18px 16px; display:flex; justify-content:center; background:var(--bg2); }
.chat-card { width:100%; max-width:720px; background:var(--card); border-radius:18px; box-shadow:0 4px 24px rgba(26,25,22,0.08), 0 1px 3px rgba(26,25,22,0.06);
             display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--border); }

.recipient-hdr { flex-shrink:0; padding:14px 18px; border-bottom:1px solid var(--border);
                 display:flex; align-items:center; gap:12px; background:var(--card2); }
.rcpt-av { width:42px; height:42px; border-radius:50%; background:var(--gold); flex-shrink:0;
           display:flex; align-items:center; justify-content:center; color:#fff;
           font-family:'Lora',serif; font-weight:700; font-size:1.1rem; }
.rcpt-info { flex:1; min-width:0; }
.rcpt-name { font-family:'Lora',serif; font-size:.98rem; font-weight:700; color:var(--text); line-height:1.3; }
.rcpt-status { font-size:.73rem; color:var(--text2); display:flex; align-items:center; gap:5px; margin-top:2px; }
.rcpt-dot { width:7px; height:7px; border-radius:50%; background:var(--sage); flex-shrink:0;
            box-shadow:0 0 0 2px rgba(74,122,58,0.2); animation:pulse-dot 2s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.5} }

.thread-wrap { flex:1; overflow:hidden; display:flex; flex-direction:column; min-height:0; }
.thread { flex:1; overflow-y:auto; padding:18px; }
.empty-hint { text-align:center; color:var(--text2); font-size:.84rem; padding:32px 20px; line-height:1.65; }
.empty-hint strong { color:var(--gold); display:block; font-family:'Lora',serif; font-size:1.05rem; margin-bottom:8px; }

.bubble-row { display:flex; margin-bottom:10px; }
.bubble-row.from-admin { justify-content:flex-start; }
.bubble-row.from-user  { justify-content:flex-end; }
.bubble { max-width:78%; padding:10px 14px; border-radius:16px; font-size:.88rem; line-height:1.55; word-break:break-word; white-space:pre-wrap; }
.bubble-row.from-admin .bubble { background:var(--card2); border:1px solid var(--border); border-bottom-left-radius:4px; }
.bubble-row.from-user  .bubble { background:var(--gold); color:#fff; border-bottom-right-radius:4px; }
.bubble img { max-width:100%; border-radius:10px; margin-top:4px; display:block; }
.bubble-time { font-size:.63rem; color:var(--text3); margin-top:3px; display:flex; align-items:center; gap:3px; }
.bubble-row.from-admin .bubble-time { justify-content:flex-start; }
.bubble-row.from-user  .bubble-time { justify-content:flex-end; }
.msg-edited-tag { font-style:italic; opacity:.75; }
.bubble-deleted { font-style:italic; color:var(--text3); background:var(--bg2)!important; }
.msg-menu-wrap { position:relative; align-self:flex-end; }
.msg-menu-btn { background:none; border:none; color:var(--text3); font-size:1rem; cursor:pointer; padding:2px 6px; line-height:1; }
.msg-menu { display:none; position:absolute; right:0; top:100%; background:var(--card); border:1px solid var(--border2); border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.15); z-index:50; min-width:120px; overflow:hidden; }
.msg-menu.open { display:block; }
.msg-menu button { display:block; width:100%; text-align:left; padding:9px 14px; background:none; border:none; font-size:.82rem; color:var(--text); cursor:pointer; }
.msg-menu button:hover { background:var(--bg2); }
.msg-menu button.msg-menu-danger { color:var(--rose); }
.msg-edit-ta { width:100%; min-height:60px; border:1px solid var(--border2); border-radius:8px; padding:8px 10px; font-family:inherit; font-size:.88rem; resize:vertical; background:var(--bg); color:var(--text); }
.msg-edit-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
.msg-edit-actions button { padding:6px 12px; border-radius:8px; font-size:.78rem; font-weight:600; cursor:pointer; border:none; }
.msg-edit-cancel { background:var(--bg2); color:var(--text2); }
.msg-edit-save { background:var(--gold); color:#fff; }
.bubble-sender { font-size:.67rem; color:var(--sage); font-weight:600; margin-bottom:3px; }
.read-tick { font-size:.72rem; }
.read-tick.sent { color:rgba(255,255,255,0.5); }
.read-tick.read { color:#a8e6a0; }

.typing-row { display:flex; margin-bottom:10px; }
.typing-bubble { background:var(--card2); border:1px solid var(--border); border-radius:16px;
                 border-bottom-left-radius:4px; padding:12px 16px; display:flex; gap:5px; align-items:center; }
.typing-dot { width:7px; height:7px; border-radius:50%; background:var(--text3); }
.typing-dot:nth-child(1){ animation:bounce .9s ease-in-out infinite; }
.typing-dot:nth-child(2){ animation:bounce .9s ease-in-out .15s infinite; }
.typing-dot:nth-child(3){ animation:bounce .9s ease-in-out .3s infinite; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

.chip-row { flex-shrink:0; padding:8px 18px 0; display:flex; flex-wrap:wrap; gap:7px; }
.chip { padding:6px 13px; border:1px solid var(--border2); border-radius:999px;
        background:var(--card); font-size:.78rem; color:var(--text2); cursor:pointer;
        transition:all .15s; white-space:nowrap; }
.chip:hover { border-color:var(--gold); color:var(--gold); background:var(--gold-l); }
.chip.sending { opacity:.5; pointer-events:none; }

.input-wrap { flex-shrink:0; border-top:1px solid var(--border); background:var(--card2); padding:10px 16px 14px; }
.input-row { display:flex; gap:8px; align-items:flex-end; }
.attach-btn { width:40px; height:40px; border-radius:50%; background:var(--card); border:1px solid var(--border2);
              color:var(--text2); font-size:1.05rem; cursor:pointer; flex-shrink:0; transition:all .15s; }
.attach-btn:hover { border-color:var(--gold); color:var(--gold); }
.input-row textarea { flex:1; background:var(--card); border:1px solid var(--border); border-radius:14px;
                      color:var(--text); padding:11px 14px; font-family:'Inter',sans-serif;
                      font-size:.88rem; resize:none; outline:none; max-height:140px; overflow-y:auto; transition:border-color .2s; }
.input-row textarea:focus { border-color:rgba(45,79,28,0.35); }
.send-btn { width:40px; height:40px; border-radius:50%; background:var(--gold);
            border:none; color:#fff; font-size:1.05rem; cursor:pointer; flex-shrink:0; transition:background .15s; }
.send-btn:hover { background:#3d6128; }
.send-btn:disabled { opacity:.45; cursor:not-allowed; }
.attach-preview { display:none; align-items:center; gap:8px; padding:8px 12px; background:var(--card); border:1px solid var(--border2); border-radius:10px; margin-bottom:8px; font-size:.78rem; color:var(--text2); }
.attach-preview.on { display:flex; }
.attach-preview img { width:32px; height:32px; border-radius:6px; object-fit:cover; }
.attach-preview button { margin-left:auto; background:none; border:none; color:var(--text3); cursor:pointer; }

@media (max-width:600px){ .chat-outer{ padding:0; } .chat-card{ border-radius:0; border:none; } }
</style>
<script src="protect.js?v=2"></script>
</head>
<body>

<header class="topbar">
  <div class="t-logo">
    <svg width="24" height="24" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="bg-c" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#3d6128"/><stop offset="100%" stop-color="#1e3a10"/></radialGradient></defs><circle cx="60" cy="60" r="58" fill="url(#bg-c)"/><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/><line x1="60" y1="8" x2="60" y2="18" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linecap="round"/><line x1="60" y1="102" x2="60" y2="112" stroke="rgba(255,255,255,0.2)" stroke-width="1.8" stroke-linecap="round"/><line x1="8" y1="60" x2="18" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="1.8" stroke-linecap="round"/><line x1="102" y1="60" x2="112" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="1.8" stroke-linecap="round"/><rect x="57.5" y="60" width="5" height="22" rx="2.5" fill="rgba(255,255,255,0.28)"/><rect x="59" y="34" width="2" height="26" rx="1" fill="white"/><path d="M52 38 L52 50 Q52 53 55 53 L59 53" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/><path d="M68 38 L68 50 Q68 53 65 53 L61 53" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="52" y1="38" x2="52" y2="45" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="68" y1="38" x2="68" y2="45" stroke="white" stroke-width="2" stroke-linecap="round"/><path d="M62 42 C65 38 72 36 72 42 C72 46 67 48 62 48Z" fill="rgba(255,255,255,0.55)"/><circle cx="60" cy="60" r="4.5" fill="#2d4f1c" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/><circle cx="60" cy="60" r="1.5" fill="white" opacity="0.8"/></svg>
    Cap<span> Santé</span>
  </div>
  <a href="dashboard.html" class="t-back">← Retour</a>
</header>

<div class="chat-outer">
  <div class="chat-card">
    <div class="recipient-hdr">
      <div class="rcpt-av">🌱</div>
      <div class="rcpt-info">
        <div class="rcpt-name">Support Cap Santé</div>
        <div class="rcpt-status"><span class="rcpt-dot"></span>Répond généralement en moins de 4h · Lun–Ven 8h–19h</div>
      </div>
    </div>

    <div class="thread-wrap">
      <div class="thread" id="thread"></div>
    </div>

    <div class="chip-row" id="starter-chips">
      <div class="chip" onclick="quickReply('❓ J\'ai une question sur mon plan alimentaire')">❓ Mon plan</div>
      <div class="chip" onclick="quickReply('🎯 Je souhaite modifier mon objectif')">🎯 Objectif</div>
      <div class="chip" onclick="quickReply('📊 Je ne comprends pas mon score santé')">📊 Score</div>
      <div class="chip" onclick="quickReply('🐛 Je rencontre un problème technique')">🐛 Bug</div>
    </div>

    <div class="chip-row" id="quick-react-chips" style="display:none">
      <div class="chip" onclick="quickSend(this,'👍 +1')">👍 +1</div>
      <div class="chip" onclick="quickSend(this,'✅ C\'est noté')">✅ C'est noté</div>
      <div class="chip" onclick="quickSend(this,'🙏 Merci !')">🙏 Merci !</div>
      <div class="chip" onclick="window.location.href='bilan.html'">📊 Voir mon bilan</div>
    </div>

    <div class="input-wrap">
      <div class="attach-preview" id="attach-preview">
        <img id="attach-preview-img" src="" alt="">
        <span id="attach-preview-name"></span>
        <button onclick="clearAttachment()">✕</button>
      </div>
      <div class="input-row">
        <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="Joindre une photo">📎</button>
        <input type="file" id="file-input" accept="image/*" style="display:none" onchange="onFileSelected(this)">
        <textarea id="msg-input" placeholder="Écrivez votre message..." rows="1"
                  onkeydown="handleKey(event)" oninput="onTyping()"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SURL = 'https://ojzjihzsycsfkcsjptrm.supabase.co';
var SKEY = 'sb_publishable_OKU12WCtb6kR3PVJL9Sw0A_s1_ocdhl';
var sb   = supabase.createClient(SURL, SKEY);

var USER = null, PROF = null;
var typingTimeout = null;
var isShowingTyping = false;
var pendingAttachment = null;

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtTime(ts){
  var d = new Date(ts);
  var now = new Date();
  var isToday = d.toDateString() === now.toDateString();
  var t = d.toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'});
  return isToday ? t : d.toLocaleDateString('fr-BE',{day:'numeric',month:'short'})+' '+t;
}
function today(){ var d=new Date(); return d.toISOString().slice(0,10); }

sb.auth.getSession().then(function(r){
  if(!r.data||!r.data.session){ window.location.href='index.html'; return; }
  USER = r.data.session.user;
  loadProfile().then(function(){
    loadMessages().then(function(){
      markReadByUser();
      checkProactiveMessages();
      subscribeRealtime();
    });
  });
});

async function loadProfile(){
  var r = await sb.from('profiles').select('*').eq('id',USER.id).single();
  PROF = r.data || {};
}

async function loadMessages(){
  var r = await sb.from('messages').select('*').eq('user_id',USER.id).order('created_at',{ascending:true});
  var msgs = r.data || [];
  var thread = document.getElementById('thread');

  document.getElementById('starter-chips').style.display = msgs.length ? 'none' : 'flex';
  document.getElementById('quick-react-chips').style.display = msgs.length ? 'flex' : 'none';

  if(!msgs.length){
    thread.innerHTML = '<div class="empty-hint"><strong>Bienvenue dans votre espace assistance</strong>Une vraie personne vous répond ici — pas un robot. Posez votre question ou choisissez un sujet ci-dessous.</div>';
    return;
  }

  thread.innerHTML = msgs.map(function(m){
    var isAdmin = m.is_admin_sender;
    var readTick = !isAdmin ? '<span class="read-tick '+(m.read_by_admin?'read':'sent')+'">'+(m.read_by_admin?'\u2713\u2713':'\u2713')+'</span>' : '';
    var isMine = m.sender_id===USER.id;
    var isDeleted = !!m.deleted_at;
    var withinEditWindow = isMine && !isDeleted && (Date.now()-new Date(m.created_at).getTime()) < 5*60*1000;
    var editedTag = m.edited_at ? '<span class="msg-edited-tag"> \u00b7 modifi\u00e9</span>' : '';

    if(isDeleted){
      return '<div class="bubble-row '+(isAdmin?'from-admin':'from-user')+'">'
        +'<div><div class="bubble bubble-deleted">Message supprim\u00e9</div>'
        +'<div class="bubble-time">'+fmtTime(m.created_at)+'</div></div>'
        +'</div>';
    }

    var attachHtml = m.attachment_url ? '<img src="'+esc(m.attachment_url)+'" alt="Pi\u00e8ce jointe">' : '';
    var menuHtml = isMine ? (
      '<div class="msg-menu-wrap">'
        +'<button class="msg-menu-btn" onclick="toggleMsgMenu(\''+m.id+'\')">\u22ef</button>'
        +'<div class="msg-menu" id="msg-menu-'+m.id+'">'
          +(withinEditWindow ? '<button onclick="startEditMessage(\''+m.id+'\')">Modifier</button>' : '')
          +'<button onclick="deleteMessage(\''+m.id+'\')" class="msg-menu-danger">Supprimer</button>'
        +'</div>'
      +'</div>'
    ) : '';

    return '<div class="bubble-row '+(isAdmin?'from-admin':'from-user')+'">'
      +'<div><div class="bubble" id="bubble-content-'+m.id+'">'+(isAdmin?'<div class="bubble-sender">Support Cap Sant\u00e9</div>':'')+esc(m.content)+attachHtml+'</div>'
      +'<div class="bubble-time">'+fmtTime(m.created_at)+editedTag+' '+readTick+'</div></div>'
      +menuHtml
      +'</div>';
  }).join('');
  thread.scrollTop = thread.scrollHeight;
}

// Menu \u00b7\u00b7\u00b7 (modifier/supprimer) \u2014 un seul ouvert \u00e0 la fois.
function toggleMsgMenu(id){
  var allMenus = document.querySelectorAll('.msg-menu.open');
  allMenus.forEach(function(el){ if(el.id!=='msg-menu-'+id) el.classList.remove('open'); });
  var menu = document.getElementById('msg-menu-'+id);
  if(menu) menu.classList.toggle('open');
}
document.addEventListener('click', function(e){
  if(!e.target.closest('.msg-menu-wrap')){
    document.querySelectorAll('.msg-menu.open').forEach(function(el){ el.classList.remove('open'); });
  }
});

function startEditMessage(id){
  toggleMsgMenu(id);
  var bubbleEl = document.getElementById('bubble-content-'+id);
  var currentText = bubbleEl.textContent;
  bubbleEl.innerHTML = '<textarea id="edit-ta-'+id+'" class="msg-edit-ta">'+esc(currentText)+'</textarea>'
    +'<div class="msg-edit-actions">'
      +'<button onclick="cancelEditMessage()" class="msg-edit-cancel">Annuler</button>'
      +'<button onclick="saveEditMessage(\''+id+'\')" class="msg-edit-save">Enregistrer</button>'
    +'</div>';
  document.getElementById('edit-ta-'+id).focus();
}
function cancelEditMessage(){
  loadMessages();
}
async function saveEditMessage(id){
  var ta = document.getElementById('edit-ta-'+id);
  var newContent = ta.value.trim();
  if(!newContent){ return; }
  var r = await sb.from('messages').update({content:newContent, edited_at:new Date().toISOString()}).eq('id',id);
  if(r.error){ toast('\u26a0\ufe0f Modification impossible : '+r.error.message); return; }
  loadMessages();
}
async function deleteMessage(id){
  toggleMsgMenu(id);
  if(!confirm('Supprimer ce message ?')) return;
  var r = await sb.from('messages').update({deleted_at:new Date().toISOString()}).eq('id',id);
  if(r.error){ toast('\u26a0\ufe0f Suppression impossible : '+r.error.message); return; }
  loadMessages();
}

async function checkProactiveMessages(){
  var p = PROF || {};
  var key = 'cs_proactive_'+USER.id;
  var sent = JSON.parse(localStorage.getItem(key)||'{}');

  var r = await sb.from('messages').select('id').eq('user_id',USER.id).limit(1);
  var hasMessages = (r.data||[]).length > 0;

  if(!hasMessages && !sent.welcome){
    await sendAutoMessage('Bienvenue sur Cap Santé ! 👋 Je suis Arnaud, votre diététicien. N\'hésitez pas à me poser toutes vos questions sur votre plan alimentaire, votre score ou vos objectifs. Je réponds généralement sous 4h du lundi au vendredi.');
    sent.welcome = true;
    localStorage.setItem(key, JSON.stringify(sent));
    await loadMessages();
    return;
  }

  if(!sent['inactive_'+today()]){
    var since2 = new Date(); since2.setDate(since2.getDate()-2);
    var jRes = await sb.from('journal').select('date').eq('user_id',USER.id).gte('date',since2.toISOString().slice(0,10)).limit(1);
    if((jRes.data||[]).length === 0 && p.prenom){
      await sendAutoMessage('Bonjour '+p.prenom+' ! 🔥 Vous n\'avez pas enregistré de repas depuis 2 jours. Reprendre le suivi même partiellement aide à maintenir vos progrès. Comment se passe votre semaine ?');
      sent['inactive_'+today()] = true;
      localStorage.setItem(key, JSON.stringify(sent));
      await loadMessages();
      return;
    }
  }

  var joursFR = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  var todayName = joursFR[new Date().getDay()];
  if((p.jour_bilan||'dimanche') === todayName && !sent['bilan_'+today()]){
    var bilanRes = await sb.from('bilans').select('id').eq('user_id',USER.id).eq('date',today()).limit(1);
    if((bilanRes.data||[]).length === 0 && p.prenom){
      await sendAutoMessage('C\'est votre jour de bilan '+p.prenom+' ! 📊 Prenez quelques minutes pour faire le point sur votre semaine — cela permet d\'ajuster votre plan si besoin. Bonne semaine !');
      sent['bilan_'+today()] = true;
      localStorage.setItem(key, JSON.stringify(sent));
      await loadMessages();
    }
  }
}

async function sendAutoMessage(content){
  await sb.from('messages').insert({
    user_id: USER.id,
    sender_id: '00000000-0000-0000-0000-000000000000',
    is_admin_sender: true,
    content: content,
    read_by_user: false,
    read_by_admin: true
  });
}

function handleKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }

function onTyping(){
  var el = document.getElementById('msg-input');
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
  sb.channel('typing').send({
    type:'broadcast', event:'typing',
    payload:{user_id:USER.id, name:(PROF&&PROF.prenom)||'Utilisateur'}
  });
}

function quickReply(text){
  var input = document.getElementById('msg-input');
  input.value = text;
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
  input.focus();
}

async function quickSend(chipEl, text){
  chipEl.classList.add('sending');
  await sb.from('messages').insert({
    user_id: USER.id, sender_id: USER.id, is_admin_sender: false,
    content: text, read_by_user: true, read_by_admin: false
  });
  chipEl.classList.remove('sending');
  loadMessages();
}

function onFileSelected(input){
  var file = input.files[0];
  if(!file) return;
  pendingAttachment = file;
  var reader = new FileReader();
  reader.onload = function(e){
    document.getElementById('attach-preview-img').src = e.target.result;
    document.getElementById('attach-preview-name').textContent = file.name;
    document.getElementById('attach-preview').classList.add('on');
  };
  reader.readAsDataURL(file);
}
function clearAttachment(){
  pendingAttachment = null;
  document.getElementById('file-input').value = '';
  document.getElementById('attach-preview').classList.remove('on');
}

async function sendMessage(){
  var input = document.getElementById('msg-input');
  var content = input.value.trim();
  if(!content && !pendingAttachment) return;
  var btn = document.getElementById('send-btn');
  btn.disabled = true;

  var attachmentUrl = null;
  if(pendingAttachment){
    var path = USER.id+'/'+Date.now()+'_'+pendingAttachment.name;
    var upl = await sb.storage.from('chat-attachments').upload(path, pendingAttachment);
    if(!upl.error){
      var pub = sb.storage.from('chat-attachments').getPublicUrl(path);
      attachmentUrl = pub.data.publicUrl;
    } else {
      console.warn('[Cap Santé] echec upload piece jointe:', upl.error.message);
    }
  }

  var r = await sb.from('messages').insert({
    user_id: USER.id,
    sender_id: USER.id,
    is_admin_sender: false,
    content: content || '📷 Photo',
    attachment_url: attachmentUrl,
    read_by_user: true,
    read_by_admin: false
  }).select().single();
  btn.disabled = false;
  if(r.error){ alert('Erreur : '+r.error.message); return; }
  input.value = '';
  input.style.height = 'auto';
  clearAttachment();
  notifyByEmail(r.data.id);
  loadMessages();
}

async function notifyByEmail(messageId){
  try{
    var session = await sb.auth.getSession();
    var token = session.data.session.access_token;
    await fetch(SURL+'/functions/v1/notify-message', {
      method:'POST',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body: JSON.stringify({ message_id: messageId })
    });
  }catch(e){ console.warn('[Cap Santé] notification email non envoyee:', e); }
}

async function markReadByUser(){
  await sb.from('messages')
    .update({read_by_user:true})
    .eq('user_id',USER.id)
    .eq('is_admin_sender',true)
    .eq('read_by_user',false);
}

function subscribeRealtime(){
  sb.channel('chat-'+USER.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',
        filter:'user_id=eq.'+USER.id}, function(payload){
      if(payload.new && payload.new.is_admin_sender){
        showTypingIndicator();
        setTimeout(function(){
          hideTypingIndicator();
          loadMessages();
          markReadByUser();
        }, 1200);
      } else {
        loadMessages();
      }
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',
        filter:'user_id=eq.'+USER.id}, function(){
      loadMessages();
    })
    .subscribe();
}

function showTypingIndicator(){
  if(isShowingTyping) return;
  isShowingTyping = true;
  var thread = document.getElementById('thread');
  var row = document.createElement('div');
  row.className = 'typing-row';
  row.id = 'typing-indicator';
  row.innerHTML = '<div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;
}
function hideTypingIndicator(){
  isShowingTyping = false;
  var el = document.getElementById('typing-indicator');
  if(el) el.remove();
}
</script>
</body>
</html>
