<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cap Sant&#233; &#8212; Discussion</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Palette calquée sur WhatsApp : vert-teal foncé (en-tête), fond à
   motif clair (wallpaper), bulle verte pour l'envoyé, blanche pour le
   reçu, coches de lecture bleues. */
:root {
  --wa-header:#075e54; --wa-header-d:#054c44; --wa-accent:#25d366;
  --wa-wallpaper:#e5ddd5; --wa-sent:#dcf8c6; --wa-received:#ffffff;
  --wa-tick-sent:#8696a0; --wa-tick-read:#53bdeb;
  --bg2:#f0ede6; --card:#ffffff; --card2:#f8f6f1;
  --border:rgba(26,25,22,0.1); --border2:rgba(0,0,0,0.08);
  --text:#111b21; --text2:#54656f; --text3:#8696a0;
  --rose:#c0392b;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { background:var(--wa-wallpaper); height:100%; }
body { font-family:'Inter',sans-serif; color:var(--text); -webkit-font-smoothing:antialiased;
       display:flex; flex-direction:column; height:100vh; overflow:hidden; }

.t-back { font-size:1.3rem; color:#fff; text-decoration:none; line-height:1;
          width:32px; height:32px; display:flex; align-items:center; justify-content:center;
          border-radius:50%; flex-shrink:0; transition:background .15s; }
.t-back:hover { background:rgba(255,255,255,0.12); }

.chat-outer { flex:1; overflow:hidden; display:flex; justify-content:center; background:var(--wa-wallpaper);
  background-image:
    radial-gradient(circle at 8% 12%, rgba(0,0,0,0.028) 0, transparent 40%),
    radial-gradient(circle at 32% 68%, rgba(0,0,0,0.028) 0, transparent 42%),
    radial-gradient(circle at 78% 22%, rgba(0,0,0,0.028) 0, transparent 40%),
    radial-gradient(circle at 62% 82%, rgba(0,0,0,0.028) 0, transparent 42%),
    radial-gradient(circle at 92% 55%, rgba(0,0,0,0.028) 0, transparent 40%);
  background-size:220px 220px; }
.chat-card { width:100%; max-width:760px; background:transparent;
             display:flex; flex-direction:column; overflow:hidden; }

.recipient-hdr { flex-shrink:0; padding:8px 14px; background:var(--wa-header);
                 display:flex; align-items:center; gap:12px; color:#fff; }
.rcpt-av { width:38px; height:38px; border-radius:50%; background:#ffffff33; flex-shrink:0;
           display:flex; align-items:center; justify-content:center; color:#fff;
           font-weight:700; font-size:1.1rem; }
.rcpt-info { flex:1; min-width:0; }
.rcpt-name { font-size:.94rem; font-weight:600; color:#fff; line-height:1.3; }
.rcpt-status { font-size:.72rem; color:rgba(255,255,255,0.75); display:flex; align-items:center; gap:5px; margin-top:1px; }
.rcpt-dot { width:6px; height:6px; border-radius:50%; background:#8bffb0; flex-shrink:0;
            box-shadow:0 0 0 2px rgba(139,255,176,0.25); animation:pulse-dot 2s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.5} }

.thread-wrap { flex:1; overflow:hidden; display:flex; flex-direction:column; min-height:0; }
.thread { flex:1; overflow-y:auto; padding:14px 6% 14px; }
.empty-hint { text-align:center; color:var(--text2); font-size:.84rem; padding:32px 20px; line-height:1.65;
  background:#fff7d6; border-radius:8px; margin:20px auto; max-width:480px; }
.empty-hint strong { color:var(--text); display:block; font-size:1.02rem; margin-bottom:8px; font-weight:700; }

.bubble-row { display:flex; margin-bottom:3px; }
.bubble-row.from-admin { justify-content:flex-start; }
.bubble-row.from-user  { justify-content:flex-end; }
.bubble { position:relative; max-width:75%; padding:7px 9px 8px 9px; border-radius:8px; font-size:.9rem; line-height:1.42; overflow-wrap:break-word; word-break:normal; white-space:pre-wrap; box-shadow:0 1px 1px rgba(0,0,0,0.08); }
.bubble-emoji-only { background:none!important; box-shadow:none!important; padding:2px 0!important; font-size:2.4rem!important; line-height:1.2!important; }
.bubble-row.from-admin .bubble { background:var(--wa-received); border-top-left-radius:2px; }
.bubble-row.from-user  .bubble { background:var(--wa-sent); border-top-right-radius:2px; }
/* Petite pointe de bulle, comme WhatsApp */
.bubble-row.from-admin .bubble::before {
  content:''; position:absolute; top:0; left:-7px; width:12px; height:12px;
  background:var(--wa-received); clip-path:polygon(100% 0, 0 0, 100% 100%);
}
.bubble-row.from-user .bubble::before {
  content:''; position:absolute; top:0; right:-7px; width:12px; height:12px;
  background:var(--wa-sent); clip-path:polygon(0 0, 100% 0, 0 100%);
}
.bubble img { max-width:100%; border-radius:6px; margin-top:4px; display:block; }
.bubble-time { font-size:.66rem; color:rgba(0,0,0,0.4); margin-top:2px; display:flex; align-items:center; gap:3px; float:right; padding-left:8px; }
.msg-edited-tag { font-style:italic; opacity:.8; }
.bubble-deleted { font-style:italic; color:var(--text3); background:#f0f0f0!important; }
.msg-menu-wrap { position:relative; align-self:flex-end; }
.msg-menu-btn { background:none; border:none; color:var(--text3); font-size:1rem; cursor:pointer; padding:2px 6px; line-height:1; }
.msg-menu { display:none; position:absolute; right:0; top:100%; background:var(--card); border:1px solid var(--border2); border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.15); z-index:50; min-width:120px; overflow:hidden; }
.msg-menu.open { display:block; }
.msg-menu button { display:block; width:100%; text-align:left; padding:9px 14px; background:none; border:none; font-size:.82rem; color:var(--text); cursor:pointer; }
.msg-menu button:hover { background:var(--bg2); }
.msg-menu button.msg-menu-danger { color:var(--rose); }
.msg-edit-ta { width:100%; min-height:60px; border:1px solid var(--border2); border-radius:8px; padding:8px 10px; font-family:inherit; font-size:.88rem; resize:vertical; background:#fff; color:var(--text); }
.msg-edit-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
.msg-edit-actions button { padding:6px 12px; border-radius:8px; font-size:.78rem; font-weight:600; cursor:pointer; border:none; }
.msg-edit-cancel { background:var(--bg2); color:var(--text2); }
.msg-edit-save { background:var(--wa-header); color:#fff; }
.bubble-sender { font-size:.72rem; color:var(--wa-header); font-weight:700; margin-bottom:2px; }
.read-tick { font-size:.78rem; }
.read-tick.sent { color:var(--wa-tick-sent); }
.read-tick.read { color:var(--wa-tick-read); }

.typing-row { display:flex; margin-bottom:6px; }
.typing-bubble { background:var(--wa-received); border-radius:8px; border-top-left-radius:2px;
                 padding:10px 14px; display:flex; gap:5px; align-items:center; box-shadow:0 1px 1px rgba(0,0,0,0.08); }
.typing-dot { width:7px; height:7px; border-radius:50%; background:var(--text3); }
.typing-dot:nth-child(1){ animation:bounce .9s ease-in-out infinite; }
.typing-dot:nth-child(2){ animation:bounce .9s ease-in-out .15s infinite; }
.typing-dot:nth-child(3){ animation:bounce .9s ease-in-out .3s infinite; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

.chip-row { flex-shrink:0; padding:8px 6% 0; display:flex; flex-wrap:wrap; gap:7px; }
.chip { padding:6px 13px; border:1px solid var(--border2); border-radius:999px;
        background:#fff; font-size:.78rem; color:var(--text2); cursor:pointer;
        transition:all .15s; white-space:nowrap; }
.chip:hover { border-color:var(--wa-header); color:var(--wa-header); background:#f0fdf7; }
.chip.sending { opacity:.5; pointer-events:none; }

.input-wrap { flex-shrink:0; background:var(--bg2); padding:8px 10px 10px; }
.input-row { display:flex; gap:8px; align-items:flex-end; }
.attach-btn { width:40px; height:40px; border-radius:50%; background:none; border:none;
              color:var(--text2); font-size:1.2rem; cursor:pointer; flex-shrink:0; transition:all .15s; }
.attach-btn:hover { color:var(--wa-header); }
.input-row textarea { flex:1; background:#fff; border:none; border-radius:22px;
                      color:var(--text); padding:11px 16px; font-family:'Inter',sans-serif;
                      font-size:.9rem; resize:none; outline:none; max-height:140px; overflow-y:auto; box-shadow:0 1px 1px rgba(0,0,0,0.06); }
.send-btn { width:42px; height:42px; border-radius:50%; background:var(--wa-accent);
            border:none; color:#fff; font-size:1.1rem; cursor:pointer; flex-shrink:0; transition:background .15s; }
.send-btn:hover { background:#1fb955; }
.send-btn:disabled { opacity:.45; cursor:not-allowed; }
.attach-preview { display:none; align-items:center; gap:8px; padding:8px 12px; background:#fff; border-radius:10px; margin-bottom:8px; font-size:.78rem; color:var(--text2); }
.attach-preview.on { display:flex; }
.attach-preview img { width:32px; height:32px; border-radius:6px; object-fit:cover; }
.attach-preview button { margin-left:auto; background:none; border:none; color:var(--text3); cursor:pointer; }

@media (max-width:600px){ .chat-card{ max-width:100%; } }
</style>
<script src="protect.js?v=2"></script>
</head>
<body>

<div class="chat-outer">
  <div class="chat-card">
    <div class="recipient-hdr">
      <a href="dashboard.html" class="t-back">&#8592;</a>
      <div class="rcpt-av">&#127793;</div>
      <div class="rcpt-info">
        <div class="rcpt-name">Support Cap Sant&#233;</div>
        <div class="rcpt-status"><span class="rcpt-dot"></span>R&#233;pond g&#233;n&#233;ralement en moins de 4h &#183; Lun&#8211;Ven 8h&#8211;19h</div>
      </div>
    </div>

    <div class="thread-wrap">
      <div class="thread" id="thread"></div>
    </div>

    <div class="chip-row" id="starter-chips">
      <div class="chip" onclick="quickReply('&#10067; J\'ai une question sur mon plan alimentaire')">&#10067; Mon plan</div>
      <div class="chip" onclick="quickReply('&#127919; Je souhaite modifier mon objectif')">&#127919; Objectif</div>
      <div class="chip" onclick="quickReply('&#128202; Je ne comprends pas mon score sant&#233;')">&#128202; Score</div>
      <div class="chip" onclick="quickReply('&#128027; Je rencontre un probl&#232;me technique')">&#128027; Bug</div>
    </div>

    <div class="chip-row" id="quick-react-chips" style="display:none">
      <div class="chip" onclick="quickSend(this,'&#128077; +1')">&#128077; +1</div>
      <div class="chip" onclick="quickSend(this,'&#9989; C\'est not&#233;')">&#9989; C'est not&#233;</div>
      <div class="chip" onclick="quickSend(this,'&#128591; Merci !')">&#128591; Merci !</div>
      <div class="chip" onclick="window.location.href='bilan.html'">&#128202; Voir mon bilan</div>
    </div>

    <div class="input-wrap">
      <div class="attach-preview" id="attach-preview">
        <img id="attach-preview-img" src="" alt="">
        <span id="attach-preview-name"></span>
        <button onclick="clearAttachment()">&#10005;</button>
      </div>
      <div class="input-row">
        <button class="attach-btn" onclick="document.getElementById('file-input').click()" title="Joindre une photo">&#128206;</button>
        <input type="file" id="file-input" accept="image/*" style="display:none" onchange="onFileSelected(this)">
        <textarea id="msg-input" placeholder="&#201;crivez votre message..." rows="1"
                  onkeydown="handleKey(event)" oninput="onTyping()"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">&#10148;</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SURL = 'https://ojzjihzsycsfkcsjptrm.supabase.co';
var SKEY = 'sb_publishable_OKU12WCtb6kR3PVJL9Sw0A_s1_ocdhl';
var sb   = supabase.createClient(SURL, SKEY);

var USER = null, PROF = null;
var typingTimeout = null;
var isShowingTyping = false;
var pendingAttachment = null;

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Supabase renvoie parfois created_at SANS indicateur de fuseau (ex:
// "2026-08-05T06:55:32.38"), que JavaScript interpr\u00e8te alors comme une
// heure LOCALE au lieu d'UTC \u2014 d\u00e9calage d'environ 2h en \u00e9t\u00e9 (CEST). Cette
// fonction force l'interpr\u00e9tation UTC dans tous les cas, qu'il y ait d\u00e9j\u00e0
// un "Z"/d\u00e9calage ou non.
function parseUTC(ts){
  if(!ts) return new Date(NaN);
  var s = String(ts);
  if(!/[Zz]|[+-]\d\d:?\d\d$/.test(s)) s += 'Z';
  return new Date(s);
}
function fmtTime(ts){
  var d = parseUTC(ts);
  var now = new Date();
  var isToday = d.toLocaleDateString('fr-BE',{timeZone:'Europe/Brussels'}) === now.toLocaleDateString('fr-BE',{timeZone:'Europe/Brussels'});
  var t = d.toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Brussels'});
  return isToday ? t : d.toLocaleDateString('fr-BE',{day:'numeric',month:'short',timeZone:'Europe/Brussels'})+' '+t;
}
function today(){ var d=new Date(); return d.toISOString().slice(0,10); }

sb.auth.getSession().then(function(r){
  if(!r.data||!r.data.session){ window.location.href='index.html'; return; }
  USER = r.data.session.user;
  loadProfile().then(function(){
    loadMessages().then(function(){
      markReadByUser();
      checkProactiveMessages();
      subscribeRealtime();
    });
  });
});

async function loadProfile(){
  var r = await sb.from('profiles').select('*').eq('id',USER.id).single();
  PROF = r.data || {};
}

async function loadMessages(){
  var r = await sb.from('messages').select('*').eq('user_id',USER.id).order('created_at',{ascending:true});
  var msgs = r.data || [];
  var thread = document.getElementById('thread');

  document.getElementById('starter-chips').style.display = msgs.length ? 'none' : 'flex';
  document.getElementById('quick-react-chips').style.display = msgs.length ? 'flex' : 'none';

  if(!msgs.length){
    thread.innerHTML = '<div class="empty-hint"><strong>Bienvenue dans votre espace assistance</strong>Une vraie personne vous r\u00e9pond ici \u2014 pas un robot. Posez votre question ou choisissez un sujet ci-dessous.</div>';
    return;
  }

  thread.innerHTML = msgs.map(function(m){
    var isAdmin = m.is_admin_sender;
    var readTick = !isAdmin ? '<span class="read-tick '+(m.read_by_admin?'read':'sent')+'">'+(m.read_by_admin?'\u2713\u2713':'\u2713')+'</span>' : '';
    var isMine = m.sender_id===USER.id;
    var isDeleted = !!m.deleted_at;
    var withinEditWindow = isMine && !isDeleted && (Date.now()-parseUTC(m.created_at).getTime()) < 5*60*1000;
    var editedTag = m.edited_at ? '<span class="msg-edited-tag"> \u00b7 modifi\u00e9</span>' : '';

    if(isDeleted){
      return '<div class="bubble-row '+(isAdmin?'from-admin':'from-user')+'">'
        +'<div><div class="bubble bubble-deleted">Message supprim\u00e9</div>'
        +'<div class="bubble-time">'+fmtTime(m.created_at)+'</div></div>'
        +'</div>';
    }

    var attachHtml = m.attachment_url ? '<img src="'+esc(m.attachment_url)+'" alt="Pi\u00e8ce jointe">' : '';
    // Message compos\u00e9 UNIQUEMENT d'emoji(s) \u2192 affich\u00e9 en grand, sans fond de
    // bulle, comme dans WhatsApp/iMessage. Pas appliqu\u00e9 aux messages admin
    // (qui ont d\u00e9j\u00e0 le libell\u00e9 "Support Cap Sant\u00e9" \u00e0 l'int\u00e9rieur de la bulle).
    var isEmojiOnly = !isAdmin && !!m.content && !m.attachment_url && /^(?:\s*(?:\p{Extended_Pictographic}|\u200d|\ufe0f)\s*)+$/u.test(m.content);
    var bubbleCls = 'bubble' + (isEmojiOnly ? ' bubble-emoji-only' : '');
    var menuHtml = isMine ? (
      '<div class="msg-menu-wrap">'
        +'<button class="msg-menu-btn" onclick="toggleMsgMenu(\''+m.id+'\')">\u22ef</button>'
        +'<div class="msg-menu" id="msg-menu-'+m.id+'">'
          +(withinEditWindow ? '<button onclick="startEditMessage(\''+m.id+'\')">Modifier</button>' : '')
          +'<button onclick="deleteMessage(\''+m.id+'\')" class="msg-menu-danger">Supprimer</button>'
        +'</div>'
      +'</div>'
    ) : '';

    return '<div class="bubble-row '+(isAdmin?'from-admin':'from-user')+'">'
      +'<div><div class="'+bubbleCls+'" id="bubble-content-'+m.id+'">'+(isAdmin?'<div class="bubble-sender">Support Cap Sant\u00e9</div>':'')+esc(m.content)+attachHtml+'</div>'
      +'<div class="bubble-time">'+fmtTime(m.created_at)+editedTag+' '+readTick+'</div></div>'
      +menuHtml
      +'</div>';
  }).join('');
  thread.scrollTop = thread.scrollHeight;
}

// Menu \u00b7\u00b7\u00b7 (modifier/supprimer) \u2014 un seul ouvert \u00e0 la fois.
function toggleMsgMenu(id){
  var allMenus = document.querySelectorAll('.msg-menu.open');
  allMenus.forEach(function(el){ if(el.id!=='msg-menu-'+id) el.classList.remove('open'); });
  var menu = document.getElementById('msg-menu-'+id);
  if(menu) menu.classList.toggle('open');
}
document.addEventListener('click', function(e){
  if(!e.target.closest('.msg-menu-wrap')){
    document.querySelectorAll('.msg-menu.open').forEach(function(el){ el.classList.remove('open'); });
  }
});

function startEditMessage(id){
  toggleMsgMenu(id);
  var bubbleEl = document.getElementById('bubble-content-'+id);
  var currentText = bubbleEl.textContent;
  bubbleEl.innerHTML = '<textarea id="edit-ta-'+id+'" class="msg-edit-ta">'+esc(currentText)+'</textarea>'
    +'<div class="msg-edit-actions">'
      +'<button onclick="cancelEditMessage()" class="msg-edit-cancel">Annuler</button>'
      +'<button onclick="saveEditMessage(\''+id+'\')" class="msg-edit-save">Enregistrer</button>'
    +'</div>';
  document.getElementById('edit-ta-'+id).focus();
}
function cancelEditMessage(){
  loadMessages();
}
async function saveEditMessage(id){
  var ta = document.getElementById('edit-ta-'+id);
  var newContent = ta.value.trim();
  if(!newContent){ return; }
  var r = await sb.from('messages').update({content:newContent, edited_at:new Date().toISOString()}).eq('id',id);
  if(r.error){ toast('\u26a0\ufe0f Modification impossible : '+r.error.message); return; }
  loadMessages();
}
async function deleteMessage(id){
  toggleMsgMenu(id);
  if(!confirm('Supprimer ce message ?')) return;
  var r = await sb.from('messages').update({deleted_at:new Date().toISOString()}).eq('id',id);
  if(r.error){ toast('\u26a0\ufe0f Suppression impossible : '+r.error.message); return; }
  loadMessages();
}

async function checkProactiveMessages(){
  var p = PROF || {};
  var key = 'cs_proactive_'+USER.id;
  var sent = JSON.parse(localStorage.getItem(key)||'{}');

  var r = await sb.from('messages').select('id').eq('user_id',USER.id).limit(1);
  var hasMessages = (r.data||[]).length > 0;

  if(!hasMessages && !sent.welcome){
    await sendAutoMessage('Bienvenue sur Cap Sant\u00e9 ! \ud83d\udc4b Je suis Arnaud, votre di\u00e9t\u00e9ticien. N\'h\u00e9sitez pas \u00e0 me poser toutes vos questions sur votre plan alimentaire, votre score ou vos objectifs. Je r\u00e9ponds g\u00e9n\u00e9ralement sous 4h du lundi au vendredi.');
    sent.welcome = true;
    localStorage.setItem(key, JSON.stringify(sent));
    await loadMessages();
    return;
  }

  if(!sent['inactive_'+today()]){
    var since2 = new Date(); since2.setDate(since2.getDate()-2);
    var jRes = await sb.from('journal').select('date').eq('user_id',USER.id).gte('date',since2.toISOString().slice(0,10)).limit(1);
    if((jRes.data||[]).length === 0 && p.prenom){
      await sendAutoMessage('Bonjour '+p.prenom+' ! \ud83d\udd25 Vous n\'avez pas enregistr\u00e9 de repas depuis 2 jours. Reprendre le suivi m\u00eame partiellement aide \u00e0 maintenir vos progr\u00e8s. Comment se passe votre semaine ?');
      sent['inactive_'+today()] = true;
      localStorage.setItem(key, JSON.stringify(sent));
      await loadMessages();
      return;
    }
  }

  var joursFR = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  var todayName = joursFR[new Date().getDay()];
  if((p.jour_bilan||'dimanche') === todayName && !sent['bilan_'+today()]){
    var bilanRes = await sb.from('bilans').select('id').eq('user_id',USER.id).eq('date',today()).limit(1);
    if((bilanRes.data||[]).length === 0 && p.prenom){
      await sendAutoMessage('C\'est votre jour de bilan '+p.prenom+' ! \ud83d\udcca Prenez quelques minutes pour faire le point sur votre semaine \u2014 cela permet d\'ajuster votre plan si besoin. Bonne semaine !');
      sent['bilan_'+today()] = true;
      localStorage.setItem(key, JSON.stringify(sent));
      await loadMessages();
    }
  }
}

async function sendAutoMessage(content){
  await sb.from('messages').insert({
    user_id: USER.id,
    sender_id: '00000000-0000-0000-0000-000000000000',
    is_admin_sender: true,
    content: content,
    read_by_user: false,
    read_by_admin: true
  });
}

function handleKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }

function onTyping(){
  var el = document.getElementById('msg-input');
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
  sb.channel('typing').send({
    type:'broadcast', event:'typing',
    payload:{user_id:USER.id, name:(PROF&&PROF.prenom)||'Utilisateur'}
  });
}

function quickReply(text){
  var input = document.getElementById('msg-input');
  input.value = text;
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 'px';
  input.focus();
}

async function quickSend(chipEl, text){
  chipEl.classList.add('sending');
  await sb.from('messages').insert({
    user_id: USER.id, sender_id: USER.id, is_admin_sender: false,
    content: text, read_by_user: true, read_by_admin: false
  });
  chipEl.classList.remove('sending');
  loadMessages();
}

function onFileSelected(input){
  var file = input.files[0];
  if(!file) return;
  pendingAttachment = file;
  var reader = new FileReader();
  reader.onload = function(e){
    document.getElementById('attach-preview-img').src = e.target.result;
    document.getElementById('attach-preview-name').textContent = file.name;
    document.getElementById('attach-preview').classList.add('on');
  };
  reader.readAsDataURL(file);
}
function clearAttachment(){
  pendingAttachment = null;
  document.getElementById('file-input').value = '';
  document.getElementById('attach-preview').classList.remove('on');
}

async function sendMessage(){
  var input = document.getElementById('msg-input');
  var content = input.value.trim();
  if(!content && !pendingAttachment) return;
  var btn = document.getElementById('send-btn');
  btn.disabled = true;

  var attachmentUrl = null;
  if(pendingAttachment){
    var path = USER.id+'/'+Date.now()+'_'+pendingAttachment.name;
    var upl = await sb.storage.from('chat-attachments').upload(path, pendingAttachment);
    if(!upl.error){
      var pub = sb.storage.from('chat-attachments').getPublicUrl(path);
      attachmentUrl = pub.data.publicUrl;
    } else {
      console.warn('[Cap Sant\u00e9] echec upload piece jointe:', upl.error.message);
    }
  }

  var r = await sb.from('messages').insert({
    user_id: USER.id,
    sender_id: USER.id,
    is_admin_sender: false,
    content: content || '\ud83d\udcf7 Photo',
    attachment_url: attachmentUrl,
    read_by_user: true,
    read_by_admin: false
  }).select().single();
  btn.disabled = false;
  if(r.error){ alert('Erreur : '+r.error.message); return; }
  input.value = '';
  input.style.height = 'auto';
  clearAttachment();
  notifyByEmail(r.data.id);
  loadMessages();
}

async function notifyByEmail(messageId){
  try{
    var session = await sb.auth.getSession();
    var token = session.data.session.access_token;
    await fetch(SURL+'/functions/v1/notify-message', {
      method:'POST',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body: JSON.stringify({ message_id: messageId })
    });
  }catch(e){ console.warn('[Cap Sant\u00e9] notification email non envoyee:', e); }
}

async function markReadByUser(){
  await sb.from('messages')
    .update({read_by_user:true})
    .eq('user_id',USER.id)
    .eq('is_admin_sender',true)
    .eq('read_by_user',false);
}

function subscribeRealtime(){
  sb.channel('chat-'+USER.id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',
        filter:'user_id=eq.'+USER.id}, function(payload){
      if(payload.new && payload.new.is_admin_sender){
        showTypingIndicator();
        setTimeout(function(){
          hideTypingIndicator();
          loadMessages();
          markReadByUser();
        }, 1200);
      } else {
        loadMessages();
      }
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',
        filter:'user_id=eq.'+USER.id}, function(){
      loadMessages();
    })
    .subscribe();
}

function showTypingIndicator(){
  if(isShowingTyping) return;
  isShowingTyping = true;
  var thread = document.getElementById('thread');
  var row = document.createElement('div');
  row.className = 'typing-row';
  row.id = 'typing-indicator';
  row.innerHTML = '<div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  thread.appendChild(row);
  thread.scrollTop = thread.scrollHeight;
}
function hideTypingIndicator(){
  isShowingTyping = false;
  var el = document.getElementById('typing-indicator');
  if(el) el.remove();
}
</script>
</body>
